      <ellipse cx="0" cy="0" rx="12" ry="5" fill="none" stroke="#0088CC" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="12" ry="5" transform="rotate(60)" fill="none" stroke="#0088CC" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="12" ry="5" transform="rotate(120)" fill="none" stroke="#0088CC" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2.5" fill="#0088CC" />
      <text class="node-label" x="0" y="46" font-size="21" fill="#1F2328" text-anchor="middle">React</text>
    </g>

