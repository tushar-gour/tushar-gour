    <text class="mono-hdr" x="1104" y="0" font-size="14" fill="#8C959F" text-anchor="end">SIGNAL TRANSMISSION</text>
  </g>

  <line x1="48" y1="62" x2="1152" y2="62" stroke="#E1E4E8" stroke-width="1" />

