<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .lane-title {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .node-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      @keyframes pulseLane1L {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        5% { opacity: 1; }
        45% { stroke-dashoffset: 0; opacity: 1; }
        50% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseLane2L {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        8% { opacity: 1; }
        48% { stroke-dashoffset: 0; opacity: 1; }
        53% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseLane3L {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        6% { opacity: 1; }
        42% { stroke-dashoffset: 0; opacity: 1; }
        48% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseLane4L {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        10% { opacity: 1; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        55% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseLane5L {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        7% { opacity: 1; }
        46% { stroke-dashoffset: 0; opacity: 1; }
        52% { opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      .pulse-line-1-l { stroke-dasharray: 60 1140; animation: pulseLane1L 9.7s ease-in-out infinite; }
      .pulse-line-2-l { stroke-dasharray: 60 1140; animation: pulseLane2L 12.3s ease-in-out infinite; animation-delay: 2.1s; }
      .pulse-line-3-l { stroke-dasharray: 60 1140; animation: pulseLane3L 10.8s ease-in-out infinite; animation-delay: 4.3s; }
      .pulse-line-4-l { stroke-dasharray: 60 1140; animation: pulseLane4L 14.1s ease-in-out infinite; animation-delay: 1.4s; }
      .pulse-line-5-l { stroke-dasharray: 60 1140; animation: pulseLane5L 11.6s ease-in-out infinite; animation-delay: 5.2s; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="660" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Celestial Precision Coordinate Points -->
  <g fill="#1F2328" opacity="0.04">
    <circle cx="120" cy="90" r="1.5" /><circle cx="340" cy="70" r="1.5" />
    <circle cx="680" cy="95" r="1.5" /><circle cx="950" cy="80" r="1.5" />
    <circle cx="210" cy="300" r="1.5" /><circle cx="820" cy="310" r="1.5" />
    <circle cx="450" cy="520" r="1.5" /><circle cx="1080" cy="540" r="1.5" />
