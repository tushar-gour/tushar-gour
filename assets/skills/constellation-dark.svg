<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .mono-title {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .cluster-label {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="580" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Background Celestial Star Field (60+ Neutral Dots, 10-25% Opacity) -->
  <g fill="#F0EEE8">
    <circle cx="95" cy="85" r="1" opacity="0.15" /><circle cx="160" cy="190" r="1.5" opacity="0.22" />
    <circle cx="230" cy="95" r="1" opacity="0.12" /><circle cx="310" cy="270" r="1.2" opacity="0.18" />
    <circle cx="120" cy="380" r="1.5" opacity="0.25" /><circle cx="240" cy="460" r="1" opacity="0.10" />
    <circle cx="410" cy="110" r="1.2" opacity="0.16" /><circle cx="490" cy="70" r="1" opacity="0.14" />
    <circle cx="560" cy="210" r="1.8" opacity="0.25" /><circle cx="680" cy="120" r="1" opacity="0.12" />
    <circle cx="620" cy="320" r="1.5" opacity="0.20" /><circle cx="750" cy="280" r="1.2" opacity="0.15" />
    <circle cx="830" cy="90" r="1.5" opacity="0.22" /><circle cx="910" cy="65" r="1" opacity="0.12" />
    <circle cx="1020" cy="110" r="1.2" opacity="0.18" /><circle cx="1110" cy="80" r="1.5" opacity="0.20" />
    <circle cx="880" cy="230" r="1" opacity="0.14" /><circle cx="990" cy="290" r="1.6" opacity="0.24" />
    <circle cx="1070" cy="390" r="1.2" opacity="0.15" /><circle cx="920" cy="470" r="1.5" opacity="0.22" />
    <circle cx="810" cy="510" r="1" opacity="0.12" /><circle cx="710" cy="450" r="1.2" opacity="0.18" />
    <circle cx="530" cy="520" r="1.5" opacity="0.20" /><circle cx="400" cy="470" r="1" opacity="0.14" />
    <circle cx="290" cy="530" r="1.2" opacity="0.16" /><circle cx="150" cy="510" r="1.5" opacity="0.22" />
    <circle cx="70" cy="250" r="1" opacity="0.12" /><circle cx="470" cy="240" r="1.2" opacity="0.15" />
    <circle cx="600" cy="430" r="1.5" opacity="0.20" /><circle cx="840" cy="370" r="1" opacity="0.14" />
    <circle cx="1130" cy="220" r="1.5" opacity="0.22" /><circle cx="1050" cy="520" r="1.2" opacity="0.16" />
  </g>

  <!-- Faint Orbital Celestial Arcs (4-8% Opacity) -->
  <g stroke="#F0EEE8" fill="none" stroke-width="1">
    <ellipse cx="600" cy="290" rx="520" ry="240" opacity="0.04" />
    <ellipse cx="580" cy="300" rx="380" ry="180" opacity="0.05" stroke-dasharray="6 8" />
    <ellipse cx="620" cy="280" rx="220" ry="110" opacity="0.06" />
  </g>

  <!-- Top Section Title -->
  <g transform="translate(48, 44)">
    <text class="mono-title" x="0" y="0" font-size="18" fill="#C96A4B">SKILL SYSTEM</text>
    <text class="mono-title" x="160" y="0" font-size="18" fill="#7B858F">/ CORE ENGINEERING CONSTELLATION</text>
    <text class="mono-title" x="1104" y="0" font-size="16" fill="#5F6974" text-anchor="end">SYSTEM TOPOLOGY</text>
  </g>

  <line x1="48" y1="60" x2="1152" y2="60" stroke="#1C252E" stroke-width="1" />

  <!-- Constellation Inter-Cluster Connecting Paths -->
  <!-- Primary Bus Path (Terracotta) -->
  <path d="M 220 160 L 360 210 L 510 160 L 670 210 L 610 390 L 890 310 L 1020 220" 
        fill="none" stroke="#C96A4B" stroke-width="1.6" opacity="0.65" />
  
  <!-- Secondary Constellation Struts (Steel Gray) -->
  <g stroke="#28313A" stroke-width="1.2" fill="none" opacity="0.6">
    <!-- Product Cluster Struts -->
    <line x1="120" y1="210" x2="220" y2="160" />
    <line x1="220" y1="160" x2="210" y2="270" />
    <line x1="210" y1="270" x2="330" y2="290" />
    <line x1="220" y1="160" x2="360" y2="210" />

    <!-- Services Cluster Struts -->
    <line x1="510" y1="160" x2="620" y2="150" />
    <line x1="620" y1="150" x2="670" y2="210" />
    <line x1="510" y1="160" x2="490" y2="250" />

    <!-- Data Cluster Struts -->
    <line x1="360" y1="210" x2="440" y2="400" />
    <line x1="440" y1="400" x2="610" y2="390" />
    <line x1="610" y1="390" x2="520" y2="480" />
    <line x1="610" y1="390" x2="720" y2="420" />
    <line x1="720" y1="420" x2="780" y2="490" />

    <!-- Intelligence Struts -->
    <line x1="860" y1="140" x2="980" y2="130" />
    <line x1="980" y1="130" x2="1080" y2="150" />
    <line x1="860" y1="140" x2="890" y2="310" />

    <!-- Delivery Cluster Struts -->
    <line x1="890" y1="310" x2="980" y2="360" />
    <line x1="980" y1="360" x2="1060" y2="330" />
    <line x1="980" y1="360" x2="930" y2="460" />
    <line x1="980" y1="360" x2="1060" y2="460" />
  </g>

  <!-- Static Simulator-Style Rocket Marker on Traversal Path -->
  <g transform="translate(425, 188) rotate(22)">
    <!-- Faint Trajectory Tail -->
    <line x1="-30" y1="0" x2="-4" y2="0" stroke="#C96A4B" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Rocket Body (Sleek Technical Silhouette) -->
    <!-- Main fuselage -->
    <path d="M 14 0 L -4 -5 L -8 -3 L -6 0 L -8 3 L -4 5 Z" fill="#D7D5CF" stroke="#0D1117" stroke-width="1" />
    <!-- Terracotta Nose Cone -->
    <path d="M 14 0 L 8 -3 L 8 3 Z" fill="#C96A4B" />
    <!-- Wings -->
    <path d="M -4 -5 L -10 -9 L -8 -4 Z" fill="#7B858F" />
    <path d="M -4 5 L -10 9 L -8 4 Z" fill="#7B858F" />
  </g>

  <!-- ============================================================= -->
  <!-- CLUSTER 01: PRODUCT & CLIENT                                  -->
  <!-- ============================================================= -->
  <g transform="translate(80, 95)">
    <text class="cluster-label" x="0" y="0" font-size="14" fill="#C96A4B">01</text>
    <text class="cluster-label" x="24" y="0" font-size="14" fill="#7B858F">/ PRODUCT</text>
  </g>

  <!-- Node: Flutter (Focal) -->
  <g transform="translate(220, 160)">
    <circle cx="0" cy="0" r="20" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <!-- Normalized Flutter Glyph -->
    <path d="M -4 -8 L 5 1 L -4 10 L -9 5 L -1 1 L -9 -3 Z" fill="#F0EEE8" />
    <text class="node-text" x="0" y="32" font-size="15" fill="#F0EEE8" text-anchor="middle">Flutter</text>
  </g>

  <!-- Node: Dart -->
  <g transform="translate(120, 210)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -6 -6 L 2 -6 L 6 0 L -2 6 L -6 6 Z" fill="#7B858F" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Dart</text>
  </g>

  <!-- Node: React 19 -->
  <g transform="translate(360, 210)">
    <circle cx="0" cy="0" r="18" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#F0EEE8" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="8" ry="3" transform="rotate(60)" fill="none" stroke="#F0EEE8" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="8" ry="3" transform="rotate(120)" fill="none" stroke="#F0EEE8" stroke-width="1" />
    <circle cx="0" cy="0" r="1.5" fill="#F0EEE8" />
    <text class="node-text" x="0" y="30" font-size="14" fill="#F0EEE8" text-anchor="middle">React 19</text>
  </g>

  <!-- Node: TypeScript -->
  <g transform="translate(210, 270)">
    <circle cx="0" cy="0" r="17" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <text class="mono-title" x="0" y="5" font-size="12" fill="#C96A4B" text-anchor="middle">TS</text>
    <text class="node-text" x="0" y="28" font-size="14" fill="#F0EEE8" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Node: Tailwind & Vite -->
  <g transform="translate(330, 290)">
    <circle cx="0" cy="0" r="15" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -5 -2 C -4 -5 0 -4 1 -2 C 2 0 5 0 5 3 C 4 6 0 5 -1 3 C -2 1 -5 1 -5 -2 Z" fill="#7B858F" />
    <text class="node-text" x="0" y="26" font-size="13" fill="#D7D5CF" text-anchor="middle">Tailwind / Vite</text>
  </g>

  <!-- ============================================================= -->
  <!-- CLUSTER 02: SERVICES & REALTIME                               -->
  <!-- ============================================================= -->
  <g transform="translate(480, 95)">
    <text class="cluster-label" x="0" y="0" font-size="14" fill="#C96A4B">02</text>
    <text class="cluster-label" x="24" y="0" font-size="14" fill="#7B858F">/ SERVICES</text>
  </g>

  <!-- Node: Node.js (Focal) -->
  <g transform="translate(510, 160)">
    <circle cx="0" cy="0" r="20" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <path d="M 0 -8 L 7 -4 L 7 4 L 0 8 L -7 4 L -7 -4 Z" fill="none" stroke="#F0EEE8" stroke-width="1.5" />
    <text class="node-text" x="0" y="32" font-size="15" fill="#F0EEE8" text-anchor="middle">Node.js</text>
  </g>

  <!-- Node: Express -->
  <g transform="translate(620, 150)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <text class="mono-title" x="0" y="4" font-size="11" fill="#7B858F" text-anchor="middle">EX</text>
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Express</text>
  </g>

  <!-- Node: Socket.IO & Realtime -->
  <g transform="translate(670, 210)">
    <circle cx="0" cy="0" r="17" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M 0 -6 L 4 -2 L 1 -2 L 1 3 L -1 3 L -1 -2 L -4 -2 Z M 0 6 L -4 2 L -1 2 L -1 -3 L 1 -3 L 1 2 L 4 2 Z" fill="#F0EEE8" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Socket.IO</text>
  </g>

  <!-- Node: Java / REST -->
  <g transform="translate(490, 250)">
    <circle cx="0" cy="0" r="15" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -4 4 C -2 5 2 5 4 4 C 5 2 2 1 0 0 C -3 -1 -4 -3 -2 -5 C 0 -6 3 -6 5 -4" fill="none" stroke="#7B858F" stroke-width="1.2" />
    <text class="node-text" x="0" y="26" font-size="13" fill="#D7D5CF" text-anchor="middle">Java / REST</text>
  </g>

  <!-- ============================================================= -->
  <!-- CLUSTER 03: DATA PLATFORMS                                    -->
  <!-- ============================================================= -->
  <g transform="translate(380, 345)">
    <text class="cluster-label" x="0" y="0" font-size="14" fill="#C96A4B">03</text>
    <text class="cluster-label" x="24" y="0" font-size="14" fill="#7B858F">/ DATA PLATFORMS</text>
  </g>

  <!-- Node: PostgreSQL (Focal) -->
  <g transform="translate(610, 390)">
    <circle cx="0" cy="0" r="20" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <!-- Cylinder Icon -->
    <ellipse cx="0" cy="-4" rx="7" ry="2.5" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <path d="M -7 -4 V 4 C 0 6 7 6 7 4 V -4" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <text class="node-text" x="0" y="32" font-size="15" fill="#F0EEE8" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Node: Redis -->
  <g transform="translate(440, 400)">
    <circle cx="0" cy="0" r="17" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M 0 -6 L 6 -3 L 0 0 L -6 -3 Z M -6 0 L 0 3 L 6 0 M -6 3 L 0 6 L 6 3" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Redis</text>
  </g>

  <!-- Node: MongoDB -->
  <g transform="translate(520, 480)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M 0 -7 C 3 -3 4 3 0 7 C -4 3 -3 -3 0 -7 Z" fill="none" stroke="#7B858F" stroke-width="1.2" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">MongoDB</text>
  </g>

  <!-- Node: Prisma ORM -->
  <g transform="translate(720, 420)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -5 5 L 0 -7 L 5 5 Z" fill="none" stroke="#7B858F" stroke-width="1.2" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Prisma</text>
  </g>

  <!-- Node: Supabase / SQLite -->
  <g transform="translate(780, 490)">
    <circle cx="0" cy="0" r="15" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M 2 -6 L -4 1 L 0 1 L -2 6 L 4 -1 L 0 -1 Z" fill="#7B858F" />
    <text class="node-text" x="0" y="26" font-size="13" fill="#D7D5CF" text-anchor="middle">Supabase</text>
  </g>

  <!-- ============================================================= -->
  <!-- CLUSTER 04: CLOUD & DELIVERY                                  -->
  <!-- ============================================================= -->
  <g transform="translate(860, 245)">
    <text class="cluster-label" x="0" y="0" font-size="14" fill="#C96A4B">04</text>
    <text class="cluster-label" x="24" y="0" font-size="14" fill="#7B858F">/ DELIVERY</text>
  </g>

  <!-- Node: Docker (Focal) -->
  <g transform="translate(890, 310)">
    <circle cx="0" cy="0" r="20" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <rect x="-6" y="-5" width="3" height="3" fill="#F0EEE8" />
    <rect x="-2" y="-5" width="3" height="3" fill="#F0EEE8" />
    <rect x="2" y="-5" width="3" height="3" fill="#F0EEE8" />
    <rect x="-2" y="-9" width="3" height="3" fill="#F0EEE8" />
    <path d="M -8 -1 C -8 4 6 5 8 0 Z" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <text class="node-text" x="0" y="32" font-size="15" fill="#F0EEE8" text-anchor="middle">Docker</text>
  </g>

  <!-- Node: AWS -->
  <g transform="translate(980, 360)">
    <circle cx="0" cy="0" r="18" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -6 2 C -2 5 2 5 6 2 M 4 2 L 6 2 L 5 4" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <text class="node-text" x="0" y="30" font-size="14" fill="#F0EEE8" text-anchor="middle">AWS</text>
  </g>

  <!-- Node: Linux -->
  <g transform="translate(1060, 330)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="5" ry="6" fill="none" stroke="#7B858F" stroke-width="1.2" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Linux</text>
  </g>

  <!-- Node: GitHub Actions CI/CD -->
  <g transform="translate(930, 460)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <circle cx="0" cy="-4" r="2" fill="#7B858F" />
    <circle cx="-4" cy="4" r="2" fill="#7B858F" />
    <circle cx="4" cy="4" r="2" fill="#7B858F" />
    <path d="M 0 -4 L -4 4 M 0 -4 L 4 4" stroke="#7B858F" stroke-width="1" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">CI/CD Actions</text>
  </g>

  <!-- Node: Cloud / Vercel -->
  <g transform="translate(1060, 460)">
    <circle cx="0" cy="0" r="15" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M 0 -6 L 6 4 H -6 Z" fill="#7B858F" />
    <text class="node-text" x="0" y="26" font-size="13" fill="#D7D5CF" text-anchor="middle">GCP / Vercel</text>
  </g>

  <!-- ============================================================= -->
  <!-- CLUSTER 05: INTELLIGENCE & SYSTEMS                            -->
  <!-- ============================================================= -->
  <g transform="translate(850, 75)">
    <text class="cluster-label" x="0" y="0" font-size="14" fill="#C96A4B">05</text>
    <text class="cluster-label" x="24" y="0" font-size="14" fill="#7B858F">/ INTELLIGENCE &amp; SYSTEMS</text>
  </g>

  <!-- Node: Python / AI (Focal) -->
  <g transform="translate(860, 140)">
    <circle cx="0" cy="0" r="18" fill="#111820" stroke="#C96A4B" stroke-width="1.5" />
    <path d="M -5 -5 H 2 V -2 H -2 V 0 H 3 C 5 0 5 3 5 3 V 5 H -2 V 2 H 2 V 0 H -3 C -5 0 -5 -3 -5 -3 Z" fill="#F0EEE8" />
    <text class="node-text" x="0" y="30" font-size="14" fill="#F0EEE8" text-anchor="middle">Python / AI</text>
  </g>

  <!-- Node: LLM Integration / LangChain -->
  <g transform="translate(980, 130)">
    <circle cx="0" cy="0" r="17" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <path d="M -5 -2 L -2 -5 L 1 -2 L 4 -5 L 7 -2" fill="none" stroke="#F0EEE8" stroke-width="1.2" />
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">Inference &amp; LLMs</text>
  </g>

  <!-- Node: C++ / Systems -->
  <g transform="translate(1080, 150)">
    <circle cx="0" cy="0" r="16" fill="#111820" stroke="#28313A" stroke-width="1.2" />
    <text class="mono-title" x="0" y="5" font-size="11" fill="#7B858F" text-anchor="middle">C++</text>
    <text class="node-text" x="0" y="28" font-size="13" fill="#D7D5CF" text-anchor="middle">C++ / Native</text>
  </g>
</svg>
