    <circle cx="230" cy="95" r="1" opacity="0.10" /><circle cx="310" cy="270" r="1.2" opacity="0.15" />
    <circle cx="120" cy="380" r="1.5" opacity="0.20" /><circle cx="240" cy="460" r="1" opacity="0.08" />
    <circle cx="410" cy="110" r="1.2" opacity="0.14" /><circle cx="490" cy="70" r="1" opacity="0.12" />
    <circle cx="560" cy="210" r="1.8" opacity="0.22" /><circle cx="680" cy="120" r="1" opacity="0.10" />
    <circle cx="620" cy="320" r="1.5" opacity="0.18" /><circle cx="750" cy="280" r="1.2" opacity="0.12" />
    <circle cx="830" cy="90" r="1.5" opacity="0.18" /><circle cx="910" cy="65" r="1" opacity="0.10" />
    <circle cx="1020" cy="110" r="1.2" opacity="0.15" /><circle cx="1110" cy="80" r="1.5" opacity="0.16" />
    <circle cx="880" cy="230" r="1" opacity="0.12" /><circle cx="990" cy="290" r="1.6" opacity="0.20" />
    <circle cx="1070" cy="390" r="1.2" opacity="0.12" /><circle cx="920" cy="470" r="1.5" opacity="0.18" />
    <circle cx="810" cy="510" r="1" opacity="0.10" /><circle cx="710" cy="450" r="1.2" opacity="0.15" />
    <circle cx="530" cy="520" r="1.5" opacity="0.18" /><circle cx="400" cy="470" r="1" opacity="0.12" />
