<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A26" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>

    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="flowGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashAnim {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseHalo {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      
      .bus-line {
        stroke-dasharray: 6 6;
        animation: dashAnim 3s linear infinite;
      }
      .bus-line-fast {
        stroke-dasharray: 4 4;
        animation: dashAnim 1.8s linear infinite;
      }
      .halo-pulse {
        animation: pulseHalo 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="14" fill="#080C12" stroke="#1B2535" stroke-width="1.5" />

  <!-- Technical Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#FF5722" letter-spacing="1.5">● SYSTEMS TOPOLOGY // ACT III</text>
    <text x="225" y="32" letter-spacing="1">END-TO-END ARCHITECTURAL DATA FLOW &amp; PROTOCOL MESH</text>
    <text x="1168" y="32" text-anchor="end" letter-spacing="1">TOPOLOGY: DISTRIBUTED // STATE: BOUNDED</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1B2535" stroke-width="1" />

  <!-- ========================================== -->
  <!-- CONNECTING DATA BUS LINES (Underlay) -->
  <!-- ========================================== -->
  <g stroke-width="1.5" fill="none">
    <!-- Surface to Gateway -->
    <path class="bus-line" d="M 230 140 C 275 140, 280 200, 330 200" stroke="#FF5722" opacity="0.8" />
    <path class="bus-line" d="M 230 290 C 275 290, 280 260, 330 260" stroke="#FF5722" opacity="0.8" />
    <path class="bus-line-fast" d="M 230 400 C 290 400, 290 320, 330 320" stroke="#FF5722" opacity="0.8" />

    <!-- Gateway to Services -->
    <path class="bus-line" d="M 520 200 C 560 200, 560 140, 600 140" stroke="#00E5FF" opacity="0.8" />
    <path class="bus-line-fast" d="M 520 260 C 560 260, 560 260, 600 260" stroke="#00E5FF" opacity="0.8" />
    <path class="bus-line" d="M 520 320 C 560 320, 560 380, 600 380" stroke="#00E5FF" opacity="0.8" />

    <!-- Services to Data Plane -->
    <path class="bus-line" d="M 790 140 C 830 140, 840 160, 880 160" stroke="#00E676" opacity="0.8" />
    <path class="bus-line-fast" d="M 790 260 C 830 260, 840 270, 880 270" stroke="#00E676" opacity="0.8" />
    <path class="bus-line" d="M 790 380 C 830 380, 840 380, 880 380" stroke="#00E676" opacity="0.8" />

    <!-- Data & Compute to Cloud Delivery Bus -->
    <path class="bus-line" d="M 1070 160 C 1100 160, 1110 200, 1140 200" stroke="#FFB300" opacity="0.8" />
    <path class="bus-line" d="M 1070 270 C 1100 270, 1110 260, 1140 260" stroke="#FFB300" opacity="0.8" />
    <path class="bus-line" d="M 1070 380 C 1100 380, 1110 320, 1140 320" stroke="#FFB300" opacity="0.8" />
  </g>

  <!-- Protocol Badges on Intersections -->
  <g class="mono" font-size="9" fill="#F1EEE7">
    <rect x="250" y="155" width="46" height="18" rx="4" fill="#141D2A" stroke="#FF5722" stroke-width="1" />
    <text x="273" y="168" text-anchor="middle" fill="#FF8A65" font-weight="700">HTTPS</text>

    <rect x="250" y="270" width="46" height="18" rx="4" fill="#141D2A" stroke="#00E5FF" stroke-width="1" />
    <text x="273" y="283" text-anchor="middle" fill="#80D8FF" font-weight="700">WSS</text>

    <rect x="540" y="155" width="44" height="18" rx="4" fill="#141D2A" stroke="#00E5FF" stroke-width="1" />
    <text x="562" y="168" text-anchor="middle" fill="#80D8FF" font-weight="700">REST</text>

    <rect x="540" y="285" width="44" height="18" rx="4" fill="#141D2A" stroke="#00E676" stroke-width="1" />
    <text x="562" y="298" text-anchor="middle" fill="#69F0AE" font-weight="700">PUBSUB</text>

    <rect x="815" y="185" width="44" height="18" rx="4" fill="#141D2A" stroke="#00E676" stroke-width="1" />
    <text x="837" y="198" text-anchor="middle" fill="#69F0AE" font-weight="700">SQL</text>

    <rect x="815" y="315" width="44" height="18" rx="4" fill="#141D2A" stroke="#FFB300" stroke-width="1" />
    <text x="837" y="328" text-anchor="middle" fill="#FFE082" font-weight="700">CACHE</text>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 1: CLIENT SURFACES (Left) -->
  <!-- ========================================== -->
  <g transform="translate(32, 65)">
    <text class="mono" x="0" y="18" font-size="11" fill="#FF5722" font-weight="700" letter-spacing="1">01 / CLIENT SURFACE</text>

    <!-- Node 1: Flutter Engine -->
    <g transform="translate(0, 32)">
      <rect width="198" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FF5722" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">Flutter Mobile</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Dart Native Engine · iOS &amp; Android</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FF8A65">60 FPS Optimistic State</text>
    </g>

    <!-- Node 2: React 19 / TypeScript Web -->
    <g transform="translate(0, 142)">
      <rect width="198" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FF5722" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">React 19 / TS Web</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Vite · Tailwind CSS · SPA</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FF8A65">Typed Component Contracts</text>
    </g>

    <!-- Node 3: Device State & Offline -->
    <g transform="translate(0, 252)">
      <rect width="198" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FF5722" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">Local-First Storage</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">IndexedDB · SQLite · Key-Value</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FF8A65">Offline-Ready Queue</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 2: GATEWAY & INGESTION -->
  <!-- ========================================== -->
  <g transform="translate(330, 65)">
    <text class="mono" x="0" y="18" font-size="11" fill="#00E5FF" font-weight="700" letter-spacing="1">02 / GATEWAY &amp; APIS</text>

    <!-- Master API Gateway Node -->
    <g transform="translate(0, 32)">
      <rect width="190" height="300" rx="10" fill="url(#nodeBg)" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.2" />
      <rect x="12" y="16" width="166" height="26" rx="4" fill="#142334" />
      <text class="mono" x="95" y="33" font-size="11" fill="#00E5FF" text-anchor="middle" font-weight="700">EDGE GATEWAY</text>

      <!-- Inner sub-modules -->
      <g transform="translate(12, 54)" class="mono" font-size="10">
        <!-- Sub 1 -->
        <rect width="166" height="46" rx="4" fill="#0E1724" stroke="#1D2E44" stroke-width="1" />
        <text x="10" y="20" fill="#F1EEE7" font-weight="600">Rate Limiter</text>
        <text class="sans" x="10" y="36" fill="#7E8B9B" font-size="9">Token-bucket per IP/Token</text>

        <!-- Sub 2 -->
        <g transform="translate(0, 56)">
          <rect width="166" height="46" rx="4" fill="#0E1724" stroke="#1D2E44" stroke-width="1" />
          <text x="10" y="20" fill="#F1EEE7" font-weight="600">Auth Boundaries</text>
          <text class="sans" x="10" y="36" fill="#7E8B9B" font-size="9">JWT Claims &amp; RBAC Guard</text>
        </g>

        <!-- Sub 3 -->
        <g transform="translate(0, 112)">
          <rect width="166" height="46" rx="4" fill="#0E1724" stroke="#1D2E44" stroke-width="1" />
          <text x="10" y="20" fill="#F1EEE7" font-weight="600">Realtime Hub</text>
          <text class="sans" x="10" y="36" fill="#7E8B9B" font-size="9">Socket.IO Heartbeat &amp; Rooms</text>
        </g>

        <!-- Sub 4 -->
        <g transform="translate(0, 168)">
          <rect width="166" height="58" rx="4" fill="#0E1724" stroke="#1D2E44" stroke-width="1" />
          <text x="10" y="20" fill="#F1EEE7" font-weight="600">Reverse Proxy</text>
          <text class="sans" x="10" y="36" fill="#7E8B9B" font-size="9">Load Balancing &amp; SSL</text>
          <text class="mono" x="10" y="50" fill="#00E5FF" font-size="8">P99 LATENCY &lt; 15MS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 3: SERVICE MESH & COMPUTE -->
  <!-- ========================================== -->
  <g transform="translate(600, 65)">
    <text class="mono" x="0" y="18" font-size="11" fill="#00E676" font-weight="700" letter-spacing="1">03 / DISTRIBUTED SERVICES</text>

    <!-- Node 1: Node.js Microservices -->
    <g transform="translate(0, 32)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#00E676" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">Node / Express</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Core REST &amp; Business Logic</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#69F0AE">Stateless Horizontal Scalability</text>
    </g>

    <!-- Node 2: Java Async Workers -->
    <g transform="translate(0, 142)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#00E676" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">Java / Task Engine</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Heavy Compute &amp; Transcoding</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#69F0AE">Multi-Threaded Queue Workers</text>
    </g>

    <!-- Node 3: Applied AI Inference Layer -->
    <g transform="translate(0, 252)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#00E676" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">AI / Inference Bus</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">LLM Pipelines &amp; Embeddings</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#69F0AE">Strict Fallbacks &amp; Budgets</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 4: DATA PLANE & PERSISTENCE -->
  <!-- ========================================== -->
  <g transform="translate(880, 65)">
    <text class="mono" x="0" y="18" font-size="11" fill="#FFB300" font-weight="700" letter-spacing="1">04 / DATA PLANE &amp; CLOUD</text>

    <!-- Node 1: PostgreSQL Relational DB -->
    <g transform="translate(0, 32)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FFB300" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">PostgreSQL + Prisma</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Relational ACID Persistence</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FFE082">Indexed Partitioned Tables</text>
    </g>

    <!-- Node 2: Redis In-Memory Cluster -->
    <g transform="translate(0, 142)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FFB300" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">Redis Cache &amp; PubSub</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">Sub-millisecond Session State</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FFE082">Ephemeral Message Queues</text>
    </g>

    <!-- Node 3: Cloud & Delivery Pipeline -->
    <g transform="translate(0, 252)">
      <rect width="190" height="80" rx="8" fill="url(#nodeBg)" stroke="#2C3B50" stroke-width="1.2" />
      <circle cx="16" cy="18" r="5" fill="#FFB300" filter="url(#nodeGlow)" />
      <text class="mono" x="28" y="22" font-size="11" fill="#F1EEE7" font-weight="700">AWS / Docker / CI</text>
      <text class="sans" x="16" y="44" font-size="10" fill="#A0AEC0">ECS · S3 · GitHub Actions</text>
      <text class="mono" x="16" y="64" font-size="9" fill="#FFE082">Automated Multi-Arch Deploy</text>
    </g>
  </g>

  <!-- Bottom Telemetry Footer Strip -->
  <g transform="translate(32, 455)">
    <rect width="1136" height="42" rx="6" fill="#0C1118" stroke="#1C2739" stroke-width="1" />
    <g class="mono" font-size="10" fill="#7E8B9B">
      <text x="24" y="26">TOPOLOGY PROTOCOLS: <tspan fill="#F1EEE7">HTTPS / WSS / gRPC / SQL / REDIS-RESP</tspan></text>
      <text x="1112" y="26" text-anchor="end">ISOLATION: <tspan fill="#00E676">ZERO LEAKAGE ACROSS SYSTEM BOUNDARIES</tspan></text>
    </g>
  </g>
</svg>
