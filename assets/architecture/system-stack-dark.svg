<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .tech-names {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        line-height: 1.4;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
        line-height: 1.4;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="420" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Faint 3% Architectural Trace Behind Columns -->
  <g stroke="#F0EEE8" stroke-width="1" fill="none" opacity="0.03">
    <path d="M 48 330 H 300 V 270 H 600 V 210 H 900 V 150 H 1152" />
    <circle cx="300" cy="270" r="30" />
    <circle cx="600" cy="210" r="30" />
    <circle cx="900" cy="150" r="30" />
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(48, 48)">
    <text class="mono-hdr" x="0" y="0" font-size="20" fill="#C96A4B">03</text>
    <text class="sans-bold" x="38" y="0" font-size="26" fill="#F0EEE8">CAPABILITY MAP</text>
    <text class="mono-hdr" x="320" y="0" font-size="20" fill="#7B858F">/ FROM PRODUCT SURFACE TO DELIVERY</text>
    
    <text class="mono-hdr" x="1104" y="0" font-size="18" fill="#5F6974" text-anchor="end">
      01 → 02 → 03 → 04
    </text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#1C252E" stroke-width="1" />

  <!-- Vertical Hairline Column Dividers -->
  <line x1="320" y1="90" x2="320" y2="380" stroke="#28313A" stroke-width="1" />
  <line x1="610" y1="90" x2="610" y2="380" stroke="#28313A" stroke-width="1" />
  <line x1="900" y1="90" x2="900" y2="380" stroke="#28313A" stroke-width="1" />

  <!-- Central Horizontal Architectural Bus Path -->
  <g transform="translate(0, 240)">
    <line x1="160" y1="0" x2="1040" y2="0" stroke="#28313A" stroke-width="1.5" />
    <line x1="450" y1="0" x2="750" y2="0" stroke="#C96A4B" stroke-width="2" />

    <!-- Node 1: Surface -->
    <circle cx="160" cy="0" r="6" fill="#0D1117" stroke="#7B858F" stroke-width="2" />
    <!-- Node 2: Services (Active Accent Node) -->
    <circle cx="450" cy="0" r="7" fill="#C96A4B" />
    <!-- Node 3: Data -->
    <circle cx="750" cy="0" r="6" fill="#0D1117" stroke="#7B858F" stroke-width="2" />
    <!-- Node 4: Delivery -->
    <circle cx="1040" cy="0" r="6" fill="#0D1117" stroke="#7B858F" stroke-width="2" />
  </g>

  <!-- Territory 1: Product Surface -->
  <g transform="translate(48, 105)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#C96A4B">01</text>
    <text class="sans-bold" x="32" y="0" font-size="24" fill="#F0EEE8">SURFACE</text>
    
    <g transform="translate(0, 36)">
      <text class="tech-names" x="0" y="0" font-size="20" fill="#D7D5CF">Flutter · React 19</text>
      <text class="tech-names" x="0" y="26" font-size="20" fill="#D7D5CF">TypeScript · Vite</text>
    </g>

    <g transform="translate(0, 190)">
      <text class="desc-text" x="0" y="0" font-size="17" fill="#7B858F">Client state, typed API</text>
      <text class="desc-text" x="0" y="24" font-size="17" fill="#7B858F">contracts, sub-50ms render loop.</text>
    </g>
  </g>

  <!-- Territory 2: Services -->
  <g transform="translate(340, 105)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#7B858F">02</text>
    <text class="sans-bold" x="32" y="0" font-size="24" fill="#F0EEE8">SERVICES</text>
    
    <g transform="translate(0, 36)">
      <text class="tech-names" x="0" y="0" font-size="20" fill="#D7D5CF">Node.js · Express</text>
      <text class="tech-names" x="0" y="26" font-size="20" fill="#D7D5CF">Java · Socket.IO</text>
    </g>

    <g transform="translate(0, 190)">
      <text class="desc-text" x="0" y="0" font-size="17" fill="#7B858F">Boundary guards, JWT auth,</text>
      <text class="desc-text" x="0" y="24" font-size="17" fill="#7B858F">real-time event distribution.</text>
    </g>
  </g>

  <!-- Territory 3: Data Plane -->
  <g transform="translate(630, 105)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#7B858F">03</text>
    <text class="sans-bold" x="32" y="0" font-size="24" fill="#F0EEE8">DATA PLANE</text>
    
    <g transform="translate(0, 36)">
      <text class="tech-names" x="0" y="0" font-size="20" fill="#D7D5CF">PostgreSQL · Redis</text>
      <text class="tech-names" x="0" y="26" font-size="20" fill="#D7D5CF">MongoDB · Prisma</text>
    </g>

    <g transform="translate(0, 190)">
      <text class="desc-text" x="0" y="0" font-size="17" fill="#7B858F">ACID consistency, in-memory</text>
      <text class="desc-text" x="0" y="24" font-size="17" fill="#7B858F">cache, schema access patterns.</text>
    </g>
  </g>

  <!-- Territory 4: Delivery -->
  <g transform="translate(920, 105)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#7B858F">04</text>
    <text class="sans-bold" x="32" y="0" font-size="24" fill="#F0EEE8">DELIVERY</text>
    
    <g transform="translate(0, 36)">
      <text class="tech-names" x="0" y="0" font-size="20" fill="#D7D5CF">AWS · Cloud Infra</text>
      <text class="tech-names" x="0" y="26" font-size="20" fill="#D7D5CF">Docker · Linux · CI/CD</text>
    </g>

    <g transform="translate(0, 190)">
      <text class="desc-text" x="0" y="0" font-size="17" fill="#7B858F">Containerized deployments,</text>
      <text class="desc-text" x="0" y="24" font-size="17" fill="#7B858F">edge delivery, zero-downtime.</text>
    </g>
  </g>
</svg>
