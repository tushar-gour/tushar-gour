<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .domain-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .concern-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="440" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 44)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#C96A4B">SYSTEMS</text>
    <text class="sans-bold" x="105" y="0" font-size="24" fill="#F0EEE8">ENGINEERING SCOPE</text>
    <text class="mono-hdr" x="380" y="0" font-size="16" fill="#7B858F">/ FROM PRODUCT DEFINITION TO PRODUCTION OPERATION</text>
    
    <text class="mono-hdr" x="1104" y="0" font-size="16" fill="#5F6974" text-anchor="end">
      CROSS-SECTION
    </text>
  </g>

  <line x1="48" y1="62" x2="1152" y2="62" stroke="#1C252E" stroke-width="1" />

  <!-- Vertical AI / Intelligence Cross-Cutting Axis (Intersects Product, Services, Data) -->
  <g transform="translate(860, 80)">
    <rect width="270" height="320" rx="8" fill="#111820" stroke="#C96A4B" stroke-width="1.2" stroke-dasharray="6 4" />
    <text class="mono-hdr" x="20" y="32" font-size="15" fill="#C96A4B">CROSS-CUTTING AXIS</text>
    <text class="domain-title" x="20" y="58" font-size="18" fill="#F0EEE8">AI &amp; INTELLIGENCE</text>
    
    <g transform="translate(20, 90)">
      <text class="concern-text" x="0" y="0" font-size="14" fill="#D7D5CF">· Model integration</text>
      <text class="concern-text" x="0" y="24" font-size="14" fill="#D7D5CF">· Structured inference</text>
      <text class="concern-text" x="0" y="48" font-size="14" fill="#D7D5CF">· Schema validation</text>
      <text class="concern-text" x="0" y="72" font-size="14" fill="#D7D5CF">· Fallback orchestration</text>
      <text class="concern-text" x="0" y="96" font-size="14" fill="#D7D5CF">· Latency &amp; token budgets</text>
      <text class="concern-text" x="0" y="120" font-size="14" fill="#D7D5CF">· Evaluation telemetry</text>
    </g>
  </g>

  <!-- 5 Horizontal Systems Layers (Left Side: 48 to 830) -->
  <!-- Layer 1: Product Systems -->
  <g transform="translate(48, 80)">
    <rect width="780" height="56" rx="6" fill="#111820" stroke="#28313A" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#C96A4B">01</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#F0EEE8">PRODUCT SYSTEMS</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#7B858F">Interfaces · interaction architecture · mobile &amp; web delivery · client state</text>
    <circle cx="750" cy="28" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
  </g>

  <!-- Connecting Bus Segment 1 -->
  <line x1="750" y1="136" x2="750" y2="146" stroke="#28313A" stroke-width="1.5" />

  <!-- Layer 2: Application & State -->
  <g transform="translate(48, 146)">
    <rect width="780" height="56" rx="6" fill="#111820" stroke="#28313A" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#7B858F">02</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#F0EEE8">APPLICATION &amp; STATE</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#7B858F">State transitions · typed API contracts · offline recovery · auth boundaries</text>
    <circle cx="750" cy="28" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
  </g>

  <!-- Connecting Bus Segment 2 (Terracotta Active Segment) -->
  <line x1="750" y1="202" x2="750" y2="212" stroke="#C96A4B" stroke-width="2" />

  <!-- Layer 3: Services & Realtime -->
  <g transform="translate(48, 212)">
    <rect width="780" height="56" rx="6" fill="#111820" stroke="#28313A" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#7B858F">03</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#F0EEE8">SERVICES &amp; REALTIME</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#7B858F">Service boundaries · realtime sockets · async event queues · retry behavior</text>
    <circle cx="750" cy="28" r="5" fill="#C96A4B" />
  </g>

  <!-- Connecting Bus Segment 3 -->
  <line x1="750" y1="268" x2="750" y2="278" stroke="#28313A" stroke-width="1.5" />

  <!-- Layer 4: Data & Persistence -->
  <g transform="translate(48, 278)">
    <rect width="780" height="56" rx="6" fill="#111820" stroke="#28313A" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#7B858F">04</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#F0EEE8">DATA &amp; PERSISTENCE</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#7B858F">Relational &amp; document models · in-memory cache · transactional integrity</text>
    <circle cx="750" cy="28" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
  </g>

  <!-- Connecting Bus Segment 4 -->
  <line x1="750" y1="334" x2="750" y2="344" stroke="#28313A" stroke-width="1.5" />

  <!-- Layer 5: Cloud & Delivery -->
  <g transform="translate(48, 344)">
    <rect width="780" height="56" rx="6" fill="#111820" stroke="#28313A" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#7B858F">05</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#F0EEE8">CLOUD &amp; DELIVERY</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#7B858F">Multi-arch containers · reverse proxies · automated CI/CD · observability</text>
    <circle cx="750" cy="28" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
  </g>
</svg>
