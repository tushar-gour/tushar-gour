<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .domain-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .concern-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="440" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 44)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#B85C3F">SYSTEMS</text>
    <text class="sans-bold" x="105" y="0" font-size="24" fill="#1F2328">ENGINEERING SCOPE</text>
    <text class="mono-hdr" x="380" y="0" font-size="16" fill="#59636E">/ FROM PRODUCT DEFINITION TO PRODUCTION OPERATION</text>
    
    <text class="mono-hdr" x="1104" y="0" font-size="16" fill="#8C959F" text-anchor="end">
      CROSS-SECTION
    </text>
  </g>

  <line x1="48" y1="62" x2="1152" y2="62" stroke="#E1E4E8" stroke-width="1" />

  <!-- Vertical AI / Intelligence Cross-Cutting Axis -->
  <g transform="translate(860, 80)">
    <rect width="270" height="320" rx="8" fill="#FFFFFF" stroke="#B85C3F" stroke-width="1.2" stroke-dasharray="6 4" />
    <text class="mono-hdr" x="20" y="32" font-size="15" fill="#B85C3F">CROSS-CUTTING AXIS</text>
    <text class="domain-title" x="20" y="58" font-size="18" fill="#1F2328">AI &amp; INTELLIGENCE</text>
    
    <g transform="translate(20, 90)">
      <text class="concern-text" x="0" y="0" font-size="14" fill="#59636E">· Model integration</text>
      <text class="concern-text" x="0" y="24" font-size="14" fill="#59636E">· Structured inference</text>
      <text class="concern-text" x="0" y="48" font-size="14" fill="#59636E">· Schema validation</text>
      <text class="concern-text" x="0" y="72" font-size="14" fill="#59636E">· Fallback orchestration</text>
      <text class="concern-text" x="0" y="96" font-size="14" fill="#59636E">· Latency &amp; token budgets</text>
      <text class="concern-text" x="0" y="120" font-size="14" fill="#59636E">· Evaluation telemetry</text>
    </g>
  </g>

  <!-- 5 Horizontal Systems Layers -->
  <g transform="translate(48, 80)">
    <rect width="780" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#B85C3F">01</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#1F2328">PRODUCT SYSTEMS</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#59636E">Interfaces · interaction architecture · mobile &amp; web delivery · client state</text>
    <circle cx="750" cy="28" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
  </g>

  <line x1="750" y1="136" x2="750" y2="146" stroke="#D0D7DE" stroke-width="1.5" />

  <g transform="translate(48, 146)">
    <rect width="780" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#59636E">02</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#1F2328">APPLICATION &amp; STATE</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#59636E">State transitions · typed API contracts · offline recovery · auth boundaries</text>
    <circle cx="750" cy="28" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
  </g>

  <line x1="750" y1="202" x2="750" y2="212" stroke="#B85C3F" stroke-width="2" />

  <g transform="translate(48, 212)">
    <rect width="780" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#59636E">03</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#1F2328">SERVICES &amp; REALTIME</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#59636E">Service boundaries · realtime sockets · async event queues · retry behavior</text>
    <circle cx="750" cy="28" r="5" fill="#B85C3F" />
  </g>

  <line x1="750" y1="268" x2="750" y2="278" stroke="#D0D7DE" stroke-width="1.5" />

  <g transform="translate(48, 278)">
    <rect width="780" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#59636E">04</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#1F2328">DATA &amp; PERSISTENCE</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#59636E">Relational &amp; document models · in-memory cache · transactional integrity</text>
    <circle cx="750" cy="28" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
  </g>

  <line x1="750" y1="334" x2="750" y2="344" stroke="#D0D7DE" stroke-width="1.5" />

  <g transform="translate(48, 344)">
    <rect width="780" height="56" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-hdr" x="20" y="24" font-size="13" fill="#59636E">05</text>
    <text class="domain-title" x="50" y="24" font-size="16" fill="#1F2328">CLOUD &amp; DELIVERY</text>
    <text class="concern-text" x="260" y="24" font-size="14" fill="#59636E">Multi-arch containers · reverse proxies · automated CI/CD · observability</text>
    <circle cx="750" cy="28" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
  </g>
</svg>
