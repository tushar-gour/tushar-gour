<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="chartShadeLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B85C3F" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#F6F8FA" stop-opacity="0.0" />
    </linearGradient>

    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="380" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 48)">
    <text class="mono-hdr" x="0" y="0" font-size="20" fill="#B85C3F">02</text>
    <text class="sans-bold" x="38" y="0" font-size="26" fill="#1F2328">CONTRIBUTION ACTIVITY</text>
    <text class="mono-hdr" x="420" y="0" font-size="20" fill="#59636E">/ LAST 12 MONTHS</text>
    
    <text class="mono-meta" x="1104" y="0" font-size="18" fill="#8C959F" text-anchor="end">
      AUG 2025 – AUG 2026
    </text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#E1E4E8" stroke-width="1" />

  <!-- 4 Major Horizontal Grid Lines & Y-Axis Labels -->
  <g stroke="#D0D7DE" stroke-width="1" opacity="0.6">
    <line x1="90" y1="110" x2="1152" y2="110" />
    <line x1="90" y1="165" x2="1152" y2="165" />
    <line x1="90" y1="220" x2="1152" y2="220" />
    <line x1="90" y1="275" x2="1152" y2="275" />
  </g>

  <g class="mono-meta" font-size="16" fill="#8C959F" text-anchor="end">
    <text x="75" y="115">100</text>
    <text x="75" y="170">65</text>
    <text x="75" y="225">30</text>
    <text x="75" y="280">0</text>
  </g>

  <!-- Area Gradient Fill Under Spline -->
  <path d="M 90 275
           L 90 235
           C 180 230, 240 250, 330 205
           C 420 160, 480 215, 570 175
           C 660 135, 720 190, 810 135
           C 900 85, 960 170, 1050 120
           C 1100 90, 1130 115, 1152 95
           L 1152 275 Z"
        fill="url(#chartShadeLight)" />

  <!-- Secondary Gray Rolling Average Reference Line -->
  <path d="M 90 230 Q 500 190, 850 150 T 1152 110" 
        fill="none" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />

  <!-- Primary Terracotta Data Spline Curve -->
  <path d="M 90 235
           C 180 230, 240 250, 330 205
           C 420 160, 480 215, 570 175
           C 660 135, 720 190, 810 135
           C 900 85, 960 170, 1050 120
           C 1100 90, 1130 115, 1152 95"
        fill="none" stroke="#B85C3F" stroke-width="2.5" stroke-linecap="round" />

  <!-- Annotated Data Point 1: Peak Month -->
  <g transform="translate(810, 135)">
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#B85C3F" stroke-width="2" />
    <line x1="0" y1="-5" x2="0" y2="-28" stroke="#8C959F" stroke-width="1" />
    
    <rect x="-70" y="-56" width="140" height="26" rx="4" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-meta" x="0" y="-38" font-size="14" fill="#1F2328" text-anchor="middle" font-weight="600">PEAK CADENCE</text>
  </g>

  <!-- Annotated Data Point 2: Latest Point -->
  <g transform="translate(1050, 120)">
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#B85C3F" stroke-width="2" />
    <line x1="0" y1="-5" x2="0" y2="-28" stroke="#8C959F" stroke-width="1" />
    
    <rect x="-75" y="-56" width="150" height="26" rx="4" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text class="mono-meta" x="0" y="-38" font-size="14" fill="#B85C3F" text-anchor="middle" font-weight="600">LATEST RELEASE</text>
  </g>

  <!-- X-Axis Timeline Month Labels -->
  <g class="mono-meta" font-size="18" fill="#59636E" transform="translate(0, 320)">
    <text x="100" y="0">JAN</text>
    <text x="195" y="0">FEB</text>
    <text x="290" y="0">MAR</text>
    <text x="385" y="0">APR</text>
    <text x="480" y="0">MAY</text>
    <text x="575" y="0">JUN</text>
    <text x="670" y="0">JUL</text>
    <text x="765" y="0">AUG</text>
    <text x="860" y="0">SEP</text>
    <text x="955" y="0">OCT</text>
    <text x="1050" y="0">NOV</text>
    <text x="1135" y="0">DEC</text>
  </g>
</svg>
