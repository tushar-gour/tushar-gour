<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="chartFillLight" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#C86446" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <style>
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />

  <!-- Section Title -->
  <g transform="translate(48, 36)">
    <text class="mono-meta" x="0" y="0" font-size="11" fill="#656D76" font-weight="600" letter-spacing="1.5">
      CONTRIBUTION ACTIVITY &amp; CADENCE
    </text>
    <text class="sans-text" x="1104" y="0" font-size="11" fill="#8C959F" text-anchor="end">
      Rolling 52-week activity distribution
    </text>
  </g>

  <!-- Hairline Chart Grid -->
  <g stroke="#F0F2F5" stroke-width="1">
    <line x1="48" y1="65" x2="1152" y2="65" />
    <line x1="48" y1="105" x2="1152" y2="105" />
    <line x1="48" y1="145" x2="1152" y2="145" />
    <line x1="48" y1="185" x2="1152" y2="185" />
  </g>

  <!-- Area Fill -->
  <path d="M 48 185
           L 48 160
           C 120 155, 180 170, 240 140
           C 300 110, 360 145, 420 120
           C 480 95, 540 135, 600 100
           C 660 65, 720 120, 780 90
           C 840 60, 900 110, 960 85
           C 1020 60, 1080 95, 1152 75
           L 1152 185 Z"
        fill="url(#chartFillLight)" />

  <!-- Main Curve Stroke -->
  <path d="M 48 160
           C 120 155, 180 170, 240 140
           C 300 110, 360 145, 420 120
           C 480 95, 540 135, 600 100
           C 660 65, 720 120, 780 90
           C 840 60, 900 110, 960 85
           C 1020 60, 1080 95, 1152 75"
        fill="none" stroke="#C86446" stroke-width="1.8" stroke-linecap="round" />

  <!-- Milestone Accent Markers -->
  <g transform="translate(660, 65)">
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" stroke="#C86446" stroke-width="1.5" />
    <text class="mono-meta" x="0" y="-12" font-size="9" fill="#656D76" text-anchor="middle">PEAK CADENCE</text>
  </g>

  <g transform="translate(1020, 60)">
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" stroke="#C86446" stroke-width="1.5" />
    <text class="mono-meta" x="0" y="-12" font-size="9" fill="#656D76" text-anchor="middle">PRODUCTION RELEASE</text>
  </g>

  <!-- X-Axis Timeline Labels -->
  <g class="mono-meta" font-size="10" fill="#8C959F" transform="translate(0, 208)">
    <text x="50" y="0">JAN</text>
    <text x="150" y="0">FEB</text>
    <text x="250" y="0">MAR</text>
    <text x="350" y="0">APR</text>
    <text x="450" y="0">MAY</text>
    <text x="550" y="0">JUN</text>
    <text x="650" y="0">JUL</text>
    <text x="750" y="0">AUG</text>
    <text x="850" y="0">SEP</text>
    <text x="950" y="0">OCT</text>
    <text x="1050" y="0">NOV</text>
    <text x="1130" y="0">DEC</text>
  </g>
</svg>
