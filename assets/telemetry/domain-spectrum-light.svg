<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="320" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Vertical Hairline Column Divider -->
  <line x1="400" y1="24" x2="400" y2="296" stroke="#D0D7DE" stroke-width="1" />

  <!-- LEFT SIDE: Title, Meta & Segmented Spectrum -->
  <g transform="translate(48, 52)">
    <text class="mono-hdr" x="0" y="0" font-size="16" fill="#B85C3F">LANGUAGE</text>
    <text class="sans-bold" x="0" y="32" font-size="28" fill="#1F2328">FOOTPRINT</text>
    <text class="mono-meta" x="0" y="62" font-size="13" fill="#59636E">AGGREGATED REPOSITORY BYTES</text>

    <!-- Full Segmented Horizontal Language Spectrum -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="126" height="12" rx="3" fill="#B85C3F" />
      <rect x="129" y="0" width="108" height="12" rx="3" fill="#1F2328" />
      <rect x="240" y="0" width="60" height="12" rx="3" fill="#59636E" />
      <rect x="303" y="0" width="6" height="12" rx="1.5" fill="#8C959F" />
      <rect x="311" y="0" width="4" height="12" rx="1" fill="#AFB8C1" />
    </g>

    <!-- Summary Details -->
    <g transform="translate(0, 154)">
      <text class="mono-meta" x="0" y="0" font-size="12" fill="#8C959F">TOTAL INDEXED: 9.5 MB</text>
      <text class="mono-meta" x="0" y="22" font-size="12" fill="#8C959F">SOURCE: VERIFIED CODEBASE BYTES</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Ranked Language List -->
  <g transform="translate(440, 48)">
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="18" fill="#1F2328">JavaScript</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#B85C3F" text-anchor="end">40.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="268" height="4" rx="2" fill="#B85C3F" />
    </g>

    <g transform="translate(0, 42)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#1F2328">TypeScript</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#1F2328" text-anchor="end">34.7%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="230" height="4" rx="2" fill="#1F2328" />
    </g>

    <g transform="translate(0, 84)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#59636E">Dart</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#59636E" text-anchor="end">19.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="129" height="4" rx="2" fill="#59636E" />
    </g>

    <g transform="translate(0, 126)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#59636E">C++ / Native</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#8C959F" text-anchor="end">2.0%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="14" height="4" rx="2" fill="#8C959F" />
    </g>

    <g transform="translate(0, 168)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#59636E">Kotlin</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#8C959F" text-anchor="end">1.1%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="8" height="4" rx="2" fill="#AFB8C1" />
    </g>

    <g transform="translate(0, 210)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#8C959F">Other (Swift, HTML, CSS, C)</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#8C959F" text-anchor="end">2.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#E1E4E8" />
      <rect x="0" y="24" width="16" height="4" rx="2" fill="#D0D7DE" />
    </g>
  </g>
</svg>
