<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="300" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 48)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#B85C3F">METRIC</text>
    <text class="sans-bold" x="90" y="0" font-size="26" fill="#1F2328">LANGUAGE FOOTPRINT</text>
    <text class="mono-hdr" x="430" y="0" font-size="18" fill="#59636E">/ AGGREGATED REPOSITORY BYTES</text>
    
    <text class="mono-meta" x="1104" y="0" font-size="16" fill="#8C959F" text-anchor="end">
      9.5 MB INDEXED
    </text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#E1E4E8" stroke-width="1" />

  <!-- Full-Width Segmented Language Spectrum Bar -->
  <g transform="translate(48, 96)">
    <rect x="0" y="0" width="446" height="10" rx="3" fill="#B85C3F" />
    <rect x="450" y="0" width="383" height="10" rx="3" fill="#1F2328" />
    <rect x="837" y="0" width="214" height="10" rx="3" fill="#59636E" />
    <rect x="1055" y="0" width="22" height="10" rx="2" fill="#8C959F" />
    <rect x="1080" y="0" width="12" height="10" rx="2" fill="#AFB8C1" />
    <rect x="1095" y="0" width="9" height="10" rx="2" fill="#D0D7DE" />
  </g>

  <!-- 2-Column Ranked Language Rows Breakdown -->
  <g transform="translate(48, 140)">
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="20" fill="#1F2328">JavaScript</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#B85C3F" text-anchor="end">40.4%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="210" height="5" rx="2.5" fill="#B85C3F" />
    </g>

    <g transform="translate(0, 48)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#1F2328">TypeScript</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#1F2328" text-anchor="end">34.7%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="180" height="5" rx="2.5" fill="#1F2328" />
    </g>

    <g transform="translate(0, 96)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#59636E">Dart</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#59636E" text-anchor="end">19.4%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="101" height="5" rx="2.5" fill="#59636E" />
    </g>
  </g>

  <g transform="translate(630, 140)">
    <g transform="translate(0, 0)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#1F2328">C++ / Native</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#8C959F" text-anchor="end">2.0%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="10" height="5" rx="2.5" fill="#8C959F" />
    </g>

    <g transform="translate(0, 48)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#59636E">Kotlin</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#8C959F" text-anchor="end">1.1%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="5" height="5" rx="2.5" fill="#AFB8C1" />
    </g>

    <g transform="translate(0, 96)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#8C959F">Other (Swift, HTML, CSS, C)</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#8C959F" text-anchor="end">2.4%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#E1E4E8" />
      <rect x="0" y="24" width="12" height="5" rx="2.5" fill="#D0D7DE" />
    </g>
  </g>
</svg>
