<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <style>
      .num-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .tech-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .pct-txt {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base Frame -->
  <rect width="1200" height="200" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 36)">
    <text class="num-hdr" x="0" y="0" font-size="11" fill="#656D76">
      SYSTEMS ALLOCATION &amp; DOMAIN SPECTRUM
    </text>
    <text class="num-hdr" x="1104" y="0" font-size="11" fill="#8C959F" text-anchor="end">
      WEIGHTED BY ARCHITECTURAL FOCUS
    </text>
  </g>
  <line x1="48" y1="48" x2="1152" y2="48" stroke="#E1E4E8" stroke-width="1" />

  <!-- Spectrum Bar 1: Product Surface -->
  <g transform="translate(48, 72)">
    <text class="num-hdr" x="0" y="10" font-size="10" fill="#C86446">01 / SURFACE</text>
    <text class="tech-txt" x="150" y="10" font-size="12" fill="#1F2328">Flutter · React 19 · TypeScript · Tailwind CSS · Vite</text>
    <rect x="680" y="2" width="400" height="10" rx="3" fill="#F1F5F9" />
    <rect x="680" y="2" width="300" height="10" rx="3" fill="#C86446" />
    <text class="pct-txt" x="1104" y="10" font-size="11" fill="#C86446" text-anchor="end">38%</text>
  </g>

  <!-- Spectrum Bar 2: Services -->
  <g transform="translate(48, 102)">
    <text class="num-hdr" x="0" y="10" font-size="10" fill="#656D76">02 / SERVICES</text>
    <text class="tech-txt" x="150" y="10" font-size="12" fill="#656D76">Node.js · Express · Java · Socket.IO · REST &amp; WSS</text>
    <rect x="680" y="2" width="400" height="10" rx="3" fill="#F1F5F9" />
    <rect x="680" y="2" width="250" height="10" rx="3" fill="#656D76" />
    <text class="pct-txt" x="1104" y="10" font-size="11" fill="#656D76" text-anchor="end">32%</text>
  </g>

  <!-- Spectrum Bar 3: Data Plane -->
  <g transform="translate(48, 132)">
    <text class="num-hdr" x="0" y="10" font-size="10" fill="#656D76">03 / DATA</text>
    <text class="tech-txt" x="150" y="10" font-size="12" fill="#656D76">PostgreSQL · Redis · MongoDB · Prisma ORM · SQLite</text>
    <rect x="680" y="2" width="400" height="10" rx="3" fill="#F1F5F9" />
    <rect x="680" y="2" width="145" height="10" rx="3" fill="#8C959F" />
    <text class="pct-txt" x="1104" y="10" font-size="11" fill="#8C959F" text-anchor="end">18%</text>
  </g>

  <!-- Spectrum Bar 4: Infrastructure -->
  <g transform="translate(48, 162)">
    <text class="num-hdr" x="0" y="10" font-size="10" fill="#656D76">04 / DELIVERY</text>
    <text class="tech-txt" x="150" y="10" font-size="12" fill="#656D76">AWS · Google Cloud · Docker · Linux · GitHub Actions</text>
    <rect x="680" y="2" width="400" height="10" rx="3" fill="#F1F5F9" />
    <rect x="680" y="2" width="95" height="10" rx="3" fill="#CBD5E1" />
    <text class="pct-txt" x="1104" y="10" font-size="11" fill="#8C959F" text-anchor="end">12%</text>
  </g>
</svg>
