<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="300" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Vertical Divider Separating Left & Right -->
  <line x1="470" y1="24" x2="470" y2="276" stroke="#D0D7DE" stroke-width="1" />

  <!-- LEFT SIDE: Language Footprint Summary -->
  <g transform="translate(48, 52)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#B85C3F">METRIC</text>
    <text class="sans-bold" x="0" y="32" font-size="28" fill="#1F2328">LANGUAGE FOOTPRINT</text>
    <text class="mono-hdr" x="0" y="60" font-size="16" fill="#59636E">AGGREGATED REPOSITORY BYTES</text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="130" height="8" rx="2" fill="#B85C3F" />
      <rect x="133" y="0" width="105" height="8" rx="2" fill="#1F2328" />
      <rect x="241" y="0" width="62" height="8" rx="2" fill="#59636E" />
      <rect x="306" y="0" width="37" height="8" rx="2" fill="#8C959F" />
      <rect x="346" y="0" width="27" height="8" rx="2" fill="#AFB8C1" />
      <rect x="376" y="0" width="18" height="8" rx="2" fill="#D0D7DE" />
    </g>

    <g transform="translate(0, 160)">
      <text class="mono-hdr" x="0" y="0" font-size="16" fill="#8C959F">REPOSITORY DISTRIBUTION</text>
      
      <g transform="translate(0, 22)">
        <text class="sans-medium" x="0" y="0" font-size="18" fill="#59636E">PUBLIC: <tspan fill="#1F2328" font-weight="700">32</tspan></text>
        <text class="sans-medium" x="140" y="0" font-size="18" fill="#59636E">PRIVATE: <tspan fill="#1F2328" font-weight="700">16</tspan></text>
      </g>

      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#E1E4E8" />
        <rect x="0" y="0" width="173" height="4" rx="2" fill="#59636E" />
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Ranked Language Rows -->
  <g transform="translate(510, 48)">
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="20" fill="#1F2328">TypeScript</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#B85C3F" text-anchor="end">34.2%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="218" height="6" rx="3" fill="#B85C3F" />
    </g>

    <g transform="translate(0, 38)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#1F2328">Dart</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#1F2328" text-anchor="end">27.6%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="176" height="6" rx="3" fill="#1F2328" />
    </g>

    <g transform="translate(0, 76)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#59636E">JavaScript</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#59636E" text-anchor="end">16.4%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="105" height="6" rx="3" fill="#59636E" />
    </g>

    <g transform="translate(0, 114)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#59636E">Java</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#8C959F" text-anchor="end">9.8%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="63" height="6" rx="3" fill="#8C959F" />
    </g>

    <g transform="translate(0, 152)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#59636E">Python</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#8C959F" text-anchor="end">7.2%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="46" height="6" rx="3" fill="#AFB8C1" />
    </g>

    <g transform="translate(0, 190)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#8C959F">Other (C++, SQL, Shell)</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#8C959F" text-anchor="end">4.8%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#E1E4E8" />
      <rect x="0" y="24" width="31" height="6" rx="3" fill="#D0D7DE" />
    </g>
  </g>
</svg>
