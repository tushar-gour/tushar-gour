<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="320" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Vertical Hairline Column Divider (35% / 65% split) -->
  <line x1="400" y1="24" x2="400" y2="296" stroke="#28313A" stroke-width="1" />

  <!-- ============================================================= -->
  <!-- LEFT SIDE: Title, Meta & Segmented Spectrum (35%)             -->
  <!-- ============================================================= -->
  <g transform="translate(48, 52)">
    <text class="mono-hdr" x="0" y="0" font-size="16" fill="#C96A4B">LANGUAGE</text>
    <text class="sans-bold" x="0" y="32" font-size="28" fill="#F0EEE8">FOOTPRINT</text>
    <text class="mono-meta" x="0" y="62" font-size="13" fill="#7B858F">AGGREGATED REPOSITORY BYTES</text>

    <!-- Full Segmented Horizontal Language Spectrum -->
    <g transform="translate(0, 102)">
      <!-- JavaScript 40.4% (Terracotta) -->
      <rect x="0" y="0" width="126" height="12" rx="3" fill="#C96A4B" />
      <!-- TypeScript 34.7% (Warm Off-White) -->
      <rect x="129" y="0" width="108" height="12" rx="3" fill="#F0EEE8" />
      <!-- Dart 19.4% (Steel) -->
      <rect x="240" y="0" width="60" height="12" rx="3" fill="#7B858F" />
      <!-- C++ 2.0% -->
      <rect x="303" y="0" width="6" height="12" rx="1.5" fill="#5F6974" />
      <!-- Kotlin 1.1% -->
      <rect x="311" y="0" width="4" height="12" rx="1" fill="#3E4651" />
    </g>

    <!-- Summary Details -->
    <g transform="translate(0, 154)">
      <text class="mono-meta" x="0" y="0" font-size="12" fill="#5F6974">TOTAL INDEXED: 9.5 MB</text>
      <text class="mono-meta" x="0" y="22" font-size="12" fill="#5F6974">SOURCE: VERIFIED CODEBASE BYTES</text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- RIGHT SIDE: Ranked Language List (65%)                        -->
  <!-- ============================================================= -->
  <g transform="translate(440, 48)">
    <!-- Row 1: JavaScript (Terracotta Focal) -->
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="18" fill="#F0EEE8">JavaScript</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#C96A4B" text-anchor="end">40.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="268" height="4" rx="2" fill="#C96A4B" />
    </g>

    <!-- Row 2: TypeScript (Warm Off-White) -->
    <g transform="translate(0, 42)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#D7D5CF">TypeScript</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#F0EEE8" text-anchor="end">34.7%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="230" height="4" rx="2" fill="#F0EEE8" />
    </g>

    <!-- Row 3: Dart (Steel) -->
    <g transform="translate(0, 84)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#D7D5CF">Dart</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#7B858F" text-anchor="end">19.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="129" height="4" rx="2" fill="#7B858F" />
    </g>

    <!-- Row 4: C++ (Medium Steel) -->
    <g transform="translate(0, 126)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#D7D5CF">C++ / Native</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#5F6974" text-anchor="end">2.0%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="14" height="4" rx="2" fill="#5F6974" />
    </g>

    <!-- Row 5: Kotlin (Dark Steel) -->
    <g transform="translate(0, 168)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#D7D5CF">Kotlin</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#5F6974" text-anchor="end">1.1%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="8" height="4" rx="2" fill="#3E4651" />
    </g>

    <!-- Row 6: Other (Subtle Steel) -->
    <g transform="translate(0, 210)">
      <text class="sans-medium" x="0" y="16" font-size="18" fill="#7B858F">Other (Swift, HTML, CSS, C)</text>
      <text class="mono-val" x="664" y="16" font-size="16" fill="#5F6974" text-anchor="end">2.4%</text>
      <rect x="0" y="24" width="664" height="4" rx="2" fill="#1C252E" />
      <rect x="0" y="24" width="16" height="4" rx="2" fill="#28313A" />
    </g>
  </g>
</svg>
