<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="300" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Vertical Divider Separating Left & Right (~40% / ~60%) -->
  <line x1="470" y1="24" x2="470" y2="276" stroke="#28313A" stroke-width="1" />

  <!-- LEFT SIDE: Language Footprint Summary -->
  <g transform="translate(48, 52)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#C96A4B">METRIC</text>
    <text class="sans-bold" x="0" y="32" font-size="28" fill="#F0EEE8">LANGUAGE FOOTPRINT</text>
    <text class="mono-hdr" x="0" y="60" font-size="16" fill="#7B858F">AGGREGATED REPOSITORY BYTES</text>

    <!-- Multi-Segment Full-Width Summary Bar -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="130" height="8" rx="2" fill="#C96A4B" />
      <rect x="133" y="0" width="105" height="8" rx="2" fill="#F0EEE8" />
      <rect x="241" y="0" width="62" height="8" rx="2" fill="#7B858F" />
      <rect x="306" y="0" width="37" height="8" rx="2" fill="#5F6974" />
      <rect x="346" y="0" width="27" height="8" rx="2" fill="#3E4651" />
      <rect x="376" y="0" width="18" height="8" rx="2" fill="#28313A" />
    </g>

    <!-- Public / Private Repository Count Split -->
    <g transform="translate(0, 160)">
      <text class="mono-hdr" x="0" y="0" font-size="16" fill="#5F6974">REPOSITORY DISTRIBUTION</text>
      
      <g transform="translate(0, 22)">
        <text class="sans-medium" x="0" y="0" font-size="18" fill="#D7D5CF">PUBLIC: <tspan fill="#F0EEE8" font-weight="700">32</tspan></text>
        <text class="sans-medium" x="140" y="0" font-size="18" fill="#D7D5CF">PRIVATE: <tspan fill="#F0EEE8" font-weight="700">16</tspan></text>
      </g>

      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#1C252E" />
        <rect x="0" y="0" width="173" height="4" rx="2" fill="#7B858F" />
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Ranked Language Rows (6 Languages) -->
  <g transform="translate(510, 48)">
    <!-- Row 1: TypeScript (Terracotta Active Accent) -->
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="20" fill="#F0EEE8">TypeScript</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#C96A4B" text-anchor="end">34.2%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="218" height="6" rx="3" fill="#C96A4B" />
    </g>

    <!-- Row 2: Dart -->
    <g transform="translate(0, 38)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">Dart</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#F0EEE8" text-anchor="end">27.6%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="176" height="6" rx="3" fill="#F0EEE8" />
    </g>

    <!-- Row 3: JavaScript -->
    <g transform="translate(0, 76)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">JavaScript</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#7B858F" text-anchor="end">16.4%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="105" height="6" rx="3" fill="#7B858F" />
    </g>

    <!-- Row 4: Java -->
    <g transform="translate(0, 114)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">Java</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#5F6974" text-anchor="end">9.8%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="63" height="6" rx="3" fill="#5F6974" />
    </g>

    <!-- Row 5: Python -->
    <g transform="translate(0, 152)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">Python</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#5F6974" text-anchor="end">7.2%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="46" height="6" rx="3" fill="#3E4651" />
    </g>

    <!-- Row 6: Other (C++, SQL, Lua) -->
    <g transform="translate(0, 190)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#7B858F">Other (C++, SQL, Shell)</text>
      <text class="mono-val" x="640" y="16" font-size="18" fill="#5F6974" text-anchor="end">4.8%</text>
      <rect x="0" y="24" width="640" height="6" rx="3" fill="#1C252E" />
      <rect x="0" y="24" width="31" height="6" rx="3" fill="#28313A" />
    </g>
  </g>
</svg>
