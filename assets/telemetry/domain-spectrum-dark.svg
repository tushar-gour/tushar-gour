<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      .mono-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-val {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="300" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Top Header Bar -->
  <g transform="translate(48, 48)">
    <text class="mono-hdr" x="0" y="0" font-size="18" fill="#C96A4B">METRIC</text>
    <text class="sans-bold" x="90" y="0" font-size="26" fill="#F0EEE8">LANGUAGE FOOTPRINT</text>
    <text class="mono-hdr" x="430" y="0" font-size="18" fill="#7B858F">/ AGGREGATED REPOSITORY BYTES</text>
    
    <text class="mono-meta" x="1104" y="0" font-size="16" fill="#5F6974" text-anchor="end">
      9.5 MB INDEXED
    </text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#1C252E" stroke-width="1" />

  <!-- Full-Width Segmented Language Spectrum Bar -->
  <g transform="translate(48, 96)">
    <!-- JavaScript 40.4% (Terracotta) -->
    <rect x="0" y="0" width="446" height="10" rx="3" fill="#C96A4B" />
    <!-- TypeScript 34.7% (Warm Off-White) -->
    <rect x="450" y="0" width="383" height="10" rx="3" fill="#F0EEE8" />
    <!-- Dart 19.4% (Steel Gray) -->
    <rect x="837" y="0" width="214" height="10" rx="3" fill="#7B858F" />
    <!-- C++ 2.0% -->
    <rect x="1055" y="0" width="22" height="10" rx="2" fill="#5F6974" />
    <!-- Kotlin 1.1% -->
    <rect x="1080" y="0" width="12" height="10" rx="2" fill="#3E4651" />
    <!-- Other 2.4% -->
    <rect x="1095" y="0" width="9" height="10" rx="2" fill="#28313A" />
  </g>

  <!-- 2-Column Ranked Language Rows Breakdown -->
  <!-- Left Column: Top 3 Languages -->
  <g transform="translate(48, 140)">
    <!-- Row 1: JavaScript (Terracotta Focal) -->
    <g transform="translate(0, 0)">
      <text class="sans-bold" x="0" y="16" font-size="20" fill="#F0EEE8">JavaScript</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#C96A4B" text-anchor="end">40.4%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="210" height="5" rx="2.5" fill="#C96A4B" />
    </g>

    <!-- Row 2: TypeScript (Off-White) -->
    <g transform="translate(0, 48)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">TypeScript</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#F0EEE8" text-anchor="end">34.7%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="180" height="5" rx="2.5" fill="#F0EEE8" />
    </g>

    <!-- Row 3: Dart (Steel) -->
    <g transform="translate(0, 96)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">Dart</text>
      <text class="mono-val" x="520" y="16" font-size="18" fill="#7B858F" text-anchor="end">19.4%</text>
      <rect x="0" y="24" width="520" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="101" height="5" rx="2.5" fill="#7B858F" />
    </g>
  </g>

  <!-- Right Column: Supporting Languages -->
  <g transform="translate(630, 140)">
    <!-- Row 4: C++ -->
    <g transform="translate(0, 0)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">C++ / Native</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#5F6974" text-anchor="end">2.0%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="10" height="5" rx="2.5" fill="#5F6974" />
    </g>

    <!-- Row 5: Kotlin -->
    <g transform="translate(0, 48)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#D7D5CF">Kotlin</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#5F6974" text-anchor="end">1.1%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="5" height="5" rx="2.5" fill="#3E4651" />
    </g>

    <!-- Row 6: Other -->
    <g transform="translate(0, 96)">
      <text class="sans-medium" x="0" y="16" font-size="20" fill="#7B858F">Other (Swift, HTML, CSS, C)</text>
      <text class="mono-val" x="474" y="16" font-size="18" fill="#5F6974" text-anchor="end">2.4%</text>
      <rect x="0" y="24" width="474" height="5" rx="2.5" fill="#1C252E" />
      <rect x="0" y="24" width="12" height="5" rx="2.5" fill="#28313A" />
    </g>
  </g>
</svg>
