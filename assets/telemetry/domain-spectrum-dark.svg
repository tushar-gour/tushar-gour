<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <style>
      .m { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" rx="12" fill="#101110"/>
  <rect width="1200" height="430" rx="12" fill="none" stroke="#38322D" stroke-width="1.2"/>

  <!-- Header -->
  <text class="m" x="42" y="46" font-size="16" font-weight="800" fill="#F8BA6A" letter-spacing="2">TELEMETRY</text>
  <text class="s" x="146" y="46" font-size="30" font-weight="900" fill="#F0E9DD" letter-spacing="-0.5">LANGUAGE FOOTPRINT</text>
  <text class="m" x="495" y="46" font-size="16" font-weight="600" fill="#B7A58E" letter-spacing="1">/ AGGREGATED CODE VOLUME</text>
  <text class="m" x="1158" y="46" font-size="15" font-weight="600" fill="#B7A58E" letter-spacing="1" text-anchor="end">ALL AUTHORED REPOSITORIES</text>

  <!-- Stacked Full-Width Spectrum Bar with Gaps (y=76, h=30, w=1116) -->
  <g transform="translate(42, 76)">
    <rect width="1116" height="30" rx="6" fill="#101110" stroke="#3A332B" stroke-width="1"/>
    <rect x="0" y="0" width="445" height="30" rx="5" fill="#F8BA6A"/>
    <rect x="450" y="0" width="381" height="30" rx="5" fill="#E3D2B5"/>
    <rect x="836" y="0" width="213" height="30" rx="5" fill="#C5A37C"/>
    <rect x="1054" y="0" width="21" height="30" rx="5" fill="#A5805B"/>
    <rect x="1080" y="0" width="12" height="30" rx="5" fill="#79634E"/>
    <rect x="1097" y="0" width="19" height="30" rx="5" fill="#594E43"/>
  </g>

  <!-- Two-Column Language Details Grid -->
  <!-- JavaScript -->
  <circle cx="52" cy="160" r="8" fill="#F8BA6A"/>
  <text class="s" x="72" y="167" font-size="22" font-weight="700" fill="#F0E9DD">JavaScript</text>
  <text class="m" x="420" y="167" font-size="22" font-weight="800" fill="#F8BA6A" text-anchor="end">40.8%</text>
  <text class="m" x="540" y="167" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">3,841,751 B</text>
  <rect x="72" y="180" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="72" y="180" width="190" height="10" rx="5" fill="#F8BA6A"/>
  <!-- TypeScript -->
  <circle cx="52" cy="245" r="8" fill="#E3D2B5"/>
  <text class="s" x="72" y="252" font-size="22" font-weight="700" fill="#F0E9DD">TypeScript</text>
  <text class="m" x="420" y="252" font-size="22" font-weight="800" fill="#E3D2B5" text-anchor="end">35.0%</text>
  <text class="m" x="540" y="252" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">3,299,779 B</text>
  <rect x="72" y="265" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="72" y="265" width="163" height="10" rx="5" fill="#E3D2B5"/>
  <!-- Dart -->
  <circle cx="52" cy="330" r="8" fill="#C5A37C"/>
  <text class="s" x="72" y="337" font-size="22" font-weight="700" fill="#F0E9DD">Dart</text>
  <text class="m" x="420" y="337" font-size="22" font-weight="800" fill="#C5A37C" text-anchor="end">19.6%</text>
  <text class="m" x="540" y="337" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">1,846,238 B</text>
  <rect x="72" y="350" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="72" y="350" width="91" height="10" rx="5" fill="#C5A37C"/>
  <!-- C++ -->
  <circle cx="642" cy="160" r="8" fill="#A5805B"/>
  <text class="s" x="662" y="167" font-size="22" font-weight="700" fill="#F0E9DD">C++</text>
  <text class="m" x="1010" y="167" font-size="22" font-weight="800" fill="#A5805B" text-anchor="end">2.0%</text>
  <text class="m" x="1130" y="167" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">187,921 B</text>
  <rect x="662" y="180" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="662" y="180" width="9" height="10" rx="5" fill="#A5805B"/>
  <!-- Kotlin -->
  <circle cx="642" cy="245" r="8" fill="#79634E"/>
  <text class="s" x="662" y="252" font-size="22" font-weight="700" fill="#F0E9DD">Kotlin</text>
  <text class="m" x="1010" y="252" font-size="22" font-weight="800" fill="#79634E" text-anchor="end">1.1%</text>
  <text class="m" x="1130" y="252" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">100,395 B</text>
  <rect x="662" y="265" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="662" y="265" width="5" height="10" rx="5" fill="#79634E"/>
  <!-- Other -->
  <circle cx="642" cy="330" r="8" fill="#594E43"/>
  <text class="s" x="662" y="337" font-size="22" font-weight="700" fill="#F0E9DD">Other</text>
  <text class="m" x="1010" y="337" font-size="22" font-weight="800" fill="#594E43" text-anchor="end">1.5%</text>
  <text class="m" x="1130" y="337" font-size="18" font-weight="600" fill="#AA9A87" text-anchor="end">144,646 B</text>
  <rect x="662" y="350" width="468" height="10" rx="5" fill="#3A332B"/>
  <rect x="662" y="350" width="7" height="10" rx="5" fill="#594E43"/>
</svg>
