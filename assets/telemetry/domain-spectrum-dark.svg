<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>
      .m { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="10" fill="#0C1018"/>
  <rect width="1200" height="360" rx="10" fill="none" stroke="#1C2632" stroke-width="1.2"/>

  <!-- Header -->
  <text class="m" x="42" y="44" font-size="11" font-weight="800" fill="#C97B4B" letter-spacing="2">TELEMETRY</text>
  <text class="s" x="125" y="44" font-size="22" font-weight="900" fill="#DED5C6" letter-spacing="-0.5">LANGUAGE FOOTPRINT</text>
  <text class="m" x="380" y="44" font-size="13" font-weight="600" fill="#4E6070" letter-spacing="1">/ AGGREGATED CODE VOLUME</text>
  <text class="m" x="1158" y="44" font-size="12" font-weight="600" fill="#4E6070" letter-spacing="1" text-anchor="end">ALL AUTHORED REPOSITORIES</text>

  <!-- Stacked Full-Width Spectrum Bar with Gaps (y=72, h=22, w=1116) -->
  <g transform="translate(42, 72)">
    <rect width="1116" height="22" rx="5" fill="#0C1018" stroke="#192230" stroke-width="1"/>
    <rect x="0" y="0" width="447" height="22" rx="4" fill="#C97B4B"/>
    <rect x="451" y="0" width="383" height="22" rx="4" fill="#D0C8B8"/>
    <rect x="838" y="0" width="214" height="22" rx="4" fill="#9AB0C0"/>
    <rect x="1056" y="0" width="21" height="22" rx="4" fill="#6A8090"/>
    <rect x="1081" y="0" width="12" height="22" rx="4" fill="#4A6070"/>
    <rect x="1097" y="0" width="19" height="22" rx="4" fill="#2E3E4E"/>
  </g>

  <!-- Two-Column Language Details Grid -->
  <!-- JavaScript -->
  <circle cx="50" cy="145" r="6" fill="#C97B4B"/>
  <text class="s" x="66" y="150" font-size="16" font-weight="700" fill="#DED5C6">JavaScript</text>
  <text class="m" x="460" y="150" font-size="15" font-weight="800" fill="#C97B4B" text-anchor="end">40.8%</text>
  <text class="m" x="540" y="150" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">3,841,751 B</text>
  <rect x="66" y="161" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="66" y="161" width="193" height="6" rx="3" fill="#C97B4B"/>
  <!-- TypeScript -->
  <circle cx="50" cy="210" r="6" fill="#D0C8B8"/>
  <text class="s" x="66" y="215" font-size="16" font-weight="700" fill="#DED5C6">TypeScript</text>
  <text class="m" x="460" y="215" font-size="15" font-weight="800" fill="#D0C8B8" text-anchor="end">35.0%</text>
  <text class="m" x="540" y="215" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">3,299,789 B</text>
  <rect x="66" y="226" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="66" y="226" width="165" height="6" rx="3" fill="#D0C8B8"/>
  <!-- Dart -->
  <circle cx="50" cy="275" r="6" fill="#9AB0C0"/>
  <text class="s" x="66" y="280" font-size="16" font-weight="700" fill="#DED5C6">Dart</text>
  <text class="m" x="460" y="280" font-size="15" font-weight="800" fill="#9AB0C0" text-anchor="end">19.6%</text>
  <text class="m" x="540" y="280" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">1,846,238 B</text>
  <rect x="66" y="291" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="66" y="291" width="92" height="6" rx="3" fill="#9AB0C0"/>
  <!-- C++ -->
  <circle cx="640" cy="145" r="6" fill="#6A8090"/>
  <text class="s" x="656" y="150" font-size="16" font-weight="700" fill="#DED5C6">C++</text>
  <text class="m" x="1050" y="150" font-size="15" font-weight="800" fill="#6A8090" text-anchor="end">2.0%</text>
  <text class="m" x="1130" y="150" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">187,921 B</text>
  <rect x="656" y="161" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="656" y="161" width="9" height="6" rx="3" fill="#6A8090"/>
  <!-- Kotlin -->
  <circle cx="640" cy="210" r="6" fill="#4A6070"/>
  <text class="s" x="656" y="215" font-size="16" font-weight="700" fill="#DED5C6">Kotlin</text>
  <text class="m" x="1050" y="215" font-size="15" font-weight="800" fill="#4A6070" text-anchor="end">1.1%</text>
  <text class="m" x="1130" y="215" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">100,395 B</text>
  <rect x="656" y="226" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="656" y="226" width="5" height="6" rx="3" fill="#4A6070"/>
  <!-- Other -->
  <circle cx="640" cy="275" r="6" fill="#2E3E4E"/>
  <text class="s" x="656" y="280" font-size="16" font-weight="700" fill="#DED5C6">Other</text>
  <text class="m" x="1050" y="280" font-size="15" font-weight="800" fill="#2E3E4E" text-anchor="end">1.5%</text>
  <text class="m" x="1130" y="280" font-size="13" font-weight="600" fill="#374A5C" text-anchor="end">143,814 B</text>
  <rect x="656" y="291" width="474" height="6" rx="3" fill="#192230"/>
  <rect x="656" y="291" width="7" height="6" rx="3" fill="#2E3E4E"/>
</svg>
