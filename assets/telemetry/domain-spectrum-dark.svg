<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs><style>.m{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style></defs>

  <rect width="1200" height="340" rx="10" fill="#0C1018"/>
  <rect width="1200" height="340" rx="10" fill="none" stroke="#1C2632" stroke-width="1.2"/>

  <!-- ── LEFT PANEL ── -->
  <text class="m" x="42" y="58" font-size="12" font-weight="800" fill="#C97B4B" letter-spacing="2">LANGUAGE</text>
  <text class="s" x="42" y="128" font-size="56" font-weight="900" fill="#DED5C6" letter-spacing="-2">FOOTPRINT</text>
  <text class="m" x="42" y="158" font-size="11" font-weight="600" fill="#4A6070" letter-spacing="2">AGGREGATED REPOSITORY BYTES</text>

  <!-- Spectrum bar (JS=129px | TS=111px | Dart=62px | C++=6px | Kotlin=4px | Other=8px, gap=3) -->
  <!-- JavaScript: terracotta -->
  <rect x="42"  y="190" width="129" height="18" rx="3" fill="#C97B4B"/>
  <!-- TypeScript: warm cream -->
  <rect x="174" y="190" width="111" height="18" rx="3" fill="#D0C8B8"/>
  <!-- Dart: blue-gray -->
  <rect x="288" y="190" width="62"  height="18" rx="3" fill="#9AB0C0"/>
  <!-- C++ / Native: dark -->
  <rect x="353" y="190" width="6"   height="18" rx="3" fill="#6A8090"/>
  <!-- Kotlin: darker -->
  <rect x="362" y="190" width="4"   height="18" rx="3" fill="#4A6070"/>
  <!-- Other: darkest -->
  <rect x="369" y="190" width="8"   height="18" rx="3" fill="#2E3E4E"/>

  <!-- Marker dot -->
  <circle cx="388" cy="199" r="8"   fill="none" stroke="#C97B4B" stroke-width="1.8"/>
  <circle cx="388" cy="199" r="3.5" fill="#C97B4B"/>

  <!-- Database icon -->
  <ellipse cx="51" cy="248" rx="9" ry="3.5" fill="none" stroke="#374A5C" stroke-width="1.3"/>
  <line x1="42" y1="248" x2="42" y2="260" stroke="#374A5C" stroke-width="1.3"/>
  <line x1="60" y1="248" x2="60" y2="260" stroke="#374A5C" stroke-width="1.3"/>
  <ellipse cx="51" cy="260" rx="9" ry="3.5" fill="none" stroke="#374A5C" stroke-width="1.3"/>
  <text class="m" x="70" y="262" font-size="11.5" font-weight="600" fill="#4A6070" letter-spacing="1">TOTAL INDEXED: 9.5 MB</text>

  <!-- Shield icon -->
  <path d="M 51 276 Q 42 272 42 265 L 42 282 Q 42 294 51 298 Q 60 294 60 282 L 60 265 Q 60 272 51 276 Z" fill="none" stroke="#374A5C" stroke-width="1.3"/>
  <text class="m" x="70" y="294" font-size="11.5" font-weight="600" fill="#374A5C" letter-spacing="1">SOURCE: VERIFIED CODEBASE BYTES</text>

  <!-- Divider -->
  <line x1="424" y1="20" x2="424" y2="320" stroke="#1C2632" stroke-width="1"/>

  <!-- ── RIGHT PANEL ── -->
  <!-- JavaScript: 40.4% — bar 282px -->
  <text class="s" x="460" y="58"  font-size="16" font-weight="500" fill="#DED5C6">JavaScript</text>
  <text class="m" x="1158" y="58" font-size="14" font-weight="700" fill="#C97B4B" text-anchor="end">40.4%</text>
  <rect x="460" y="66" width="282" height="7" rx="3.5" fill="#C97B4B"/>

  <!-- TypeScript: 34.7% — bar 242px -->
  <text class="s" x="460" y="104"  font-size="16" font-weight="500" fill="#DED5C6">TypeScript</text>
  <text class="m" x="1158" y="104" font-size="14" font-weight="700" fill="#DED5C6" text-anchor="end">34.7%</text>
  <rect x="460" y="112" width="242" height="7" rx="3.5" fill="#B0A898"/>

  <!-- Dart: 19.4% — bar 135px -->
  <text class="s" x="460" y="150"  font-size="16" font-weight="500" fill="#DED5C6">Dart</text>
  <text class="m" x="1158" y="150" font-size="14" font-weight="700" fill="#DED5C6" text-anchor="end">19.4%</text>
  <rect x="460" y="158" width="135" height="7" rx="3.5" fill="#7A8A9A"/>

  <!-- C++ / Native: 2.0% — bar 14px -->
  <text class="s" x="460" y="196"  font-size="16" font-weight="500" fill="#DED5C6">C++ / Native</text>
  <text class="m" x="1158" y="196" font-size="14" font-weight="700" fill="#DED5C6" text-anchor="end">2.0%</text>
  <rect x="460" y="204" width="14" height="7" rx="3.5" fill="#4A6070"/>

  <!-- Kotlin: 1.1% — bar 8px -->
  <text class="s" x="460" y="242"  font-size="16" font-weight="500" fill="#DED5C6">Kotlin</text>
  <text class="m" x="1158" y="242" font-size="14" font-weight="700" fill="#DED5C6" text-anchor="end">1.1%</text>
  <rect x="460" y="250" width="8" height="7" rx="3.5" fill="#3A5060"/>

  <!-- Other: 2.4% — bar 17px -->
  <text class="s" x="460" y="288"  font-size="16" font-weight="500" fill="#DED5C6">Other (Swift, HTML, CSS, C)</text>
  <text class="m" x="1158" y="288" font-size="14" font-weight="700" fill="#DED5C6" text-anchor="end">2.4%</text>
  <rect x="460" y="296" width="17" height="7" rx="3.5" fill="#2E3E4E"/>
</svg>
