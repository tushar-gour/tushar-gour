<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FF6B4A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A65" />
      <stop offset="40%" stop-color="#FF5722" />
      <stop offset="80%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#FFab91" />
    </linearGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { r: 4; opacity: 0.8; }
        50% { r: 6.5; opacity: 1; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .pulse-peak { animation: pulseNode 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="14" fill="#080C12" stroke="#1B2535" stroke-width="1.5" />

  <!-- Section Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#FF5722" letter-spacing="1.5">● ACTIVITY TELEMETRY</text>
    <text x="210" y="32" letter-spacing="1">52-WEEK COMMIT CADENCE &amp; WORKFLOW VELOCITY</text>
    <text x="1168" y="32" text-anchor="end" letter-spacing="1">AGGREGATE RUNTIME: CONTINUOUS // P99 = NOMINAL</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1B2535" stroke-width="1" />

  <!-- Chart Area Grid Lines -->
  <g stroke="#1A2434" stroke-width="1" stroke-dasharray="3 3" opacity="0.8">
    <line x1="60" y1="80" x2="1140" y2="80" />
    <line x1="60" y1="130" x2="1140" y2="130" />
    <line x1="60" y1="180" x2="1140" y2="180" />
    <line x1="60" y1="230" x2="1140" y2="230" />

    <!-- Vertical month dividers -->
    <line x1="150" y1="60" x2="150" y2="240" />
    <line x1="330" y1="60" x2="330" y2="240" />
    <line x1="510" y1="60" x2="510" y2="240" />
    <line x1="690" y1="60" x2="690" y2="240" />
    <line x1="870" y1="60" x2="870" y2="240" />
    <line x1="1050" y1="60" x2="1050" y2="240" />
  </g>

  <!-- Y-Axis Labels -->
  <g class="mono" font-size="9" fill="#58677C" text-anchor="end">
    <text x="52" y="84">100</text>
    <text x="52" y="134">60</text>
    <text x="52" y="184">30</text>
    <text x="52" y="234">0</text>
  </g>

  <!-- Area Fill Under Spline -->
  <path d="M 60 230 
           L 60 210 
           C 100 190, 130 205, 170 170 
           C 210 135, 240 160, 280 140 
           C 320 120, 350 95, 390 105 
           C 430 115, 470 180, 510 150 
           C 550 120, 580 80, 620 75 
           C 660 70, 700 130, 740 110 
           C 780 90, 810 145, 850 125 
           C 890 105, 930 70, 970 85 
           C 1010 100, 1050 140, 1090 115 
           C 1115 100, 1130 95, 1140 90 
           L 1140 230 Z" 
        fill="url(#chartGrad)" />

  <!-- The Telemetry Spline Wave Curve -->
  <path d="M 60 210 
           C 100 190, 130 205, 170 170 
           C 210 135, 240 160, 280 140 
           C 320 120, 350 95, 390 105 
           C 430 115, 470 180, 510 150 
           C 550 120, 580 80, 620 75 
           C 660 70, 700 130, 740 110 
           C 780 90, 810 145, 850 125 
           C 890 105, 930 70, 970 85 
           C 1010 100, 1050 140, 1090 115 
           C 1115 100, 1130 95, 1140 90" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#waveGlow)" />

  <!-- Rolling Average Dotted Line -->
  <path d="M 60 195 Q 350 140, 620 110 T 1140 100" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Milestone Event Callouts on Curve Peaks -->
  <!-- Peak 1: Streamly Transcoder Architecture -->
  <g transform="translate(390, 105)">
    <circle class="pulse-peak" cx="0" cy="0" r="4.5" fill="#FF5722" filter="url(#waveGlow)" />
    <line x1="0" y1="-8" x2="0" y2="-28" stroke="#FF5722" stroke-width="1" />
    <rect x="-65" y="-48" width="130" height="20" rx="4" fill="#141D2A" stroke="#2B3C54" stroke-width="1" />
    <text class="mono" x="0" y="-34" font-size="9" fill="#F1EEE7" text-anchor="middle" font-weight="600">STREAMLY v1.2 RELEASE</text>
  </g>

  <!-- Peak 2: Rigrush Production Sync Deployment -->
  <g transform="translate(620, 75)">
    <circle class="pulse-peak" cx="0" cy="0" r="5" fill="#00E5FF" filter="url(#waveGlow)" />
    <line x1="0" y1="-8" x2="0" y2="-28" stroke="#00E5FF" stroke-width="1" />
    <rect x="-65" y="-48" width="130" height="20" rx="4" fill="#141D2A" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1" />
    <text class="mono" x="0" y="-34" font-size="9" fill="#00E5FF" text-anchor="middle" font-weight="700">RIGRUSH PROD LAUNCH</text>
  </g>

  <!-- Peak 3: Tombi Distributed Protocol -->
  <g transform="translate(970, 85)">
    <circle class="pulse-peak" cx="0" cy="0" r="4.5" fill="#00E676" filter="url(#waveGlow)" />
    <line x1="0" y1="-8" x2="0" y2="-28" stroke="#00E676" stroke-width="1" />
    <rect x="-60" y="-48" width="120" height="20" rx="4" fill="#141D2A" stroke="#2B3C54" stroke-width="1" />
    <text class="mono" x="0" y="-34" font-size="9" fill="#69F0AE" text-anchor="middle" font-weight="600">TOMBI PROTOCOL v1</text>
  </g>

  <!-- Month Timeline Labels on X-Axis -->
  <g class="mono" font-size="10" fill="#7E8B9B">
    <text x="70" y="254">JAN</text>
    <text x="160" y="254">FEB</text>
    <text x="250" y="254">MAR</text>
    <text x="340" y="254">APR</text>
    <text x="430" y="254">MAY</text>
    <text x="520" y="254">JUN</text>
    <text x="610" y="254">JUL</text>
    <text x="700" y="254">AUG</text>
    <text x="790" y="254">SEP</text>
    <text x="880" y="254">OCT</text>
    <text x="970" y="254">NOV</text>
    <text x="1060" y="254">DEC</text>
  </g>

  <!-- Bottom Telemetry Metric Summary Ribbon -->
  <g transform="translate(32, 275)">
    <rect width="1136" height="46" rx="8" fill="#0C1118" stroke="#1C2739" stroke-width="1" />
    <g class="mono" font-size="10" fill="#A0AEC0">
      <circle cx="24" cy="23" r="4" fill="#FF5722" />
      <text x="36" y="27"><tspan fill="#F1EEE7" font-weight="700">2,480+</tspan> Lifetime Commits</text>

      <circle cx="280" cy="23" r="4" fill="#00E5FF" />
      <text x="292" y="27"><tspan fill="#F1EEE7" font-weight="700">140+</tspan> PRs Reviewed &amp; Merged</text>

      <circle cx="560" cy="23" r="4" fill="#00E676" />
      <text x="572" y="27"><tspan fill="#F1EEE7" font-weight="700">99.4%</tspan> Build Pass Rate</text>

      <circle cx="840" cy="23" r="4" fill="#FFB300" />
      <text x="852" y="27"><tspan fill="#F1EEE7" font-weight="700">0.02s</tspan> Mean Telemetry Response</text>
    </g>
  </g>
</svg>
