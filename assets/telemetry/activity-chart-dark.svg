<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="chartFillDark" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.0" />
    </linearGradient>

    <style>
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base Frame (60% Graphite) -->
  <rect width="1200" height="280" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.2" />

  <!-- Section Top Header Bar -->
  <g transform="translate(48, 38)">
    <text class="mono-meta" x="0" y="0" font-size="11" fill="#8B949E" font-weight="600" letter-spacing="1.5">
      CONTRIBUTION ACTIVITY &amp; COMMIT CADENCE
    </text>
    <text class="mono-meta" x="1104" y="0" font-size="11" fill="#6E7681" text-anchor="end">
      ROLLING 52-WEEK VELOCITY // 2,450+ COMMITS
    </text>
  </g>
  <line x1="48" y1="52" x2="1152" y2="52" stroke="#21262D" stroke-width="1" />

  <!-- Hairline Grid Lines with Muted Y-Axis Labels -->
  <g stroke="#161B22" stroke-width="1">
    <line x1="80" y1="80" x2="1152" y2="80" />
    <line x1="80" y1="125" x2="1152" y2="125" />
    <line x1="80" y1="170" x2="1152" y2="170" />
    <line x1="80" y1="215" x2="1152" y2="215" />
  </g>

  <g class="mono-meta" font-size="9" fill="#484F58" text-anchor="end">
    <text x="70" y="83">100</text>
    <text x="70" y="128">65</text>
    <text x="70" y="173">30</text>
    <text x="70" y="218">0</text>
  </g>

  <!-- Area Fill Under Spline (6% Opacity Terracotta) -->
  <path d="M 80 215
           L 80 185
           C 160 180, 220 195, 300 160
           C 380 125, 440 165, 520 135
           C 600 105, 660 150, 740 110
           C 820 70, 880 135, 960 95
           C 1040 65, 1100 115, 1152 85
           L 1152 215 Z"
        fill="url(#chartFillDark)" />

  <!-- Secondary Gray Rolling Average Reference Line -->
  <path d="M 80 180 Q 400 150, 700 120 T 1152 95" 
        fill="none" stroke="#30363D" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Primary Terracotta Data Spline Curve (10% Accent) -->
  <path d="M 80 185
           C 160 180, 220 195, 300 160
           C 380 125, 440 165, 520 135
           C 600 105, 660 150, 740 110
           C 820 70, 880 135, 960 95
           C 1040 65, 1100 115, 1152 85"
        fill="none" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" />

  <!-- Milestone Marker 1: Peak Sprint -->
  <g transform="translate(740, 110)">
    <circle cx="0" cy="0" r="4" fill="#0D1117" stroke="#D97757" stroke-width="2" />
    <line x1="0" y1="-4" x2="0" y2="-24" stroke="#30363D" stroke-width="1" />
    <rect x="-65" y="-42" width="130" height="18" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text class="mono-meta" x="0" y="-30" font-size="8" fill="#F0F6FC" text-anchor="middle" font-weight="600">Q3 · PEAK VELOCITY</text>
  </g>

  <!-- Milestone Marker 2: Production Delivery -->
  <g transform="translate(1040, 72)">
    <circle cx="0" cy="0" r="4" fill="#0D1117" stroke="#D97757" stroke-width="2" />
    <line x1="0" y1="-4" x2="0" y2="-24" stroke="#30363D" stroke-width="1" />
    <rect x="-70" y="-42" width="140" height="18" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text class="mono-meta" x="0" y="-30" font-size="8" fill="#D97757" text-anchor="middle" font-weight="600">PROD RELEASE v2.6</text>
  </g>

  <!-- X-Axis Timeline Month Labels -->
  <g class="mono-meta" font-size="9" fill="#6E7681" transform="translate(0, 246)">
    <text x="90" y="0">JAN</text>
    <text x="185" y="0">FEB</text>
    <text x="280" y="0">MAR</text>
    <text x="375" y="0">APR</text>
    <text x="470" y="0">MAY</text>
    <text x="565" y="0">JUN</text>
    <text x="660" y="0">JUL</text>
    <text x="755" y="0">AUG</text>
    <text x="850" y="0">SEP</text>
    <text x="945" y="0">OCT</text>
    <text x="1040" y="0">NOV</text>
    <text x="1130" y="0">DEC</text>
  </g>
</svg>
