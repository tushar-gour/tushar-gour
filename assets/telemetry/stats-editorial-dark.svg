<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <style>
      .m { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" rx="12" fill="#0C1018"/>
  <rect width="1200" height="200" rx="12" fill="none" stroke="#1C2632" stroke-width="1.2"/>

  <!-- Column dividers -->
  <line x1="300" y1="20" x2="300" y2="180" stroke="#192230" stroke-width="1.2"/>
  <line x1="600" y1="20" x2="600" y2="180" stroke="#192230" stroke-width="1.2"/>
  <line x1="900" y1="20" x2="900" y2="180" stroke="#192230" stroke-width="1.2"/>

  <!-- COL 1: TOTAL REPOSITORIES -->
  <text class="m" x="42" y="48" font-size="18" font-weight="700" fill="#5A6D80" letter-spacing="2">TOTAL REPOSITORIES</text>
  <text class="s" x="42" y="130" font-size="80" font-weight="900" fill="#C97B4B" letter-spacing="-2">93</text>
  <line x1="42" y1="145" x2="140" y2="145" stroke="#C97B4B" stroke-width="3.5" stroke-linecap="round"/>
  <text class="m" x="42" y="178" font-size="16" font-weight="600" fill="#455A6E" letter-spacing="1.5">PUBLIC + PRIVATE</text>

  <!-- COL 2: CONTRIBUTIONS -->
  <text class="m" x="342" y="48" font-size="18" font-weight="700" fill="#5A6D80" letter-spacing="2">CONTRIBUTIONS</text>
  <text class="s" x="342" y="130" font-size="80" font-weight="900" fill="#EDE8DF" letter-spacing="-2">2,367</text>
  <line x1="342" y1="145" x2="510" y2="145" stroke="#2E4255" stroke-width="3.5" stroke-linecap="round"/>
  <text class="m" x="342" y="178" font-size="16" font-weight="600" fill="#455A6E" letter-spacing="1.5">PAST 365 DAYS</text>

  <!-- COL 3: ACTIVE DAYS -->
  <text class="m" x="642" y="48" font-size="18" font-weight="700" fill="#5A6D80" letter-spacing="2">ACTIVE DAYS</text>
  <text class="s" x="642" y="130" font-size="80" font-weight="900" fill="#EDE8DF" letter-spacing="-2">232</text>
  <line x1="642" y1="145" x2="760" y2="145" stroke="#2E4255" stroke-width="3.5" stroke-linecap="round"/>
  <text class="m" x="642" y="178" font-size="16" font-weight="600" fill="#455A6E" letter-spacing="1.5">CONTRIBUTED DAYS</text>

  <!-- COL 4: PEAK RECORD -->
  <text class="m" x="942" y="48" font-size="18" font-weight="700" fill="#5A6D80" letter-spacing="2">PEAK WEEK</text>
  <text class="s" x="942" y="130" font-size="80" font-weight="900" fill="#EDE8DF" letter-spacing="-2">153</text>
  <line x1="942" y1="145" x2="1050" y2="145" stroke="#2E4255" stroke-width="3.5" stroke-linecap="round"/>
  <text class="m" x="942" y="178" font-size="16" font-weight="600" fill="#455A6E" letter-spacing="1.5">SINGLE WEEK RECORD</text>
</svg>