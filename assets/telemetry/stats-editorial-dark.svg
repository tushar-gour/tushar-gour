<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <style>
      .num-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .lbl-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .desc-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="240" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Subtle Alternating Vertical Column Backgrounds (1% Opacity) -->
  <rect x="300" y="0" width="300" height="240" fill="#FFFFFF" opacity="0.012" />
  <rect x="900" y="0" width="300" height="240" rx="0 12 12 0" fill="#FFFFFF" opacity="0.012" />

  <!-- Vertical Hairline Column Dividers -->
  <line x1="300" y1="24" x2="300" y2="216" stroke="#28313A" stroke-width="1" />
  <line x1="600" y1="24" x2="600" y2="216" stroke="#28313A" stroke-width="1" />
  <line x1="900" y1="24" x2="900" y2="216" stroke="#28313A" stroke-width="1" />

  <!-- Col 1: Repositories (Terracotta Focal Metric) -->
  <g transform="translate(48, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="18" fill="#7B858F">TOTAL REPOSITORIES</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#F0EEE8">48<tspan font-size="36" fill="#C96A4B">+</tspan></text>
    
    <!-- Micro Graphic: Stacked Public / Private Indicator Line -->
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#28313A" />
      <rect width="95" height="4" rx="2" fill="#C96A4B" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="18" fill="#5F6974">PUBLIC + PRIVATE</text>
  </g>

  <!-- Col 2: Contributions (Off-White & Steel) -->
  <g transform="translate(348, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="18" fill="#7B858F">CONTRIBUTIONS</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#F0EEE8">2,450<tspan font-size="36" fill="#7B858F">+</tspan></text>
    
    <!-- Micro Graphic: Relative 12-Month Mini Line -->
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#28313A" />
      <rect width="125" height="4" rx="2" fill="#7B858F" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="18" fill="#5F6974">PAST 365 DAYS</text>
  </g>

  <!-- Col 3: Pull Requests (Off-White & Steel) -->
  <g transform="translate(648, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="18" fill="#7B858F">PULL REQUESTS</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#F0EEE8">140<tspan font-size="36" fill="#7B858F">+</tspan></text>
    
    <!-- Micro Graphic: Thin Tick Sequence Indicator -->
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#28313A" />
      <rect width="105" height="4" rx="2" fill="#7B858F" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="18" fill="#5F6974">MERGED &amp; REVIEWED</text>
  </g>

  <!-- Col 4: Active Cadence (Off-White & Steel) -->
  <g transform="translate(948, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="18" fill="#7B858F">ACTIVE CADENCE</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#F0EEE8">300<tspan font-size="36" fill="#7B858F">D+</tspan></text>
    
    <!-- Micro Graphic: Thin Occupancy Line -->
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#28313A" />
      <rect width="118" height="4" rx="2" fill="#7B858F" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="18" fill="#5F6974">ANNUAL ACTIVITY FLOW</text>
  </g>
</svg>
