<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 172" width="100%" height="100%">
  <defs>
    <style>
      .m { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="172" rx="10" fill="#FFFFFF"/>
  <rect width="1200" height="172" rx="10" fill="none" stroke="#D0D7DE" stroke-width="1.2"/>

  <line x1="300" y1="16" x2="300" y2="156" stroke="#D8DDE3" stroke-width="1"/>
  <line x1="600" y1="16" x2="600" y2="156" stroke="#D8DDE3" stroke-width="1"/>
  <line x1="900" y1="16" x2="900" y2="156" stroke="#D8DDE3" stroke-width="1"/>

  <!-- COL 1 -->
  <text class="m" x="42" y="44" font-size="11" font-weight="600" fill="#8A9299" letter-spacing="2">TOTAL REPOSITORIES</text>
  <text class="s" x="42" y="114" font-size="70" font-weight="900" fill="#B85C3F" letter-spacing="-2">91</text>
  <line x1="42" y1="126" x2="120" y2="126" stroke="#B85C3F" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="42" y="153" font-size="11" font-weight="600" fill="#6A7A88" letter-spacing="2">PUBLIC + PRIVATE</text>

  <!-- COL 2 -->
  <text class="m" x="342" y="44" font-size="11" font-weight="600" fill="#8A9299" letter-spacing="2">CONTRIBUTIONS</text>
  <text class="s" x="342" y="114" font-size="70" font-weight="900" fill="#1F2328" letter-spacing="-2">2,450</text>
  <line x1="342" y1="126" x2="476" y2="126" stroke="#D0D7DE" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="342" y="153" font-size="11" font-weight="600" fill="#6A7A88" letter-spacing="2">PAST 365 DAYS</text>

  <!-- COL 3 -->
  <text class="m" x="642" y="44" font-size="11" font-weight="600" fill="#8A9299" letter-spacing="2">PULL REQUESTS</text>
  <text class="s" x="642" y="114" font-size="70" font-weight="900" fill="#1F2328" letter-spacing="-2">140</text>
  <line x1="642" y1="126" x2="738" y2="126" stroke="#D0D7DE" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="642" y="153" font-size="11" font-weight="600" fill="#6A7A88" letter-spacing="2">MERGED &amp; DELIVERED</text>

  <!-- COL 4 -->
  <text class="m" x="942" y="44" font-size="11" font-weight="600" fill="#8A9299" letter-spacing="2">ACTIVE DAYS</text>
  <text class="s" x="942" y="114" font-size="70" font-weight="900" fill="#1F2328" letter-spacing="-2">300</text>
  <line x1="942" y1="126" x2="1036" y2="126" stroke="#D0D7DE" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="942" y="153" font-size="11" font-weight="600" fill="#6A7A88" letter-spacing="2">PAST 365 DAYS</text>
</svg>
