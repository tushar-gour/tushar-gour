<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <style>
      .num-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .lbl-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .desc-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Outer Container -->
  <rect width="1200" height="240" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />

  <!-- Subtle Alternating Vertical Column Backgrounds -->
  <rect x="300" y="0" width="300" height="240" fill="#000000" opacity="0.015" />
  <rect x="900" y="0" width="300" height="240" rx="0 12 12 0" fill="#000000" opacity="0.015" />

  <!-- Vertical Hairline Column Dividers -->
  <line x1="300" y1="24" x2="300" y2="216" stroke="#D0D7DE" stroke-width="1" />
  <line x1="600" y1="24" x2="600" y2="216" stroke="#D0D7DE" stroke-width="1" />
  <line x1="900" y1="24" x2="900" y2="216" stroke="#D0D7DE" stroke-width="1" />

  <!-- Col 1: Repositories -->
  <g transform="translate(48, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="16" fill="#59636E">TOTAL REPOSITORIES</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#B85C3F">47</text>
    
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#E1E4E8" />
      <rect width="140" height="4" rx="2" fill="#B85C3F" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="16" fill="#8C959F">PUBLIC REPOSITORIES</text>
  </g>

  <!-- Col 2: Contributions -->
  <g transform="translate(348, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="16" fill="#59636E">CONTRIBUTIONS</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#1F2328">2,450</text>
    
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#E1E4E8" />
      <rect width="125" height="4" rx="2" fill="#59636E" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="16" fill="#8C959F">PAST 365 DAYS</text>
  </g>

  <!-- Col 3: Pull Requests -->
  <g transform="translate(648, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="16" fill="#59636E">PULL REQUESTS</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#1F2328">140</text>
    
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#E1E4E8" />
      <rect width="105" height="4" rx="2" fill="#59636E" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="16" fill="#8C959F">MERGED &amp; DELIVERED</text>
  </g>

  <!-- Col 4: Active Days -->
  <g transform="translate(948, 52)">
    <text class="lbl-meta" x="0" y="0" font-size="16" fill="#59636E">ACTIVE DAYS</text>
    <text class="num-val" x="0" y="62" font-size="64" fill="#1F2328">300</text>
    
    <g transform="translate(0, 84)">
      <rect width="140" height="4" rx="2" fill="#E1E4E8" />
      <rect width="118" height="4" rx="2" fill="#59636E" />
    </g>
    
    <text class="desc-txt" x="0" y="118" font-size="16" fill="#8C959F">PAST 365 DAYS</text>
  </g>
</svg>
