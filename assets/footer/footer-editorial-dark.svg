<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <style>
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Top Multi-Tone Divider Line (Terracotta Accent Start + Steel Rest) -->
  <line x1="48" y1="20" x2="110" y2="20" stroke="#C96A4B" stroke-width="2" />
  <line x1="110" y1="20" x2="1152" y2="20" stroke="#28313A" stroke-width="1" />

  <!-- Left: Identity Attribution -->
  <g transform="translate(48, 65)">
    <text class="sans-bold" x="0" y="0" font-size="22" fill="#F0EEE8">TUSHAR GOUR</text>
    <text class="mono-meta" x="0" y="24" font-size="16" fill="#7B858F">SOFTWARE ENGINEER</text>
  </g>

  <!-- Center: Engineering Philosophy Statement -->
  <g transform="translate(600, 75)">
    <text class="mono-meta" x="0" y="0" font-size="16" fill="#5F6974" text-anchor="middle">
      2026 // SYSTEMS &amp; PRODUCTION DELIVERY
    </text>
  </g>

  <!-- Right: Fifth Mark Signature Identity Motif -->
  <g transform="translate(1088, 55)" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#28313A" />
    <line x1="14" y1="0" x2="14" y2="18" stroke="#28313A" />
    <line x1="28" y1="0" x2="28" y2="18" stroke="#28313A" />
    <line x1="42" y1="0" x2="42" y2="18" stroke="#28313A" />
    <line x1="56" y1="0" x2="56" y2="18" stroke="#C96A4B" />
  </g>
</svg>
