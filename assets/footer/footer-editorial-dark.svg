<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="100%">
  <defs>
    <style>
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="90" fill="#0D1117" />
  <line x1="48" y1="15" x2="1152" y2="15" stroke="#21262D" stroke-width="1" />

  <!-- Left: Identity -->
  <g transform="translate(48, 52)">
    <text class="mono-meta" x="0" y="0" font-size="11" fill="#8B949E" font-weight="600" letter-spacing="1">
      TUSHAR GOUR &nbsp;·&nbsp; SOFTWARE ENGINEER &nbsp;·&nbsp; INDORE, INDIA
    </text>
  </g>

  <!-- Center: Register Stamp -->
  <g transform="translate(680, 52)">
    <text class="mono-meta" x="0" y="0" font-size="11" fill="#6E7681" letter-spacing="1">
      2026 &nbsp;·&nbsp; EVIDENCE OVER ADJECTIVES
    </text>
  </g>

  <!-- Right: Fifth Mark Motif -->
  <g transform="translate(1088, 42)" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="12" stroke="#484F58" />
    <line x1="12" y1="0" x2="12" y2="12" stroke="#484F58" />
    <line x1="24" y1="0" x2="24" y2="12" stroke="#484F58" />
    <line x1="36" y1="0" x2="36" y2="12" stroke="#484F58" />
    <line x1="48" y1="0" x2="48" y2="12" stroke="#D97757" />
  </g>
</svg>
