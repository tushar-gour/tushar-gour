        <path d="M 13 17 H 16 V 26 H 13 Z M 14.5 13 A 1.5 1.5 0 1 1 14.5 16 A 1.5 1.5 0 1 1 14.5 13 Z M 18 17 H 21 V 18.5 C 21.5 17.5 22.8 16.8 24 16.8 C 26.5 16.8 27 18.2 27 20.5 V 26 H 24 V 21 C 24 19.8 23.5 19 22.5 19 C 21.5 19 21 19.8 21 21 V 26 H 18 Z" fill="#F0EEE8" />
