<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <style>
      .sans-display {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .sans-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .sans-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Top Multi-Tone Divider Line -->
  <line x1="48" y1="20" x2="110" y2="20" stroke="#C96A4B" stroke-width="2" />
  <line x1="110" y1="20" x2="1152" y2="20" stroke="#28313A" stroke-width="1" />

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect x="0" y="32" width="1200" height="188" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- LEFT SIDE: Matching TG Monogram & Identity -->
  <g transform="translate(48, 64)">
    <!-- Geometric TG Monogram -->
    <g transform="translate(0, 10)">
      <rect width="54" height="54" rx="8" fill="#111820" stroke="#28313A" stroke-width="1.2" />
      <line x1="14" y1="18" x2="40" y2="18" stroke="#F0EEE8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="27" y1="18" x2="27" y2="38" stroke="#F0EEE8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 38 27 A 11 11 0 1 0 38 38 H 30" fill="none" stroke="#7B858F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="38" cy="38" r="2" fill="#C96A4B" />
    </g>

    <g transform="translate(74, 0)">
      <text class="sans-display" x="0" y="36" font-size="34" fill="#F0EEE8">TUSHAR GOUR</text>
      <text class="sans-sub" x="2" y="60" font-size="14" fill="#C96A4B">SOFTWARE ENGINEER</text>
      <text class="sans-desc" x="2" y="86" font-size="15" fill="#7B858F">ENGINEERING SYSTEMS FROM PRODUCT TO PRODUCTION</text>
    </g>
  </g>

  <!-- CENTER: Three-Part Architectural Signature -->
  <g transform="translate(680, 115)">
    <text class="mono-meta" x="0" y="0" font-size="14" fill="#5F6974" text-anchor="middle">
      ARCHITECTURE &nbsp;·&nbsp; ENGINEERING &nbsp;·&nbsp; DELIVERY
    </text>
  </g>

