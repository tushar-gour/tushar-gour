<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <style>
      .num-hdr {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .stance-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stance-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        line-height: 1.35;
      }
    </style>
  </defs>

  <!-- Base Frame -->
  <rect width="1200" height="160" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" />

  <!-- Vertical Hairline Column Dividers -->
  <line x1="240" y1="20" x2="240" y2="140" stroke="#E1E4E8" stroke-width="1" />
  <line x1="480" y1="20" x2="480" y2="140" stroke="#E1E4E8" stroke-width="1" />
  <line x1="720" y1="20" x2="720" y2="140" stroke="#E1E4E8" stroke-width="1" />
  <line x1="960" y1="20" x2="960" y2="140" stroke="#E1E4E8" stroke-width="1" />

  <!-- Stance 01: Boundaries -->
  <g transform="translate(32, 34)">
    <text class="num-hdr" x="0" y="0" font-size="12" fill="#C86446">01</text>
    <text class="stance-title" x="0" y="24" font-size="12" fill="#1F2328">BOUNDARIES</text>
    <text class="stance-desc" x="0" y="46" font-size="11" fill="#656D76">Explicit ownership &amp;</text>
    <text class="stance-desc" x="0" y="62" font-size="11" fill="#656D76">strictly typed contracts.</text>
  </g>

  <!-- Stance 02: Failure -->
  <g transform="translate(272, 34)">
    <text class="num-hdr" x="0" y="0" font-size="12" fill="#656D76">02</text>
    <text class="stance-title" x="0" y="24" font-size="12" fill="#1F2328">FAILURE</text>
    <text class="stance-desc" x="0" y="46" font-size="11" fill="#656D76">Recovery is intentional</text>
    <text class="stance-desc" x="0" y="62" font-size="11" fill="#656D76">product UX behavior.</text>
  </g>

  <!-- Stance 03: Predictability -->
  <g transform="translate(512, 34)">
    <text class="num-hdr" x="0" y="0" font-size="12" fill="#656D76">03</text>
    <text class="stance-title" x="0" y="24" font-size="12" fill="#1F2328">PREDICTABILITY</text>
    <text class="stance-desc" x="0" y="46" font-size="11" fill="#656D76">Understandable systems</text>
    <text class="stance-desc" x="0" y="62" font-size="11" fill="#656D76">over clever monoliths.</text>
  </g>

  <!-- Stance 04: Maintainability -->
  <g transform="translate(752, 34)">
    <text class="num-hdr" x="0" y="0" font-size="12" fill="#656D76">04</text>
    <text class="stance-title" x="0" y="24" font-size="12" fill="#1F2328">MAINTAINABILITY</text>
    <text class="stance-desc" x="0" y="46" font-size="11" fill="#656D76">Optimize code for the</text>
    <text class="stance-desc" x="0" y="62" font-size="11" fill="#656D76">next engineer's change.</text>
  </g>

  <!-- Stance 05: Applied AI -->
  <g transform="translate(992, 34)">
    <text class="num-hdr" x="0" y="0" font-size="12" fill="#656D76">05</text>
    <text class="stance-title" x="0" y="24" font-size="12" fill="#1F2328">APPLIED AI</text>
    <text class="stance-desc" x="0" y="46" font-size="11" fill="#656D76">Bounded dependencies</text>
    <text class="stance-desc" x="0" y="62" font-size="11" fill="#656D76">with latency budgets.</text>
  </g>
</svg>
