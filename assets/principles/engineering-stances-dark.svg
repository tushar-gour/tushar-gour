<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <style>
      .mono-num {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .stance-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stance-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
        line-height: 1.4;
      }
      .ghost-num {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- Base Outer Container (60% Graphite Base) -->
  <rect width="1200" height="240" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Ghost Large Numerals Behind Columns (2.5% Opacity Depth) -->
  <g class="ghost-num" font-size="96" fill="#F0EEE8" opacity="0.025">
    <text x="65" y="160">01</text>
    <text x="305" y="160">02</text>
    <text x="545" y="160">03</text>
    <text x="785" y="160">04</text>
    <text x="1025" y="160">05</text>
  </g>

  <!-- Vertical Hairline Column Dividers -->
  <line x1="240" y1="24" x2="240" y2="216" stroke="#28313A" stroke-width="1" />
  <line x1="480" y1="24" x2="480" y2="216" stroke="#28313A" stroke-width="1" />
  <line x1="720" y1="24" x2="720" y2="216" stroke="#28313A" stroke-width="1" />
  <line x1="960" y1="24" x2="960" y2="216" stroke="#28313A" stroke-width="1" />

  <!-- Principle 01: Explicit Boundaries -->
  <g transform="translate(36, 52)">
    <text class="mono-num" x="0" y="0" font-size="18" fill="#C96A4B">01</text>
    <text class="stance-title" x="0" y="32" font-size="20" fill="#F0EEE8">EXPLICIT BOUNDARIES</text>
    <text class="stance-desc" x="0" y="66" font-size="16" fill="#7B858F">Ownership, schemas</text>
    <text class="stance-desc" x="0" y="90" font-size="16" fill="#7B858F">&amp; contracts stay visible.</text>
  </g>

  <!-- Principle 02: Designed Failure -->
  <g transform="translate(276, 52)">
    <text class="mono-num" x="0" y="0" font-size="18" fill="#7B858F">02</text>
    <text class="stance-title" x="0" y="32" font-size="20" fill="#F0EEE8">DESIGNED FAILURE</text>
    <text class="stance-desc" x="0" y="66" font-size="16" fill="#7B858F">Retries &amp; recovery are</text>
    <text class="stance-desc" x="0" y="90" font-size="16" fill="#7B858F">part of system behavior.</text>
  </g>

  <!-- Principle 03: Predictable Systems -->
  <g transform="translate(516, 52)">
    <text class="mono-num" x="0" y="0" font-size="18" fill="#7B858F">03</text>
    <text class="stance-title" x="0" y="32" font-size="20" fill="#F0EEE8">PREDICTABLE SYSTEMS</text>
    <text class="stance-desc" x="0" y="66" font-size="16" fill="#7B858F">Prefer understandable</text>
    <text class="stance-desc" x="0" y="90" font-size="16" fill="#7B858F">flow over clever tricks.</text>
  </g>

  <!-- Principle 04: Changeability -->
  <g transform="translate(756, 52)">
    <text class="mono-num" x="0" y="0" font-size="18" fill="#7B858F">04</text>
    <text class="stance-title" x="0" y="32" font-size="20" fill="#F0EEE8">CHANGEABILITY</text>
    <text class="stance-desc" x="0" y="66" font-size="16" fill="#7B858F">Structure software to</text>
    <text class="stance-desc" x="0" y="90" font-size="16" fill="#7B858F">ease the next change.</text>
  </g>

  <!-- Principle 05: Bounded Intelligence -->
  <g transform="translate(996, 52)">
    <text class="mono-num" x="0" y="0" font-size="18" fill="#7B858F">05</text>
    <text class="stance-title" x="0" y="32" font-size="20" fill="#F0EEE8">BOUNDED AI</text>
    <text class="stance-desc" x="0" y="66" font-size="16" fill="#7B858F">Engineered dependencies</text>
    <text class="stance-desc" x="0" y="90" font-size="16" fill="#7B858F">with latency budgets.</text>
  </g>
</svg>
