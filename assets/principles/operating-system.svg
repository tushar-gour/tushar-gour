<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="principleCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1522" />
      <stop offset="100%" stop-color="#080C12" />
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes busPulse {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .bus-anim {
        stroke-dasharray: 6 6;
        animation: busPulse 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="260" rx="14" fill="#080C12" stroke="#1B2535" stroke-width="1.5" />

  <!-- Technical Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#FF5722" letter-spacing="1.5">● ENGINEERING OPERATING SYSTEM // ACT V</text>
    <text x="320" y="32" letter-spacing="1">SYSTEMS HEURISTICS &amp; CORE ARCHITECTURAL STANCES</text>
    <text x="1168" y="32" text-anchor="end" letter-spacing="1">PHILOSOPHY PROVEN BY CODE</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1B2535" stroke-width="1" />

  <!-- Circuit Connecting Bus Line -->
  <path class="bus-anim" d="M 140 145 H 1060" stroke="#FF5722" stroke-width="2" stroke-opacity="0.4" />

  <!-- 5 Nodes Grid -->
  <!-- Node 1: Boundaries -->
  <g transform="translate(32, 65)">
    <rect width="215" height="165" rx="8" fill="url(#principleCardBg)" stroke="#223044" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#FF5722" filter="url(#pGlow)" />
    <text class="mono" x="32" y="28" font-size="11" fill="#FF5722" font-weight="700">01 / BOUNDARIES</text>
    <text class="sans" x="20" y="58" font-size="13" fill="#F1EEE7" font-weight="600">Make boundaries obvious</text>
    <text class="sans" x="20" y="80" font-size="11" fill="#8C9BAE">
      Ownership, contracts, and state transitions are explicitly typed — no ambient global state.
    </text>
  </g>

  <!-- Node 2: Recovery -->
  <g transform="translate(262, 65)">
    <rect width="215" height="165" rx="8" fill="url(#principleCardBg)" stroke="#223044" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#00E5FF" filter="url(#pGlow)" />
    <text class="mono" x="32" y="28" font-size="11" fill="#00E5FF" font-weight="700">02 / RECOVERY</text>
    <text class="sans" x="20" y="58" font-size="13" fill="#F1EEE7" font-weight="600">Failure paths are product</text>
    <text class="sans" x="20" y="80" font-size="11" fill="#8C9BAE">
      Retries, partial failures, and offline recovery deserve intentional UI design, not catch blocks.
    </text>
  </g>

  <!-- Node 3: Predictability -->
  <g transform="translate(492, 65)">
    <rect width="215" height="165" rx="8" fill="url(#principleCardBg)" stroke="#223044" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#00E676" filter="url(#pGlow)" />
    <text class="mono" x="32" y="28" font-size="11" fill="#00E676" font-weight="700">03 / PREDICTABILITY</text>
    <text class="sans" x="20" y="58" font-size="13" fill="#F1EEE7" font-weight="600">Predictable beats clever</text>
    <text class="sans" x="20" y="80" font-size="11" fill="#8C9BAE">
      The best abstraction is the one that reduces operational surprises when traffic spikes at 2 AM.
    </text>
  </g>

  <!-- Node 4: Refactorability -->
  <g transform="translate(722, 65)">
    <rect width="215" height="165" rx="8" fill="url(#principleCardBg)" stroke="#223044" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#FFB300" filter="url(#pGlow)" />
    <text class="mono" x="32" y="28" font-size="11" fill="#FFB300" font-weight="700">04 / MAINTAINABILITY</text>
    <text class="sans" x="20" y="58" font-size="13" fill="#F1EEE7" font-weight="600">Lower cognitive cost</text>
    <text class="sans" x="20" y="80" font-size="11" fill="#8C9BAE">
      Structure and naming should make the next engineering decision cheaper, not harder.
    </text>
  </g>

  <!-- Node 5: Applied AI -->
  <g transform="translate(952, 65)">
    <rect width="216" height="165" rx="8" fill="url(#principleCardBg)" stroke="#223044" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#FF8A65" filter="url(#pGlow)" />
    <text class="mono" x="32" y="28" font-size="11" fill="#FF8A65" font-weight="700">05 / APPLIED AI</text>
    <text class="sans" x="20" y="58" font-size="13" fill="#F1EEE7" font-weight="600">Engineered intelligence</text>
    <text class="sans" x="20" y="80" font-size="11" fill="#8C9BAE">
      LLMs and inference APIs are remote dependencies requiring strict schemas, fallbacks, and budgets.
    </text>
  </g>
</svg>
