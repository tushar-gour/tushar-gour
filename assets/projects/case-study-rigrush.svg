<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E141E" />
      <stop offset="60%" stop-color="#090D14" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>

    <linearGradient id="emberGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF8A65" />
    </linearGradient>

    <filter id="glowEmberProj" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarPing {
        0% { r: 3; opacity: 1; }
        100% { r: 9; opacity: 0; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 900; letter-spacing: -1px; }
      .ping-dot { animation: radarPing 2s infinite cubic-bezier(0, 0, 0.2, 1); }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="380" rx="14" fill="url(#cardBg1)" stroke="#1F2C3F" stroke-width="1.5" />

  <!-- Top Metadata Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#FF5722" letter-spacing="1.5">PROJECT // 01</text>
    
    <!-- Live Badge -->
    <rect x="150" y="18" width="170" height="22" rx="11" fill="#14211A" stroke="#00E676" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="164" cy="29" r="3.5" fill="#00E676" />
    <circle class="ping-dot" cx="164" cy="29" r="3.5" fill="none" stroke="#00E676" stroke-width="1.5" />
    <text x="176" y="33" fill="#69F0AE" font-weight="700" font-size="10" letter-spacing="1">LIVE IN PRODUCTION</text>

    <text x="1168" y="32" text-anchor="end" letter-spacing="1">SYSTEM ROLE // LEAD PRODUCT &amp; FULL-STACK ENGINEER</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#1F2C3F" stroke-width="1" />

  <!-- Left Side: Interactive UI & Device Schematic Frame -->
  <g transform="translate(32, 65)">
    <!-- Device Frame -->
    <rect width="320" height="280" rx="12" fill="#0A0E17" stroke="#FF5722" stroke-opacity="0.4" stroke-width="1.2" />
    
    <!-- Internal App Mockup Screen -->
    <rect x="16" y="16" width="288" height="248" rx="8" fill="#111722" stroke="#1F2B3E" stroke-width="1" />
    
    <!-- App Header Simulation -->
    <rect x="16" y="16" width="288" height="42" rx="8" fill="#162030" />
    <circle cx="36" cy="37" r="5" fill="#FF5722" filter="url(#glowEmberProj)" />
    <text class="title" x="50" y="42" font-size="14" fill="#F1EEE7">RIGRUSH</text>
    <rect x="234" y="27" width="56" height="20" rx="4" fill="#1E2C42" />
    <text class="mono" x="262" y="40" font-size="9" fill="#00E5FF" text-anchor="middle" font-weight="700">ONLINE</text>

    <!-- Visual Dashboard Elements inside Mockup -->
    <!-- Metric Box 1 -->
    <g transform="translate(28, 70)">
      <rect width="124" height="60" rx="6" fill="#141C28" stroke="#223147" stroke-width="1" />
      <text class="mono" x="10" y="20" font-size="8" fill="#8C9BAE">SYNC LATENCY</text>
      <text class="mono" x="10" y="46" font-size="20" fill="#00E676" font-weight="800">&lt; 38ms</text>
    </g>
    <!-- Metric Box 2 -->
    <g transform="translate(164, 70)">
      <rect width="124" height="60" rx="6" fill="#141C28" stroke="#223147" stroke-width="1" />
      <text class="mono" x="10" y="20" font-size="8" fill="#8C9BAE">CLIENT STATE</text>
      <text class="mono" x="10" y="46" font-size="18" fill="#FF5722" font-weight="800">OPTIMISTIC</text>
    </g>

    <!-- Simulated Realtime Waveform in App -->
    <g transform="translate(28, 142)">
      <rect width="260" height="68" rx="6" fill="#0D131D" stroke="#1A2536" stroke-width="1" />
      <text class="mono" x="10" y="16" font-size="8" fill="#7E8B9B">REALTIME DATA STREAM</text>
      <path d="M 10 48 Q 40 25, 70 45 T 130 30 T 190 52 T 250 35" fill="none" stroke="#FF5722" stroke-width="2" />
      <circle cx="250" cy="35" r="3" fill="#FF5722" filter="url(#glowEmberProj)" />
    </g>

    <!-- Bottom Status in Mockup -->
    <g transform="translate(28, 222)">
      <text class="mono" x="0" y="14" font-size="9" fill="#8C9BAE">ENGINE: <tspan fill="#F1EEE7">FLUTTER + NODE.JS CLUSTER</tspan></text>
    </g>
  </g>

  <!-- Right Side: Architecture & Engineering Signals -->
  <g transform="translate(385, 65)">
    <text class="title" x="0" y="28" font-size="28" fill="url(#emberGlowGrad)">RIGRUSH</text>
    <text class="sans" x="0" y="52" font-size="14" fill="#A0AEC0">
      Production cross-platform application designed for real-time multiplayer coordination and zero-latency state sync.
    </text>

    <!-- 4 Key Engineering Signals -->
    <g transform="translate(0, 72)">
      <!-- Signal 1 -->
      <g transform="translate(0, 0)">
        <rect width="365" height="54" rx="6" fill="#0F1622" stroke="#1C283B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FF5722" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Sub-50ms Optimistic UI Sync</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Client-side instant prediction with server reconciliation</text>
      </g>

      <!-- Signal 2 -->
      <g transform="translate(390, 0)">
        <rect width="390" height="54" rx="6" fill="#0F1622" stroke="#1C283B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E5FF" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Real-Time Redis Pub/Sub Mesh</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Horizontal WebSocket cluster handling concurrent live rooms</text>
      </g>

      <!-- Signal 3 -->
      <g transform="translate(0, 64)">
        <rect width="365" height="54" rx="6" fill="#0F1622" stroke="#1C283B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E676" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Local-First Storage &amp; SQLite</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Resilient offline queue auto-syncs on reconnection</text>
      </g>

      <!-- Signal 4 -->
      <g transform="translate(390, 64)">
        <rect width="390" height="54" rx="6" fill="#0F1622" stroke="#1C283B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FFB300" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">99.9% Production Stability</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Defended SLAs with automated error boundaries &amp; telemetry</text>
      </g>
    </g>

    <!-- Technology Stack Tags -->
    <g transform="translate(0, 215)">
      <text class="mono" x="0" y="16" font-size="10" fill="#7E8B9B" font-weight="700">STACK:</text>
      
      <!-- Tech badges -->
      <g transform="translate(55, 0)" class="mono" font-size="10" fill="#F1EEE7">
        <rect x="0" y="0" width="70" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="35" y="16" text-anchor="middle">Flutter</text>

        <rect x="80" y="0" width="55" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="107" y="16" text-anchor="middle">Dart</text>

        <rect x="145" y="0" width="70" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="180" y="16" text-anchor="middle">Node.js</text>

        <rect x="225" y="0" width="80" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="265" y="16" text-anchor="middle">Socket.IO</text>

        <rect x="315" y="0" width="60" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="345" y="16" text-anchor="middle">Redis</text>

        <rect x="385" y="0" width="90" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="430" y="16" text-anchor="middle">PostgreSQL</text>

        <rect x="485" y="0" width="70" height="24" rx="4" fill="#162030" stroke="#25354C" stroke-width="1" />
        <text x="520" y="16" text-anchor="middle">AWS S3</text>
      </g>
    </g>
  </g>
</svg>
