<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1813" />
      <stop offset="60%" stop-color="#07100D" />
      <stop offset="100%" stop-color="#050A08" />
    </linearGradient>

    <linearGradient id="greenGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <filter id="glowGreenProj" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes chunkAnim {
        0% { transform: scaleX(0.2); opacity: 0.3; }
        50% { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(0.2); opacity: 0.3; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 900; letter-spacing: -1px; }
      .chunk-bar { animation: chunkAnim 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="380" rx="14" fill="url(#cardBg3)" stroke="#163828" stroke-width="1.5" />

  <!-- Top Metadata Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#00E676" letter-spacing="1.5">PROJECT // 03</text>
    
    <!-- Distributed Backend Badge -->
    <rect x="150" y="18" width="186" height="22" rx="11" fill="#0D261A" stroke="#00E676" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="164" cy="29" r="3.5" fill="#00E676" />
    <text x="176" y="33" fill="#69F0AE" font-weight="700" font-size="10" letter-spacing="1">DISTRIBUTED BACKEND</text>

    <text x="1168" y="32" text-anchor="end" letter-spacing="1">SYSTEM ROLE // BACKEND &amp; STREAMING INFRASTRUCTURE</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#163828" stroke-width="1" />

  <!-- Left Side: Ingestion & Transcoding Pipeline Diagram -->
  <g transform="translate(32, 65)">
    <!-- Diagram Canvas Box -->
    <rect width="320" height="280" rx="12" fill="#060E0B" stroke="#00E676" stroke-opacity="0.4" stroke-width="1.2" />
    
    <text class="mono" x="16" y="26" font-size="10" fill="#8C9BAE" font-weight="700">INGESTION &amp; HLS CHUNKING PIPELINE</text>

    <!-- Step 1: Upload Ingestion -->
    <g transform="translate(16, 42)">
      <rect width="288" height="46" rx="6" fill="#0F2018" stroke="#1C382C" stroke-width="1" />
      <circle cx="16" cy="23" r="4" fill="#00E676" />
      <text class="mono" x="28" y="21" font-size="10" fill="#F1EEE7" font-weight="700">01 / PRESIGNED S3 UPLOAD</text>
      <text class="sans" x="28" y="36" font-size="9" fill="#7E8B9B">Direct multipart browser-to-bucket ingestion</text>
    </g>

    <!-- Step 2: Queue & Transcoding -->
    <g transform="translate(16, 98)">
      <rect width="288" height="60" rx="6" fill="#12261D" stroke="#00E676" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="16" cy="23" r="4" fill="#FFB300" />
      <text class="mono" x="28" y="21" font-size="10" fill="#F1EEE7" font-weight="700">02 / BULLMQ &amp; FFMPEG WORKERS</text>
      <text class="sans" x="28" y="36" font-size="9" fill="#7E8B9B">Multi-bitrate segmenting (1080p, 720p, 480p)</text>
      <!-- Simulated animated progress chunks -->
      <g transform="translate(28, 44)">
        <rect width="40" height="6" rx="2" fill="#00E676" class="chunk-bar" />
        <rect x="46" width="40" height="6" rx="2" fill="#00E676" opacity="0.8" />
        <rect x="92" width="40" height="6" rx="2" fill="#00E676" opacity="0.6" />
        <rect x="138" width="40" height="6" rx="2" fill="#00E676" opacity="0.4" />
        <text class="mono" x="190" y="6" font-size="8" fill="#69F0AE">4s HLS TS</text>
      </g>
    </g>

    <!-- Step 3: Edge CDN Distribution -->
    <g transform="translate(16, 168)">
      <rect width="288" height="46" rx="6" fill="#0F2018" stroke="#1C382C" stroke-width="1" />
      <circle cx="16" cy="23" r="4" fill="#00E5FF" />
      <text class="mono" x="28" y="21" font-size="10" fill="#F1EEE7" font-weight="700">03 / CLOUDFRONT EDGE CACHE</text>
      <text class="sans" x="28" y="36" font-size="9" fill="#7E8B9B">Global multi-region low-latency delivery</text>
    </g>

    <!-- Performance Ribbon -->
    <g transform="translate(16, 224)">
      <rect width="288" height="38" rx="6" fill="#09140F" stroke="#162E23" stroke-width="1" />
      <text class="mono" x="12" y="16" font-size="8" fill="#8C9BAE">P99 LATENCY: <tspan fill="#69F0AE" font-weight="700">&lt; 120ms</tspan></text>
      <text class="mono" x="12" y="28" font-size="8" fill="#8C9BAE">CACHE HIT RATIO: <tspan fill="#00E5FF" font-weight="700">97.8%</tspan></text>
      <text class="mono" x="170" y="22" font-size="8" fill="#FFB300">RATE LIMIT: 500 REQ/M</text>
    </g>
  </g>

  <!-- Right Side: Architecture & Engineering Signals -->
  <g transform="translate(385, 65)">
    <text class="title" x="0" y="28" font-size="28" fill="url(#greenGlowGrad)">STREAMLY</text>
    <text class="sans" x="0" y="52" font-size="14" fill="#A0AEC0">
      High-throughput distributed media processing engine with asynchronous video chunking and edge delivery.
    </text>

    <!-- 4 Key Architectural Signals -->
    <g transform="translate(0, 72)">
      <!-- Signal 1 -->
      <g transform="translate(0, 0)">
        <rect width="365" height="54" rx="6" fill="#0D1C15" stroke="#1A3A2B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E676" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Decoupled Presigned Uploads</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Bypasses app server bottleneck via direct AWS S3 ingestion</text>
      </g>

      <!-- Signal 2 -->
      <g transform="translate(390, 0)">
        <rect width="390" height="54" rx="6" fill="#0D1C15" stroke="#1A3A2B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E5FF" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Distributed Transcoder Queue</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">BullMQ + Redis job workers handle parallel FFmpeg transcoding</text>
      </g>

      <!-- Signal 3 -->
      <g transform="translate(0, 64)">
        <rect width="365" height="54" rx="6" fill="#0D1C15" stroke="#1A3A2B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FF5722" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Indexed PostgreSQL &amp; Prisma</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Partitioned tables optimized for high-volume playlist queries</text>
      </g>

      <!-- Signal 4 -->
      <g transform="translate(390, 64)">
        <rect width="390" height="54" rx="6" fill="#0D1C15" stroke="#1A3A2B" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FFB300" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Structured Telemetry &amp; Logs</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Token-bucket rate limiting and real-time error tracing</text>
      </g>
    </g>

    <!-- Technology Stack Tags -->
    <g transform="translate(0, 215)">
      <text class="mono" x="0" y="16" font-size="10" fill="#7E8B9B" font-weight="700">STACK:</text>
      
      <!-- Tech badges -->
      <g transform="translate(55, 0)" class="mono" font-size="10" fill="#F1EEE7">
        <rect x="0" y="0" width="70" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="35" y="16" text-anchor="middle">Node.js</text>

        <rect x="80" y="0" width="70" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="115" y="16" text-anchor="middle">Express</text>

        <rect x="160" y="0" width="90" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="205" y="16" text-anchor="middle">PostgreSQL</text>

        <rect x="260" y="0" width="65" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="292" y="16" text-anchor="middle">Prisma</text>

        <rect x="335" y="0" width="60" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="365" y="16" text-anchor="middle">Redis</text>

        <rect x="405" y="0" width="70" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="440" y="16" text-anchor="middle">FFmpeg</text>

        <rect x="485" y="0" width="70" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="520" y="16" text-anchor="middle">AWS S3</text>

        <rect x="565" y="0" width="65" height="24" rx="4" fill="#11281E" stroke="#1D4734" stroke-width="1" />
        <text x="597" y="16" text-anchor="middle">Docker</text>
      </g>
    </g>
  </g>
</svg>
