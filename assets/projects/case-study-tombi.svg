<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A131E" />
      <stop offset="60%" stop-color="#080E17" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#80D8FF" />
    </linearGradient>

    <filter id="glowCyanProj" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes msgFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 900; letter-spacing: -1px; }
      .flow-dash {
        stroke-dasharray: 4 4;
        animation: msgFlow 1.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="380" rx="14" fill="url(#cardBg2)" stroke="#172C3E" stroke-width="1.5" />

  <!-- Top Metadata Header -->
  <g class="mono" font-size="11" fill="#7E8B9B">
    <text x="32" y="32" font-weight="700" fill="#00E5FF" letter-spacing="1.5">PROJECT // 02</text>
    
    <!-- Distributed Protocol Badge -->
    <rect x="150" y="18" width="186" height="22" rx="11" fill="#0E222A" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="164" cy="29" r="3.5" fill="#00E5FF" />
    <text x="176" y="33" fill="#80D8FF" font-weight="700" font-size="10" letter-spacing="1">DISTRIBUTED PROTOCOL</text>

    <text x="1168" y="32" text-anchor="end" letter-spacing="1">SYSTEM ROLE // DISTRIBUTED ARCHITECTURE &amp; PROTOCOL DESIGN</text>
  </g>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#172C3E" stroke-width="1" />

  <!-- Left Side: Interactive Protocol Topology & Packet Flow Diagram -->
  <g transform="translate(32, 65)">
    <!-- Diagram Canvas Box -->
    <rect width="320" height="280" rx="12" fill="#070C14" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.2" />
    
    <text class="mono" x="16" y="26" font-size="10" fill="#8C9BAE" font-weight="700">PACKET LIFECYCLE &amp; ROUTING</text>

    <!-- Node A: Device A (Origin) -->
    <g transform="translate(16, 42)">
      <rect width="84" height="60" rx="6" fill="#101A28" stroke="#1D2F47" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#00E5FF" />
      <text class="mono" x="22" y="17" font-size="9" fill="#F1EEE7" font-weight="700">DEVICE A</text>
      <text class="sans" x="8" y="36" font-size="8" fill="#7E8B9B">Local SQLite</text>
      <text class="mono" x="8" y="50" font-size="7" fill="#00E5FF">OWNER_STATE</text>
    </g>

    <!-- Center Node: Ephemeral Relay -->
    <g transform="translate(118, 42)">
      <rect width="84" height="60" rx="6" fill="#142436" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#FF5722" />
      <text class="mono" x="22" y="17" font-size="8" fill="#F1EEE7" font-weight="700">RELAY QUEUE</text>
      <text class="sans" x="8" y="36" font-size="8" fill="#7E8B9B">Redis Ephemeral</text>
      <text class="mono" x="8" y="50" font-size="7" fill="#FF5722">ZERO_STORAGE</text>
    </g>

    <!-- Node B: Device B (Destination) -->
    <g transform="translate(220, 42)">
      <rect width="84" height="60" rx="6" fill="#101A28" stroke="#1D2F47" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#00E5FF" />
      <text class="mono" x="22" y="17" font-size="9" fill="#F1EEE7" font-weight="700">DEVICE B</text>
      <text class="sans" x="8" y="36" font-size="8" fill="#7E8B9B">Local SQLite</text>
      <text class="mono" x="8" y="50" font-size="7" fill="#00E5FF">OWNER_STATE</text>
    </g>

    <!-- Flow paths between nodes -->
    <path class="flow-dash" d="M 100 72 H 118" stroke="#00E5FF" stroke-width="1.5" />
    <path class="flow-dash" d="M 202 72 H 220" stroke="#00E5FF" stroke-width="1.5" />

    <!-- Step Lifecycle Pipeline (Vertical in Box) -->
    <g transform="translate(16, 118)">
      <rect width="288" height="142" rx="6" fill="#0C1420" stroke="#18273A" stroke-width="1" />
      <text class="mono" x="12" y="20" font-size="9" fill="#A0AEC0" font-weight="700">STATE TRANSITION PIPELINE</text>

      <!-- 5 Lifecycle Steps -->
      <g transform="translate(12, 34)" class="mono" font-size="8">
        <!-- 1 -->
        <rect width="50" height="22" rx="3" fill="#142232" stroke="#22364E" stroke-width="1" />
        <text x="25" y="15" text-anchor="middle" fill="#F1EEE7">CREATED</text>
        <text x="56" y="15" fill="#00E5FF">→</text>

        <!-- 2 -->
        <g transform="translate(64, 0)">
          <rect width="50" height="22" rx="3" fill="#142232" stroke="#22364E" stroke-width="1" />
          <text x="25" y="15" text-anchor="middle" fill="#F1EEE7">QUEUED</text>
          <text x="56" y="15" fill="#00E5FF">→</text>
        </g>

        <!-- 3 -->
        <g transform="translate(128, 0)">
          <rect width="54" height="22" rx="3" fill="#142232" stroke="#22364E" stroke-width="1" />
          <text x="27" y="15" text-anchor="middle" fill="#00E5FF" font-weight="700">RELAYED</text>
          <text x="60" y="15" fill="#00E5FF">→</text>
        </g>

        <!-- 4 -->
        <g transform="translate(196, 0)">
          <rect width="68" height="22" rx="3" fill="#142232" stroke="#22364E" stroke-width="1" />
          <text x="34" y="15" text-anchor="middle" fill="#00E676" font-weight="700">ACK VERIFIED</text>
        </g>
      </g>

      <!-- Purge Confirmation Tag -->
      <g transform="translate(12, 70)">
        <rect width="264" height="54" rx="4" fill="#0A0F17" stroke="#1D2A3B" stroke-width="1" />
        <circle cx="14" cy="16" r="3" fill="#FF5722" />
        <text class="mono" x="24" y="19" font-size="8" fill="#F1EEE7" font-weight="700">EPHEMERAL PURGE POLICY</text>
        <text class="sans" x="10" y="34" font-size="8" fill="#7E8B9B">Zero permanent retention on server. Messages deleted</text>
        <text class="sans" x="10" y="46" font-size="8" fill="#7E8B9B">immediately upon receipt of monotonic cryptographic ACK.</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Architecture & Technical Signals -->
  <g transform="translate(385, 65)">
    <text class="title" x="0" y="28" font-size="28" fill="url(#cyanGlowGrad)">TOMBI</text>
    <text class="sans" x="0" y="52" font-size="14" fill="#A0AEC0">
      Experimental local-first distributed messaging system with zero permanent server-side database retention.
    </text>

    <!-- 4 Key Architectural Signals -->
    <g transform="translate(0, 72)">
      <!-- Signal 1 -->
      <g transform="translate(0, 0)">
        <rect width="365" height="54" rx="6" fill="#0C1522" stroke="#17283E" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E5FF" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Local-First Storage Topology</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Client devices own message histories via local embedded SQLite</text>
      </g>

      <!-- Signal 2 -->
      <g transform="translate(390, 0)">
        <rect width="390" height="54" rx="6" fill="#0C1522" stroke="#17283E" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#00E676" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Ephemeral In-Memory Queue</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Temporary Redis state buffers packets only until delivery confirmation</text>
      </g>

      <!-- Signal 3 -->
      <g transform="translate(0, 64)">
        <rect width="365" height="54" rx="6" fill="#0C1522" stroke="#17283E" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FF5722" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Idempotent Monotonic IDs</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Deterministic deduplication and state ordering across reconnects</text>
      </g>

      <!-- Signal 4 -->
      <g transform="translate(390, 64)">
        <rect width="390" height="54" rx="6" fill="#0C1522" stroke="#17283E" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#FFB300" />
        <text class="mono" x="28" y="21" font-size="11" fill="#F1EEE7" font-weight="700">Near-Zero Infrastructure Footprint</text>
        <text class="sans" x="28" y="39" font-size="10" fill="#8C9BAE">Drastically reduces backend operating costs by eliminating heavy DB clusters</text>
      </g>
    </g>

    <!-- Technology Stack Tags -->
    <g transform="translate(0, 215)">
      <text class="mono" x="0" y="16" font-size="10" fill="#7E8B9B" font-weight="700">STACK:</text>
      
      <!-- Tech badges -->
      <g transform="translate(55, 0)" class="mono" font-size="10" fill="#F1EEE7">
        <rect x="0" y="0" width="85" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="42" y="16" text-anchor="middle">TypeScript</text>

        <rect x="95" y="0" width="85" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="137" y="16" text-anchor="middle">WebSockets</text>

        <rect x="190" y="0" width="70" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="225" y="16" text-anchor="middle">Node.js</text>

        <rect x="270" y="0" width="60" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="300" y="16" text-anchor="middle">Redis</text>

        <rect x="340" y="0" width="60" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="370" y="16" text-anchor="middle">SQLite</text>

        <rect x="410" y="0" width="65" height="24" rx="4" fill="#101D2D" stroke="#1D3450" stroke-width="1" />
        <text x="442" y="16" text-anchor="middle">Docker</text>
      </g>
    </g>
  </g>
</svg>
