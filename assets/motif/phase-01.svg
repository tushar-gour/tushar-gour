<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34">
  <!--
    Phase 01 of 04 — The accent mark is displaced 12px above the neutral baseline.
    It is partially clipped at the top: only the lower 13px are visible,
    as if the mark is arriving from outside the frame.
    This is the most disordered state. The reader begins here.
  -->
  <path d="M0 17H1082" stroke="#8C918A" stroke-width="1" opacity=".55"/>
  <g stroke="#8C918A" stroke-width="3" stroke-linecap="round">
    <path d="M1112 9V25"/>
    <path d="M1130 9V25"/>
    <path d="M1148 9V25"/>
    <path d="M1166 9V25"/>
  </g>
  <!-- Accent: start y=-3, end y=13 — displaced 12px above neutral (y=9–25). Top 3px clipped. -->
  <path d="M1184 -3V13" stroke="#BE6848" stroke-width="3" stroke-linecap="round"/>
</svg>
