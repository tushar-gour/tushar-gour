<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Tushar Gour — Software Engineer</title>
  <desc id="desc">Editorial identity panel. The column separator at x 558 uses the Fifth Mark motif at micro scale: four neutral dashes and one terracotta accent dash, introducing the visual system that resolves across the profile. Bottom row: five marks where the accent is displaced 12 pixels above the neutral baseline — the opening state of a resolution that completes by the final section. Statement: I engineer software that feels considered at the surface and predictable underneath.</desc>

  <!-- Background — warm paper, not sterile white -->
  <rect width="1200" height="390" fill="#F7F4EE"/>

  <!-- Top horizontal rule -->
  <path d="M64 72H1136" stroke="#D6D1C7" stroke-width="1"/>

  <!-- Registration crosshair at the composition junction (top rule ∩ column axis) -->
  <!-- A micro-detail: marks the precise intersection of the two structural lines -->
  <path d="M551 72H565" stroke="#D6D1C7" stroke-width="0.5"/>
  <path d="M558 65V79" stroke="#D6D1C7" stroke-width="0.5"/>

  <!-- Section label -->
  <text x="64" y="52" fill="#6F716D"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="13" font-weight="600" letter-spacing="2.4">TG / SOFTWARE ENGINEER</text>

  <!-- Name block — editorial serif, large, slight negative tracking -->
  <text x="64" y="176" fill="#202320"
    font-family="Georgia,Times New Roman,serif"
    font-size="72" font-weight="400" letter-spacing="-2">Tushar</text>
  <text x="64" y="248" fill="#202320"
    font-family="Georgia,Times New Roman,serif"
    font-size="72" font-weight="400" letter-spacing="-2">Gour</text>

  <!-- Column separator: Fifth Mark motif at 1/4 scale -->
  <!-- Four neutral dashes (same proportion as section dividers) -->
  <g stroke="#D0CBC0" stroke-width="1.5" stroke-linecap="round">
    <path d="M558 145V157"/>
    <path d="M558 165V177"/>
    <path d="M558 185V197"/>
    <path d="M558 205V217"/>
  </g>
  <!-- The fifth (accent) dash — fully settled here, introducing the resolved ideal -->
  <path d="M558 225V237" stroke="#BE6848" stroke-width="2" stroke-linecap="round"/>
  <!-- Micro-annotation: section index, visible only at close inspection or in source -->
  <text x="566" y="237"
    fill="#BE6848"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="9" opacity="0.5">05</text>

  <!-- Statement -->
  <text x="610" y="145" fill="#202320"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="25" font-weight="520">
    <tspan x="610" dy="0">I engineer software that feels</tspan>
    <tspan x="610" dy="38">considered at the surface and</tspan>
    <tspan x="610" dy="38">predictable underneath.</tspan>
  </text>

  <!-- Discipline tags — small caps scale, spaced -->
  <text x="610" y="294" fill="#6F716D"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="13" letter-spacing="1.5">INTERFACE · SERVICES · DATA · DELIVERY · FINISH</text>

  <!-- Bottom horizontal rule — ends before the mark cluster -->
  <path d="M64 326H1028" stroke="#D6D1C7" stroke-width="1"/>

  <!-- Five marks — bottom row -->
  <!-- Four neutral marks: fully settled, establishing the baseline -->
  <g stroke="#8A8D87" stroke-width="3" stroke-linecap="round">
    <path d="M1057 318V334"/>
    <path d="M1075 318V334"/>
    <path d="M1093 318V334"/>
    <path d="M1111 318V334"/>
  </g>
  <!-- Accent mark: displaced 12px above neutral baseline — the profile's opening state -->
  <!-- The reader will watch this settle as they move through the sections below -->
  <path d="M1129 306V322" stroke="#BE6848" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom annotation -->
  <text x="64" y="362" fill="#8A8D87"
    font-family="system-ui,-apple-system,Segoe UI,sans-serif"
    font-size="11" letter-spacing="1.6">THE FIFTH MARK / FIT &amp; FINISH LIVES OUTSIDE THE STACK DIAGRAM</text>
</svg>
