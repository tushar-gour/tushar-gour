<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="62%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141A22"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>

    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C97B4B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C97B4B" stop-opacity="0"/>
    </radialGradient>

    <filter id="tgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#C97B4B" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      @keyframes routeTrace {
        0% { stroke-dashoffset: 400; opacity: 0; }
        10% { opacity: 1; }
        80% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.6; }
      }
      .trace { animation: routeTrace 6s ease-out infinite; }
    </style>
  </defs>

  <!-- Card background + border -->
  <rect width="1200" height="460" rx="14" fill="url(#heroBg)"/>
  <rect width="1200" height="460" rx="14" fill="none" stroke="#2A3340" stroke-width="1.2"/>

  <!-- Left edge accent bar -->
  <rect x="0" y="60" width="4" height="340" rx="2" fill="#C97B4B" opacity="0.6"/>

  <!-- ───────────────────────────────────────
       LEFT PANEL
       ─────────────────────────────────────── -->

  <!-- Top decoration: dash + three dots -->
  <g transform="translate(48, 48)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#C97B4B" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="48" cy="0" r="3" fill="#C97B4B" opacity="0.9"/>
    <circle cx="62" cy="0" r="3" fill="#C97B4B" opacity="0.9"/>
    <circle cx="76" cy="0" r="3" fill="#C97B4B" opacity="0.9"/>
  </g>

  <!-- TUSHAR GOUR headline -->
  <g transform="translate(48, 140)">
    <text class="sans" font-size="82" font-weight="900" fill="#EDE8E0" letter-spacing="-1.5" x="0" y="0">TUSHAR</text>
    <text class="sans" x="410" y="0" font-size="82" font-weight="900" fill="#C97B4B" letter-spacing="-1.5">GOUR</text>
  </g>

  <!-- SOFTWARE ENGINEER subtitle -->
  <text class="mono" x="48" y="180" font-size="20" font-weight="700" fill="#8A9299" letter-spacing="4">SOFTWARE ENGINEER</text>

  <!-- Specialty icons row — y=222 -->
  <g transform="translate(48, 222)" fill="none" stroke="#7A8490" stroke-width="1.6">
    <!-- PRODUCT hexagon -->
    <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" transform="translate(10,0)" stroke="#7A8490"/>
    <text class="mono" x="26" y="6" font-size="16" fill="#A0AAB5" font-weight="700" letter-spacing="1.5">PRODUCT</text>

    <circle cx="132" cy="0" r="3" fill="#505860" stroke="none"/>

    <!-- BACKEND layers -->
    <g transform="translate(152, 0)">
      <rect x="-10" y="-10" width="20" height="6" rx="1.5" stroke="#7A8490"/>
      <rect x="-10" y="-1" width="20" height="6" rx="1.5" stroke="#7A8490"/>
      <rect x="-10" y="8" width="20" height="6" rx="1.5" stroke="#7A8490"/>
    </g>
    <text class="mono" x="170" y="6" font-size="16" fill="#A0AAB5" font-weight="700" letter-spacing="1.5">BACKEND</text>

    <circle cx="282" cy="0" r="3" fill="#505860" stroke="none"/>

    <!-- DATA cylinder -->
    <g transform="translate(302, 0)">
      <ellipse cx="0" cy="-7" rx="9" ry="4" stroke="#7A8490"/>
      <line x1="-9" y1="-7" x2="-9" y2="7" stroke="#7A8490"/>
      <line x1="9" y1="-7" x2="9" y2="7" stroke="#7A8490"/>
      <ellipse cx="0" cy="7" rx="9" ry="4" stroke="#7A8490"/>
    </g>
    <text class="mono" x="320" y="6" font-size="16" fill="#A0AAB5" font-weight="700" letter-spacing="1.5">DATA</text>

    <circle cx="396" cy="0" r="3" fill="#505860" stroke="none"/>

    <!-- AI node -->
    <g transform="translate(416, 0)">
      <circle cx="0" cy="0" r="8" stroke="#7A8490"/>
      <line x1="-12" y1="0" x2="-8" y2="0" stroke="#7A8490"/>
      <line x1="8" y1="0" x2="12" y2="0" stroke="#7A8490"/>
      <line x1="0" y1="-12" x2="0" y2="-8" stroke="#7A8490"/>
      <line x1="0" y1="8" x2="0" y2="12" stroke="#7A8490"/>
      <circle cx="0" cy="0" r="3" fill="#7A8490" stroke="none"/>
    </g>
    <text class="mono" x="434" y="6" font-size="16" fill="#A0AAB5" font-weight="700" letter-spacing="1.5">AI</text>

    <circle cx="482" cy="0" r="3" fill="#505860" stroke="none"/>

    <!-- CLOUD -->
    <g transform="translate(502, 0)">
      <path d="M -12,5 Q -14,-2 -7,-6 Q -4,-14 6,-9 Q 14,-9 14,-2 Q 18,0 15,7 H -10 Q -14,7 -12,5 Z" stroke="#7A8490"/>
    </g>
    <text class="mono" x="522" y="6" font-size="16" fill="#A0AAB5" font-weight="700" letter-spacing="1.5">CLOUD</text>
  </g>

  <!-- Divider line -->
  <line x1="48" y1="250" x2="620" y2="250" stroke="#1E2830" stroke-width="1.4"/>

  <!-- Body paragraph text -->
  <g transform="translate(48, 282)" class="sans" font-size="17" fill="#8E99A6" font-weight="400">
    <text dy="0" letter-spacing="0.2">I engineer production systems from first principles to production operation,</text>
    <text dy="26" letter-spacing="0.2">spanning product interfaces, backend services, data systems, AI capabilities,</text>
    <text dy="52" letter-spacing="0.2">cloud infrastructure, and deployment. I focus on delivering complete software</text>
    <text dy="78" letter-spacing="0.2">systems that are observable, maintainable, resilient, and designed to operate</text>
    <text dy="104" letter-spacing="0.2">under real-world conditions.</text>
  </g>

  <!-- ───────────────────────────────────────
       RIGHT PANEL — Technical Schematic (Centered at 930, 230)
       ─────────────────────────────────────── -->

  <!-- Top-right horizontal trace + curve + arrow -->
  <path d="M 780 72 L 1070 72 Q 1095 72 1095 97 L 1095 140" fill="none" stroke="#C97B4B" stroke-width="1.6" opacity="0.8" stroke-linecap="round"/>
  <path d="M 1095 86 L 1115 72 M 1115 72 L 1102 62 M 1115 72 L 1102 82" fill="none" stroke="#C97B4B" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>

  <!-- Bottom-left connector -->
  <path d="M 680 340 L 740 340 L 740 400 L 800 400" fill="none" stroke="#C97B4B" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>
  <circle cx="740" cy="370" r="5.5" fill="none" stroke="#C97B4B" stroke-width="1.4" opacity="0.55"/>
  <circle cx="700" cy="400" r="11" fill="none" stroke="#C97B4B" stroke-width="1.3" opacity="0.45"/>

  <!-- Dot grid -->
  <g fill="#2E3840" opacity="0.85">
    <circle cx="1020" cy="330" r="1.8"/><circle cx="1045" cy="330" r="1.8"/><circle cx="1070" cy="330" r="1.8"/><circle cx="1095" cy="330" r="1.8"/><circle cx="1120" cy="330" r="1.8"/><circle cx="1145" cy="330" r="1.8"/>
    <circle cx="1020" cy="355" r="1.8"/><circle cx="1045" cy="355" r="1.8"/><circle cx="1070" cy="355" r="1.8"/><circle cx="1095" cy="355" r="1.8"/><circle cx="1120" cy="355" r="1.8"/><circle cx="1145" cy="355" r="1.8"/>
    <circle cx="1020" cy="380" r="1.8"/><circle cx="1045" cy="380" r="1.8"/><circle cx="1070" cy="380" r="1.8"/><circle cx="1095" cy="380" r="1.8"/><circle cx="1120" cy="380" r="1.8"/><circle cx="1145" cy="380" r="1.8"/>
    <circle cx="1020" cy="405" r="1.8"/><circle cx="1045" cy="405" r="1.8"/><circle cx="1070" cy="405" r="1.8"/><circle cx="1095" cy="405" r="1.8"/><circle cx="1120" cy="405" r="1.8"/><circle cx="1145" cy="405" r="1.8"/>
  </g>

  <!-- Large outer glow circle -->
  <circle cx="930" cy="230" r="150" fill="url(#circleGlow)"/>
  <circle cx="930" cy="230" r="144" fill="none" stroke="#2A3340" stroke-width="1.8"/>

  <!-- Compass cross-hair lines -->
  <line x1="930" y1="86" x2="930" y2="374" stroke="#1E2830" stroke-width="1.4"/>
  <line x1="786" y1="230" x2="1074" y2="230" stroke="#1E2830" stroke-width="1.4"/>

  <!-- Cardinal squares -->
  <rect x="922" y="80" width="16" height="16" rx="2.5" fill="#0D1218" stroke="#2E3A46" stroke-width="1.6"/>
  <rect x="922" y="364" width="16" height="16" rx="2.5" fill="#0D1218" stroke="#2E3A46" stroke-width="1.6"/>
  <rect x="780" y="222" width="16" height="16" rx="2.5" fill="#0D1218" stroke="#2E3A46" stroke-width="1.6"/>
  <rect x="1064" y="222" width="16" height="16" rx="2.5" fill="#0D1218" stroke="#2E3A46" stroke-width="1.6"/>

  <!-- Inner circle -->
  <circle cx="930" cy="230" r="108" fill="none" stroke="#1A2230" stroke-width="1.2"/>

  <!-- ── TG MONOGRAM ── -->
  <!-- T -->
  <g transform="translate(868, 180)" filter="url(#tgGlow)">
    <rect x="0" y="0" width="82" height="16" rx="3.5" fill="#E8E2D8"/>
    <rect x="30" y="16" width="22" height="74" rx="2.5" fill="#E8E2D8"/>
  </g>

  <!-- G -->
  <g transform="translate(930, 180)" filter="url(#tgGlow)">
    <path d="M 72,44 A 44,44 0 1 0 72,54 L 46,54 L 46,44 Z" fill="#C97B4B"/>
    <path d="M 60,42 A 28,30 0 1 0 60,54 L 46,54 L 46,42 Z" fill="#121820"/>
    <rect x="46" y="38" width="26" height="14" rx="2.5" fill="#C97B4B"/>
  </g>

  <!-- Signal trace animation -->
  <path d="M 930 72 L 1020 72" fill="none" stroke="#C97B4B" stroke-width="1.8" stroke-dasharray="120" stroke-dashoffset="120" class="trace" opacity="0.85"/>
</svg>
