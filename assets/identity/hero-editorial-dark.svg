<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      .serif-display {
        font-family: Georgia, 'Times New Roman', 'Source Serif Pro', serif;
        font-weight: 700;
        letter-spacing: -2.5px;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Base Editorial Frame (60% Graphite Base) -->
  <rect width="1200" height="400" rx="12" fill="#0D1117" stroke="#28313A" stroke-width="1" />

  <!-- Partial 3% Technical Construction Grid (Right Side Only) -->
  <g stroke="#F0EEE8" stroke-width="0.75" opacity="0.035">
    <line x1="640" y1="40" x2="1152" y2="40" />
    <line x1="640" y1="80" x2="1152" y2="80" />
    <line x1="640" y1="120" x2="1152" y2="120" />
    <line x1="640" y1="160" x2="1152" y2="160" />
    <line x1="640" y1="200" x2="1152" y2="200" />
    <line x1="640" y1="240" x2="1152" y2="240" />
    <line x1="640" y1="280" x2="1152" y2="280" />
    <line x1="640" y1="320" x2="1152" y2="320" />
    <line x1="640" y1="360" x2="1152" y2="360" />
    <line x1="640" y1="40" x2="640" y2="360" />
    <line x1="720" y1="40" x2="720" y2="360" />
    <line x1="800" y1="40" x2="800" y2="360" />
    <line x1="880" y1="40" x2="880" y2="360" />
    <line x1="960" y1="40" x2="960" y2="360" />
    <line x1="1040" y1="40" x2="1040" y2="360" />
    <line x1="1120" y1="40" x2="1120" y2="360" />
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 48)">
    <text class="mono-meta" x="0" y="0" font-size="20" fill="#C96A4B">01</text>
    <text class="mono-meta" x="38" y="0" font-size="20" fill="#7B858F">/ IDENTITY</text>
    
    <text class="mono-meta" x="1104" y="0" font-size="18" fill="#5F6974" text-anchor="end">PROFILE // 2026</text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#1C252E" stroke-width="1" />

  <!-- LEFT SIDE: Oversized Dominant Typography (~65% Width) -->
  <g transform="translate(48, 175)">
    <!-- Main Display Name (104px Source Size) -->
    <text class="serif-display" x="0" y="0" font-size="104" fill="#F0EEE8">
      Tushar Gour
    </text>

    <!-- Subtitle & Role Scope (24px / 28px) -->
    <g transform="translate(4, 48)">
      <text class="mono-meta" x="0" y="0" font-size="20" fill="#C96A4B">SOFTWARE ENGINEER</text>
      <text class="sans-bold" x="250" y="0" font-size="22" fill="#D7D5CF">·&nbsp; MOBILE · WEB · BACKEND · SYSTEMS</text>
    </g>

    <!-- Concise Two-Line Positioning Statement (25px) -->
    <g transform="translate(4, 94)">
      <text class="sans-medium" x="0" y="0" font-size="25" fill="#7B858F">
        Building production software across interfaces, services,
      </text>
      <text class="sans-medium" x="0" y="34" font-size="25" fill="#7B858F">
        data architectures, and cloud infrastructure.
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: Abstract 4-Plane Geometric System Path (~35% Width) -->
  <g transform="translate(740, 110)">
    <!-- Plane 1: Surface -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="25" x2="380" y2="25" stroke="#28313A" stroke-width="1" />
      <text class="mono-meta" x="0" y="10" font-size="18" fill="#7B858F">01 SURFACE</text>
    </g>

    <!-- Plane 2: Services (Active Layer) -->
    <g transform="translate(30, 65)">
      <line x1="0" y1="25" x2="350" y2="25" stroke="#28313A" stroke-width="1" />
      <text class="mono-meta" x="0" y="10" font-size="18" fill="#C96A4B">02 SERVICES</text>
    </g>

    <!-- Plane 3: Data -->
    <g transform="translate(60, 130)">
      <line x1="0" y1="25" x2="320" y2="25" stroke="#28313A" stroke-width="1" />
      <text class="mono-meta" x="0" y="10" font-size="18" fill="#7B858F">03 DATA PLANE</text>
    </g>

    <!-- Plane 4: Delivery -->
    <g transform="translate(90, 195)">
      <line x1="0" y1="25" x2="290" y2="25" stroke="#28313A" stroke-width="1" />
      <text class="mono-meta" x="0" y="10" font-size="18" fill="#7B858F">04 INFRASTRUCTURE</text>
    </g>

    <!-- Connecting Traversing Path (Terracotta & Steel) -->
    <path d="M 120 25 L 180 90 L 220 155 L 260 220" 
          fill="none" stroke="#28313A" stroke-width="1.5" />
    <path d="M 120 25 L 180 90" 
          fill="none" stroke="#C96A4B" stroke-width="2" />

    <!-- Traversal Nodes -->
    <circle cx="120" cy="25" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
    <circle cx="180" cy="90" r="5.5" fill="#C96A4B" />
    <circle cx="220" cy="155" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
    <circle cx="260" cy="220" r="4" fill="#0D1117" stroke="#7B858F" stroke-width="1.5" />
  </g>

  <!-- Bottom System Continuum & Fifth Mark -->
  <line x1="48" y1="355" x2="1152" y2="355" stroke="#1C252E" stroke-width="1" />

  <g transform="translate(48, 380)">
    <text class="mono-meta" x="0" y="0" font-size="18" fill="#5F6974">
      INTERFACE &nbsp;→&nbsp; SERVICES &nbsp;→&nbsp; DATA &nbsp;→&nbsp; INFRASTRUCTURE
    </text>
  </g>

  <!-- Fifth Mark Signature Motif (Bottom Right) -->
  <g transform="translate(1088, 368)" stroke-width="3.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#28313A" />
    <line x1="14" y1="0" x2="14" y2="16" stroke="#28313A" />
    <line x1="28" y1="0" x2="28" y2="16" stroke="#28313A" />
    <line x1="42" y1="0" x2="42" y2="16" stroke="#28313A" />
    <line x1="56" y1="0" x2="56" y2="16" stroke="#C96A4B" />
  </g>
</svg>
