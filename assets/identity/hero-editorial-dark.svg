<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="62%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141A22"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>

    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C97B4B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C97B4B" stop-opacity="0"/>
    </radialGradient>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#C97B4B" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      @keyframes signalPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .pulse { animation: signalPulse 2.8s ease-in-out infinite; }

      @keyframes routeTrace {
        0% { stroke-dashoffset: 400; opacity: 0; }
        10% { opacity: 1; }
        80% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.6; }
      }
      .trace { animation: routeTrace 6s ease-out infinite; }
    </style>
  </defs>

  <!-- Card background + border -->
  <rect width="1200" height="420" rx="12" fill="url(#heroBg)"/>
  <rect width="1200" height="420" rx="12" fill="none" stroke="#2A3340" stroke-width="1.2"/>

  <!-- ───────────────────────────────────────
       LEFT PANEL  (x: 44 → 555)
       ─────────────────────────────────────── -->

  <!-- Top decoration: dash + three dots -->
  <g transform="translate(44, 46)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#C97B4B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="0" r="2.2" fill="#C97B4B" opacity="0.9"/>
    <circle cx="48" cy="0" r="2.2" fill="#C97B4B" opacity="0.9"/>
    <circle cx="58" cy="0" r="2.2" fill="#C97B4B" opacity="0.9"/>
  </g>

  <!-- TUSHAR GOUR headline -->
  <g transform="translate(44, 140)">
    <!-- TUSHAR — off-white / cream -->
    <text class="sans" font-size="76" font-weight="900" fill="#EDE8E0" letter-spacing="-1" x="0" y="0">TUSHAR</text>
    <!-- GOUR — terracotta, same baseline -->
    <text class="sans" x="380" y="0" font-size="76" font-weight="900" fill="#C97B4B" letter-spacing="-1">GOUR</text>
  </g>

  <!-- SOFTWARE ENGINEER subtitle -->
  <text class="mono" x="44" y="174" font-size="14.5" font-weight="600" fill="#8A9299" letter-spacing="5">SOFTWARE ENGINEER</text>

  <!-- Specialty icons row — y=206 -->
  <g transform="translate(44, 206)" fill="none" stroke="#606870" stroke-width="1.3">

    <!-- PRODUCT hexagon icon -->
    <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" transform="translate(8,0)" stroke="#606870"/>
    <text class="mono" x="20" y="5" font-size="11.5" fill="#8A9299" font-weight="600" letter-spacing="1.5">PRODUCT</text>

    <!-- separator dot -->
    <circle cx="103" cy="0" r="2.2" fill="#505860" stroke="none"/>

    <!-- BACKEND — server/layers icon -->
    <g transform="translate(118, 0)">
      <rect x="-8" y="-8" width="16" height="5" rx="1" stroke="#606870"/>
      <rect x="-8" y="-1" width="16" height="5" rx="1" stroke="#606870"/>
      <rect x="-8" y="6" width="16" height="5" rx="1" stroke="#606870"/><!-- no fill, just outline -->
    </g>
    <text class="mono" x="132" y="5" font-size="11.5" fill="#8A9299" font-weight="600" letter-spacing="1.5">BACKEND</text>

    <!-- separator dot -->
    <circle cx="232" cy="0" r="2.2" fill="#505860" stroke="none"/>

    <!-- DATA — cylinder icon -->
    <g transform="translate(248, 0)">
      <ellipse cx="0" cy="-6" rx="8" ry="3.5" stroke="#606870"/>
      <line x1="-8" y1="-6" x2="-8" y2="6" stroke="#606870"/>
      <line x1="8" y1="-6" x2="8" y2="6" stroke="#606870"/>
      <ellipse cx="0" cy="6" rx="8" ry="3.5" stroke="#606870"/>
    </g>
    <text class="mono" x="262" y="5" font-size="11.5" fill="#8A9299" font-weight="600" letter-spacing="1.5">DATA</text>

    <!-- separator dot -->
    <circle cx="313" cy="0" r="2.2" fill="#505860" stroke="none"/>

    <!-- AI — circuit/node icon -->
    <g transform="translate(329, 0)">
      <circle cx="0" cy="0" r="7" stroke="#606870"/>
      <line x1="-11" y1="0" x2="-7" y2="0" stroke="#606870"/>
      <line x1="7" y1="0" x2="11" y2="0" stroke="#606870"/>
      <line x1="0" y1="-11" x2="0" y2="-7" stroke="#606870"/>
      <line x1="0" y1="7" x2="0" y2="11" stroke="#606870"/>
      <circle cx="0" cy="0" r="2.8" fill="#606870" stroke="none"/>
    </g>
    <text class="mono" x="344" y="5" font-size="11.5" fill="#8A9299" font-weight="600" letter-spacing="1.5">AI</text>

    <!-- separator dot -->
    <circle cx="378" cy="0" r="2.2" fill="#505860" stroke="none"/>

    <!-- CLOUD icon -->
    <g transform="translate(394, 0)">
      <path d="M -10,4 Q -12,-2 -6,-5 Q -3,-12 5,-8 Q 12,-8 12,-2 Q 15,0 13,6 H -8 Q -12,6 -10,4 Z" stroke="#606870"/>
    </g>
    <text class="mono" x="410" y="5" font-size="11.5" fill="#8A9299" font-weight="600" letter-spacing="1.5">CLOUD</text>
  </g>

  <!-- Divider line (thin) -->
  <line x1="44" y1="228" x2="538" y2="228" stroke="#1E2830" stroke-width="1"/>

  <!-- Body paragraph text -->
  <g transform="translate(44, 252)" class="sans" font-size="13.5" fill="#7A8490" font-weight="400">
    <text dy="0" letter-spacing="0.15">I engineer production systems from first principles to production operation,</text>
    <text dy="19" letter-spacing="0.15">spanning product interfaces, backend services, data systems, AI capabilities,</text>
    <text dy="38" letter-spacing="0.15">cloud infrastructure, and deployment. I focus on delivering complete software</text>
    <text dy="57" letter-spacing="0.15">systems that are observable, maintainable, resilient, and designed to operate</text>
    <text dy="76" letter-spacing="0.15">under real-world conditions.</text>
  </g>

  <!-- Left edge accent bar -->
  <rect x="0" y="80" width="3" height="260" rx="1.5" fill="#C97B4B" opacity="0.35"/>

  <!-- ───────────────────────────────────────
       RIGHT PANEL — Technical Schematic
       Center: (910, 210)
       ─────────────────────────────────────── -->

  <!-- Outer geometric guides / circuit traces -->

  <!-- Top-right: horizontal trace + upward curve + arrow -->
  <path d="M 780 72 L 1060 72 Q 1080 72 1080 92 L 1080 130" fill="none" stroke="#C97B4B" stroke-width="1.4" opacity="0.75" stroke-linecap="round"/>
  <path d="M 1080 80 L 1100 72 M 1100 72 L 1090 64 M 1100 72 L 1090 80" fill="none" stroke="#C97B4B" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Bottom-left of right panel: L-shaped connector -->
  <path d="M 660 315 L 720 315 L 720 370 L 780 370" fill="none" stroke="#C97B4B" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <!-- Small circle at junction -->
  <circle cx="720" cy="340" r="5" fill="none" stroke="#C97B4B" stroke-width="1.3" opacity="0.5"/>
  <circle cx="680" cy="370" r="10" fill="none" stroke="#C97B4B" stroke-width="1.2" opacity="0.45"/>

  <!-- Dot grid — bottom right quadrant -->
  <g fill="#2E3840" opacity="0.85">
    <circle cx="1020" cy="310" r="1.5"/><circle cx="1040" cy="310" r="1.5"/><circle cx="1060" cy="310" r="1.5"/><circle cx="1080" cy="310" r="1.5"/><circle cx="1100" cy="310" r="1.5"/><circle cx="1120" cy="310" r="1.5"/><circle cx="1140" cy="310" r="1.5"/>
    <circle cx="1020" cy="328" r="1.5"/><circle cx="1040" cy="328" r="1.5"/><circle cx="1060" cy="328" r="1.5"/><circle cx="1080" cy="328" r="1.5"/><circle cx="1100" cy="328" r="1.5"/><circle cx="1120" cy="328" r="1.5"/><circle cx="1140" cy="328" r="1.5"/>
    <circle cx="1020" cy="346" r="1.5"/><circle cx="1040" cy="346" r="1.5"/><circle cx="1060" cy="346" r="1.5"/><circle cx="1080" cy="346" r="1.5"/><circle cx="1100" cy="346" r="1.5"/><circle cx="1120" cy="346" r="1.5"/><circle cx="1140" cy="346" r="1.5"/>
    <circle cx="1020" cy="364" r="1.5"/><circle cx="1040" cy="364" r="1.5"/><circle cx="1060" cy="364" r="1.5"/><circle cx="1080" cy="364" r="1.5"/><circle cx="1100" cy="364" r="1.5"/><circle cx="1120" cy="364" r="1.5"/><circle cx="1140" cy="364" r="1.5"/>
    <circle cx="1020" cy="382" r="1.5"/><circle cx="1040" cy="382" r="1.5"/><circle cx="1060" cy="382" r="1.5"/><circle cx="1080" cy="382" r="1.5"/><circle cx="1100" cy="382" r="1.5"/><circle cx="1120" cy="382" r="1.5"/><circle cx="1140" cy="382" r="1.5"/>
  </g>

  <!-- Small dot grid top right -->
  <g fill="#2A3340" opacity="0.7">
    <circle cx="770" cy="50" r="1.5"/><circle cx="790" cy="50" r="1.5"/><circle cx="810" cy="50" r="1.5"/>
    <circle cx="770" cy="65" r="1.5"/><circle cx="790" cy="65" r="1.5"/><circle cx="810" cy="65" r="1.5"/>
    <circle cx="770" cy="80" r="1.5"/><circle cx="790" cy="80" r="1.5"/><circle cx="810" cy="80" r="1.5"/>
  </g>

  <!-- Large outer glow circle fill -->
  <circle cx="910" cy="210" r="132" fill="url(#circleGlow)"/>

  <!-- Large outer circle (thin line) -->
  <circle cx="910" cy="210" r="128" fill="none" stroke="#2A3340" stroke-width="1.5"/>

  <!-- Compass cross-hair lines -->
  <line x1="910" y1="82" x2="910" y2="338" stroke="#1E2830" stroke-width="1.2"/>
  <line x1="782" y1="210" x2="1038" y2="210" stroke="#1E2830" stroke-width="1.2"/>

  <!-- Small squares at cardinal points on circle -->
  <!-- Top -->
  <rect x="903" y="76" width="14" height="14" rx="2" fill="#0D1218" stroke="#2E3A46" stroke-width="1.4"/>
  <!-- Bottom -->
  <rect x="903" y="330" width="14" height="14" rx="2" fill="#0D1218" stroke="#2E3A46" stroke-width="1.4"/>
  <!-- Left -->
  <rect x="776" y="203" width="14" height="14" rx="2" fill="#0D1218" stroke="#2E3A46" stroke-width="1.4"/>
  <!-- Right -->
  <rect x="1030" y="203" width="14" height="14" rx="2" fill="#0D1218" stroke="#2E3A46" stroke-width="1.4"/>

  <!-- Small squares at 45° corners (outside/near circle) -->
  <rect x="816" y="116" width="10" height="10" rx="1.5" fill="none" stroke="#2A3340" stroke-width="1.3"/>
  <rect x="994" y="116" width="10" height="10" rx="1.5" fill="none" stroke="#2A3340" stroke-width="1.3"/>
  <rect x="816" y="294" width="10" height="10" rx="1.5" fill="none" stroke="#2A3340" stroke-width="1.3"/>
  <rect x="994" y="294" width="10" height="10" rx="1.5" fill="none" stroke="#2A3340" stroke-width="1.3"/>

  <!-- Outer ring tick marks -->
  <g stroke="#2E3A46" stroke-width="1">
    <line x1="910" y1="82" x2="910" y2="94"/>
    <line x1="910" y1="326" x2="910" y2="338"/>
    <line x1="782" y1="210" x2="794" y2="210"/>
    <line x1="1026" y1="210" x2="1038" y2="210"/>
    <!-- 45° ticks -->
    <line x1="819" y1="119" x2="828" y2="128"/>
    <line x1="1001" y1="119" x2="992" y2="128"/>
    <line x1="819" y1="301" x2="828" y2="292"/>
    <line x1="1001" y1="301" x2="992" y2="292"/>
  </g>

  <!-- Inner thin circle -->
  <circle cx="910" cy="210" r="96" fill="none" stroke="#1A2230" stroke-width="1"/>

  <!-- Outer larger guide marks (PCB style connector dots) -->
  <circle cx="910" cy="72" r="3.5" fill="none" stroke="#C97B4B" stroke-width="1.3" opacity="0.6"/>
  <circle cx="910" cy="348" r="3.5" fill="none" stroke="#3A4858" stroke-width="1.3"/>
  <circle cx="776" cy="210" r="3.5" fill="none" stroke="#3A4858" stroke-width="1.3"/>
  <circle cx="1044" cy="210" r="3.5" fill="none" stroke="#3A4858" stroke-width="1.3"/>

  <!-- Connecting exterior traces from circle edges -->
  <!-- Top to top-right arrow trace -->
  <line x1="910" y1="72" x2="910" y2="60" stroke="#C97B4B" stroke-width="1.3" opacity="0.7"/>
  <!-- Right side horizontal trace -->
  <line x1="1044" y1="210" x2="1075" y2="210" stroke="#2E3A46" stroke-width="1.3"/>

  <!-- Bottom circuit traces -->
  <path d="M 910 348 L 910 370 L 855 370" fill="none" stroke="#2A3840" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── TG MONOGRAM ── -->
  <!-- T — white/cream, left side of center -->
  <g transform="translate(855, 168)" filter="url(#tgGlow)">
    <!-- T crossbar -->
    <rect x="0" y="0" width="72" height="14" rx="3" fill="#E8E2D8"/>
    <!-- T vertical stem -->
    <rect x="26" y="14" width="20" height="64" rx="2" fill="#E8E2D8"/>
  </g>

  <!-- G — terracotta, right side, overlapping slightly -->
  <g transform="translate(910, 168)" filter="url(#tgGlow)">
    <!-- G outer arc -->
    <path d="M 62,38 A 38,38 0 1 0 62,46 L 40,46 L 40,38 Z" fill="#C97B4B"/>
    <!-- G cutout (dark) -->
    <path d="M 52,36 A 24,26 0 1 0 52,46 L 40,46 L 40,36 Z" fill="#121820"/>
    <!-- G horizontal bar -->
    <rect x="40" y="34" width="22" height="12" rx="2" fill="#C97B4B"/>
  </g>

  <!-- Animated signal trace coming from outer circle top -->
  <path d="M 910 72 L 1000 72" fill="none" stroke="#C97B4B" stroke-width="1.5" stroke-dasharray="120" stroke-dashoffset="120" class="trace" opacity="0.8"/>
</svg>
