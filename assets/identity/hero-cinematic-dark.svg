<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06090D" />
    </linearGradient>

    <radialGradient id="glowEmber" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FF6B4A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080B10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAccent" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#BE6848" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B10" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1EEE7" />
      <stop offset="100%" stop-color="#D98362" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#D98362" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Embedded CSS Animations -->
    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes scanline {
        0% { transform: translateY(-440px); }
        100% { transform: translateY(440px); }
      }
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ping {
        0% { r: 3; opacity: 1; }
        100% { r: 12; opacity: 0; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .hud-title {
        font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .hud-mono {
        font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      }
      .hud-sans {
        font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif;
      }

      .pulse-beacon {
        animation: pulseSlow 2.5s infinite ease-in-out;
      }
      .radar-sweep {
        transform-origin: 1040px 140px;
        animation: radarRotate 8s linear infinite;
      }
      .ping-bubble {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .stream-line {
        stroke-dasharray: 8 6;
        animation: dataFlow 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Panel with Border -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" />
  <rect width="1200" height="440" rx="16" fill="url(#glowEmber)" />
  <rect width="1200" height="440" rx="16" fill="url(#glowAccent)" />

  <!-- Technical Grid overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="0.5">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M120 0 V440 M240 0 V440 M360 0 V440 M480 0 V440 M600 0 V440 M720 0 V440 M840 0 V440 M960 0 V440 M1080 0 V440" />
  </g>

  <!-- Top Telemetry Header -->
  <g class="hud-mono" font-size="11" fill="#7E8B9B">
    <!-- Live Status Pill -->
    <rect x="48" y="32" width="164" height="26" rx="13" fill="#131B26" stroke="#223147" stroke-width="1" />
    <circle cx="64" cy="45" r="4" fill="#FF5722" filter="url(#glow)" />
    <circle class="ping-bubble" cx="64" cy="45" r="4" fill="none" stroke="#FF5722" stroke-width="1.5" />
    <text x="76" y="49" fill="#F1EEE7" font-weight="600" letter-spacing="1">SYSTEM ONLINE</text>

    <!-- Location & Coordinates -->
    <text x="236" y="49" letter-spacing="1">LOC // INDORE, IN [22.7196°N 75.8577°E]</text>
    <text x="940" y="49" text-anchor="end" letter-spacing="1">ROLE // FULL-STACK &amp; SYSTEMS</text>
    <rect x="960" y="32" width="192" height="26" rx="4" fill="#131B26" stroke="#223147" stroke-width="1" />
    <text x="1056" y="49" fill="#D98362" text-anchor="middle" font-weight="bold" letter-spacing="1.5">SYS.VER: v2.6.0-PROD</text>
  </g>

  <line x1="48" y1="74" x2="1152" y2="74" stroke="#1F293D" stroke-width="1" />

  <!-- Radar HUD Telemetry Ornament (Right Side) -->
  <g opacity="0.65">
    <circle cx="1040" cy="170" r="70" fill="none" stroke="#1F293D" stroke-width="1" />
    <circle cx="1040" cy="170" r="46" fill="none" stroke="#223147" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1040" cy="170" r="22" fill="none" stroke="#1F293D" stroke-width="1" />
    <line x1="955" y1="170" x2="1125" y2="170" stroke="#1F293D" stroke-width="0.75" />
    <line x1="1040" y1="85" x2="1040" y2="255" stroke="#1F293D" stroke-width="0.75" />
    <g class="radar-sweep" opacity="0.8">
      <path d="M1040 170 L1100 135 A70 70 0 0 0 1040 100 Z" fill="url(#glowEmber)" opacity="0.4" />
    </g>
    <circle cx="1065" cy="145" r="3" fill="#FF5722" filter="url(#glow)" />
    <text class="hud-mono" x="1040" y="270" fill="#6B7A90" font-size="9" text-anchor="middle" letter-spacing="1">TELEMETRY_RADAR // 100%</text>
  </g>

  <!-- Primary Identity Statement (Left Block) -->
  <!-- Name -->
  <text class="hud-title" x="48" y="165" font-size="64" fill="url(#textGrad)" filter="url(#softGlow)">TUSHAR GOUR</text>
  <text class="hud-title" x="48" y="165" font-size="64" fill="url(#textGrad)">TUSHAR GOUR</text>

  <!-- Tagline Badge -->
  <g transform="translate(48, 185)">
    <rect x="0" y="0" width="440" height="30" rx="6" fill="#141D29" stroke="#FF5722" stroke-opacity="0.4" stroke-width="1" />
    <path d="M0 0 L6 0 L0 6 Z" fill="#FF5722" />
    <text class="hud-mono" x="16" y="20" fill="#FF6B4A" font-size="12" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER &amp; SYSTEMS ARCHITECT</text>
  </g>

  <!-- Engineering Positioning Summary -->
  <text class="hud-sans" x="48" y="250" font-size="16" fill="#A8B5C7" font-weight="400">
    <tspan fill="#F1EEE7" font-weight="600">Engineering production software</tspan> that remains coherent from high-fidelity client surface
  </text>
  <text class="hud-sans" x="48" y="274" font-size="16" fill="#A8B5C7" font-weight="400">
    to the distributed services, real-time message streams, and data infrastructure running underneath.
  </text>

  <!-- System Progression Flow Bar (Bottom) -->
  <g transform="translate(48, 315)">
    <rect x="0" y="0" width="1104" height="85" rx="10" fill="#0C1017" stroke="#1C2638" stroke-width="1.2" />

    <!-- Progress track bar -->
    <path class="stream-line" d="M30 42 H1074" stroke="#FF5722" stroke-width="2" stroke-opacity="0.5" />

    <!-- Step 01: Product Surface -->
    <g transform="translate(30, 16)">
      <rect x="0" y="0" width="220" height="52" rx="6" fill="#111722" stroke="#25354D" stroke-width="1" />
      <circle cx="16" cy="18" r="5" fill="#FF5722" filter="url(#glow)" />
      <text class="hud-mono" x="28" y="22" fill="#F1EEE7" font-size="11" font-weight="700" letter-spacing="1">01 / SURFACE</text>
      <text class="hud-sans" x="16" y="40" fill="#7E8B9B" font-size="11">Flutter · React · TypeScript · Vite</text>
    </g>

    <!-- Step 02: Service Mesh -->
    <g transform="translate(310, 16)">
      <rect x="0" y="0" width="220" height="52" rx="6" fill="#111722" stroke="#25354D" stroke-width="1" />
      <circle cx="16" cy="18" r="5" fill="#D98362" />
      <text class="hud-mono" x="28" y="22" fill="#F1EEE7" font-size="11" font-weight="700" letter-spacing="1">02 / SERVICES</text>
      <text class="hud-sans" x="16" y="40" fill="#7E8B9B" font-size="11">Node.js · Express · Socket.IO · Java</text>
    </g>

    <!-- Step 03: Data & State -->
    <g transform="translate(590, 16)">
      <rect x="0" y="0" width="220" height="52" rx="6" fill="#111722" stroke="#25354D" stroke-width="1" />
      <circle cx="16" cy="18" r="5" fill="#BE6848" />
      <text class="hud-mono" x="28" y="22" fill="#F1EEE7" font-size="11" font-weight="700" letter-spacing="1">03 / DATA PLANE</text>
      <text class="hud-sans" x="16" y="40" fill="#7E8B9B" font-size="11">PostgreSQL · Redis · MongoDB · Prisma</text>
    </g>

    <!-- Step 04: Cloud & Delivery -->
    <g transform="translate(870, 16)">
      <rect x="0" y="0" width="204" height="52" rx="6" fill="#111722" stroke="#25354D" stroke-width="1" />
      <circle cx="16" cy="18" r="5" fill="#8C918A" />
      <text class="hud-mono" x="28" y="22" fill="#F1EEE7" font-size="11" font-weight="700" letter-spacing="1">04 / DELIVERY</text>
      <text class="hud-sans" x="16" y="40" fill="#7E8B9B" font-size="11">AWS · GCP · Docker · CI/CD Pipelines</text>
    </g>
  </g>

  <!-- Subtle Corner Crosshairs -->
  <g stroke="#FF5722" stroke-width="1.5" opacity="0.6">
    <path d="M12 24 H24 M18 18 V30" />
    <path d="M1176 24 H1188 M1182 18 V30" />
    <path d="M12 416 H24 M18 410 V422" />
    <path d="M1176 416 H1188 M1182 410 V422" />
  </g>
</svg>
