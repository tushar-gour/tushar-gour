<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <style>
      .serif-title {
        font-family: Georgia, 'Times New Roman', 'Source Serif Pro', serif;
        font-weight: 400;
        letter-spacing: -1.5px;
      }
      .sans-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="260" fill="#FFFFFF" />

  <!-- Thin Hairline Border -->
  <rect x="1" y="1" width="1198" height="258" rx="8" fill="none" stroke="#D0D7DE" stroke-width="1" />

  <!-- Top Metadata Label -->
  <text class="mono-meta" x="48" y="46" font-size="11" fill="#656D76" font-weight="600" letter-spacing="2">
    TUSHAR GOUR &nbsp;·&nbsp; SOFTWARE ENGINEER
  </text>

  <!-- Main Name Display -->
  <text class="serif-title" x="48" y="128" font-size="64" fill="#1F2328">
    Tushar Gour
  </text>

  <!-- Positioning Subtitle -->
  <text class="sans-body" x="48" y="172" font-size="18" fill="#656D76" font-weight="400">
    Engineering production software across mobile, web, distributed services, and cloud infrastructure.
  </text>

  <!-- Subtle Bottom Hairline Divider -->
  <line x1="48" y1="205" x2="1152" y2="205" stroke="#E1E4E8" stroke-width="1" />

  <!-- System Continuum & Fifth Mark -->
  <g transform="translate(48, 230)">
    <text class="mono-meta" x="0" y="0" font-size="11" fill="#8C959F" letter-spacing="1.5">
      PRODUCT SURFACE &nbsp;—&nbsp; APPLICATION SERVICES &nbsp;—&nbsp; DATA PLANE &nbsp;—&nbsp; INFRASTRUCTURE
    </text>
  </g>

  <!-- Fifth Mark Signature Accent (Bottom Right) -->
  <g transform="translate(1088, 220)" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="12" stroke="#AFB8C1" />
    <line x1="12" y1="0" x2="12" y2="12" stroke="#AFB8C1" />
    <line x1="24" y1="0" x2="24" y2="12" stroke="#AFB8C1" />
    <line x1="36" y1="0" x2="36" y2="12" stroke="#AFB8C1" />
    <line x1="48" y1="0" x2="48" y2="12" stroke="#C86446" />
  </g>
</svg>
