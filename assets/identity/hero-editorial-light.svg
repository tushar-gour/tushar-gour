<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Slow Atmospheric Ambient Drift Animation (Light Mode) -->
    <linearGradient id="heroAtmosphereLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F6">
        <animate attributeName="stop-color" 
                 values="#EEF2F6; #F4EFEA; #EDF1F5; #EEF2F6" 
                 dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#F6F8FA" />
      <stop offset="100%" stop-color="#F2ECE8">
        <animate attributeName="stop-color" 
                 values="#F2ECE8; #EAEFF5; #F5EDE6; #F2ECE8" 
                 dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="terracottaFieldLight" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#B85C3F" stop-opacity="0.06">
        <animate attributeName="stop-opacity" values="0.06; 0.02; 0.08; 0.06" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F6F8FA" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .name-display {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .sans-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 2.5px;
      }
      .sans-scope {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .about-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
        line-height: 1.55;
      }

      @keyframes signalTravelLight {
        0% { stroke-dashoffset: 400; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .traveling-signal-light {
        stroke-dasharray: 80 320;
        animation: signalTravelLight 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="480" rx="12" fill="url(#heroAtmosphereLight)" stroke="#D0D7DE" stroke-width="1" />
  <rect width="1200" height="480" rx="12" fill="url(#terracottaFieldLight)" />

  <!-- Subtle Geometric Construction Marks -->
  <g stroke="#1F2328" stroke-width="0.75" opacity="0.04" fill="none">
    <line x1="48" y1="128" x2="680" y2="128" />
    <line x1="48" y1="172" x2="680" y2="172" stroke-dasharray="4 4" />
    <line x1="48" y1="210" x2="680" y2="210" />
    <line x1="126" y1="90" x2="126" y2="230" stroke-dasharray="2 6" />
    <line x1="580" y1="90" x2="580" y2="230" stroke-dasharray="2 6" />
    <circle cx="560" cy="170" r="140" stroke-dasharray="6 8" />
  </g>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 42)">
    <text class="mono-meta" x="0" y="0" font-size="14" fill="#B85C3F">SYSTEM</text>
    <text class="mono-meta" x="75" y="0" font-size="14" fill="#59636E">/ CORE ENGINEERING IDENTITY</text>
    <text class="mono-meta" x="1104" y="0" font-size="14" fill="#8C959F" text-anchor="end">PROFILE // 2026</text>
  </g>

  <line x1="48" y1="58" x2="1152" y2="58" stroke="#E1E4E8" stroke-width="1" />

  <!-- LEFT SIDE: Identity, Name & Integrated About -->
  <g transform="translate(48, 92)">
    <!-- Geometric TG Monogram Mark -->
    <g transform="translate(0, 4)">
      <rect width="58" height="58" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" />
      <line x1="15" y1="20" x2="43" y2="20" stroke="#1F2328" stroke-width="3" stroke-linecap="round" />
      <line x1="29" y1="20" x2="29" y2="40" stroke="#1F2328" stroke-width="3" stroke-linecap="round" />
      <path d="M 40 29 A 11.5 11.5 0 1 0 40 40 H 32" fill="none" stroke="#59636E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="40" cy="40" r="2.5" fill="#B85C3F" />
    </g>

    <!-- Custom Engineered Display Name -->
    <g transform="translate(76, 0)">
      <text class="name-display" x="3" y="51" font-size="60" fill="none" stroke="#D0D7DE" stroke-width="1.5" opacity="0.6">
        TUSHAR GOUR
      </text>

      <text class="name-display" x="0" y="48" font-size="60" fill="#1F2328">
        TUSHAR GOUR
      </text>

      <line x1="2" y1="56" x2="38" y2="56" stroke="#B85C3F" stroke-width="2.5" stroke-linecap="round" />
      <line x1="44" y1="56" x2="80" y2="56" stroke="#D0D7DE" stroke-width="1.5" />

      <text class="sans-sub" x="2" y="86" font-size="17" fill="#B85C3F">
        SOFTWARE ENGINEER
      </text>

      <text class="sans-scope" x="2" y="114" font-size="14" fill="#59636E">
        PRODUCT &nbsp;·&nbsp; BACKEND &nbsp;·&nbsp; DATA &nbsp;·&nbsp; AI &nbsp;·&nbsp; CLOUD
      </text>
    </g>

    <!-- Integrated Positioning / About Section -->
    <g transform="translate(0, 146)">
      <line x1="0" y1="6" x2="0" y2="108" stroke="#B85C3F" stroke-width="2.5" stroke-linecap="round" />

      <g transform="translate(18, 0)">
        <text class="mono-meta" x="0" y="12" font-size="12" fill="#59636E">ENGINEERING // DELIVERY</text>
        
        <text class="about-text" x="0" y="38" font-size="15" fill="#1F2328">
          I engineer production systems from first principles to production operation, spanning
        </text>
        <text class="about-text" x="0" y="62" font-size="15" fill="#1F2328">
          product interfaces, backend services, data systems, AI capabilities, and cloud
        </text>
        <text class="about-text" x="0" y="86" font-size="15" fill="#1F2328">
          infrastructure. Focused on observable, maintainable, and resilient architecture under load.
        </text>
      </g>
    </g>

    <!-- Minimalist Action Controls -->
    <g transform="translate(18, 276)">
      <a href="https://github.com/tushar-gour" target="_blank">
        <g transform="translate(0, 0)">
          <rect width="36" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
          <path d="M 18 10 C 13.6 10 10 13.6 10 18 C 10 21.5 12.3 24.5 15.5 25.6 C 15.9 25.7 16 25.4 16 25.2 V 23.8 C 13.8 24.3 13.3 22.8 13.3 22.8 C 12.9 21.8 12.4 21.5 12.4 21.5 C 11.7 21 12.5 21 12.5 21 C 13.3 21.1 13.7 21.9 13.7 21.9 C 14.4 23.1 15.5 22.8 15.9 22.6 C 16 22.1 16.2 21.7 16.4 21.5 C 14.6 21.3 12.8 20.6 12.8 17.5 C 12.8 16.6 13.1 15.9 13.6 15.3 C 13.5 15.1 13.2 14.2 13.7 13.1 C 13.7 13.1 14.4 12.9 16 14 C 16.7 13.8 17.4 13.7 18.1 13.7 C 18.8 13.7 19.5 13.8 20.2 14 C 21.8 12.9 22.5 13.1 22.5 13.1 C 23 14.2 22.7 15.1 22.6 15.3 C 23.1 15.9 23.4 16.6 23.4 17.5 C 23.4 20.6 21.5 21.3 19.7 21.5 C 20 21.8 20.2 22.3 20.2 23 V 25.2 C 20.2 25.4 20.4 25.7 20.8 25.6 C 24 24.5 26.3 21.5 26.3 18 C 26.3 13.6 22.7 10 18 10 Z" fill="#1F2328" />
        </g>
      </a>

      <a href="https://linkedin.com/in/tushar-gour" target="_blank">
        <g transform="translate(48, 0)">
          <rect width="36" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
          <path d="M 12 16 H 15 V 25 H 12 Z M 13.5 12 A 1.5 1.5 0 1 1 13.5 15 A 1.5 1.5 0 1 1 13.5 12 Z M 17 16 H 20 V 17.5 C 20.5 16.5 21.8 15.8 23 15.8 C 25.5 15.8 26 17.2 26 19.5 V 25 H 23 V 20 C 23 18.8 22.5 18 21.5 18 C 20.5 18 20 18.8 20 20 V 25 H 17 Z" fill="#1F2328" />
        </g>
      </a>

      <a href="mailto:tushargour004@gmail.com" target="_blank">
        <g transform="translate(96, 0)">
          <rect width="36" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
          <path d="M 12 13 H 24 C 24.6 13 25 13.4 25 14 V 22 C 25 22.6 24.6 23 24 23 H 12 C 11.4 23 11 22.6 11 22 V 14 C 11 13.4 11.4 13 12 13 Z M 12.8 14.5 L 18 18.2 L 23.2 14.5 Z M 12.5 21.5 H 23.5 V 16 L 18 20 L 12.5 16 Z" fill="#1F2328" />
        </g>
      </a>
    </g>
  </g>

  <!-- RIGHT SIDE: Layered Geometric Planes -->
  <g transform="translate(740, 88)">
    <polygon points="40,20 380,20 320,80 0,80" fill="#FFFFFF" opacity="0.8" stroke="#D0D7DE" stroke-width="1" />
    <polygon points="60,80 400,80 340,140 20,140" fill="#FFFFFF" opacity="0.6" stroke="#D0D7DE" stroke-width="1" />
    <polygon points="80,140 420,140 360,200 40,200" fill="#FFFFFF" opacity="0.7" stroke="#D0D7DE" stroke-width="1" />
    <polygon points="100,200 440,200 380,260 60,260" fill="#FFFFFF" opacity="0.5" stroke="#D0D7DE" stroke-width="1" />
    <polygon points="120,260 460,260 400,320 80,320" fill="#FFFFFF" opacity="0.6" stroke="#D0D7DE" stroke-width="1" />

    <text class="mono-meta" x="20" y="55" font-size="13" fill="#59636E">01 // PRODUCT</text>
    <text class="mono-meta" x="40" y="115" font-size="13" fill="#59636E">02 // SERVICES</text>
    <text class="mono-meta" x="60" y="175" font-size="13" fill="#59636E">03 // DATA</text>
    <text class="mono-meta" x="80" y="235" font-size="13" fill="#B85C3F">04 // INTELLIGENCE</text>
    <text class="mono-meta" x="100" y="295" font-size="13" fill="#59636E">05 // DELIVERY</text>

    <path d="M 210 50 L 235 110 L 260 170 L 285 230 L 310 290" 
          fill="none" stroke="#D0D7DE" stroke-width="2" />

    <path class="traveling-signal-light" d="M 210 50 L 235 110 L 260 170 L 285 230 L 310 290" 
          fill="none" stroke="#B85C3F" stroke-width="3" stroke-linecap="round" />

    <circle cx="210" cy="50" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
    <circle cx="235" cy="110" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
    <circle cx="260" cy="170" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
    <circle cx="285" cy="230" r="5.5" fill="#B85C3F" />
    <circle cx="310" cy="290" r="4" fill="#F6F8FA" stroke="#59636E" stroke-width="1.5" />
  </g>
</svg>
