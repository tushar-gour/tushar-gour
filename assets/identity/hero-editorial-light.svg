<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <style>
      .serif-display {
        font-family: Georgia, 'Times New Roman', 'Source Serif Pro', serif;
        font-weight: 400;
        letter-spacing: -2px;
      }
      .sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-label {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Base Editorial Frame -->
  <rect width="1200" height="340" rx="8" fill="url(#heroBgLight)" stroke="#D0D7DE" stroke-width="1.2" />

  <!-- Subtle Architectural Grid Fragment -->
  <g stroke="#E2E8F0" stroke-width="0.75" opacity="0.8">
    <line x1="48" y1="56" x2="1152" y2="56" />
    <line x1="48" y1="240" x2="1152" y2="240" />
    <line x1="580" y1="56" x2="580" y2="240" stroke-dasharray="3 3" />
  </g>

  <!-- Top Metadata Header -->
  <g transform="translate(48, 38)">
    <text class="mono-label" x="0" y="0" font-size="11" fill="#656D76">
      TUSHAR GOUR &nbsp;·&nbsp; SOFTWARE ENGINEER
    </text>
    <text class="mono-label" x="1104" y="0" font-size="11" fill="#8C959F" text-anchor="end">
      FULL-STACK &amp; SYSTEMS ARCHITECTURE
    </text>
  </g>

  <!-- Left Column: Oversized Dominant Typography -->
  <g transform="translate(48, 140)">
    <text class="serif-display" x="0" y="0" font-size="74" fill="#1F2328">
      Tushar Gour
    </text>
    <text class="sans-medium" x="4" y="38" font-size="17" fill="#656D76">
      Full-Stack Software Engineer &nbsp;·&nbsp; <tspan fill="#1F2328">Mobile · Web · Services · Cloud</tspan>
    </text>
    <text class="sans-medium" x="4" y="64" font-size="14" fill="#8C959F">
      Engineering software that feels considered at the surface and predictable underneath.
    </text>
  </g>

  <!-- Right Column: Abstract Geometric System Path -->
  <g transform="translate(630, 90)">
    <path d="M 0 35 L 80 35 L 140 85 L 240 85 L 300 35 L 470 35" 
          fill="none" stroke="#CBD5E1" stroke-width="1.5" />
    
    <path d="M 80 35 L 140 85 L 240 85" 
          fill="none" stroke="#C86446" stroke-width="1.8" />

    <!-- Node 1: Surface -->
    <circle cx="0" cy="35" r="4" fill="#FFFFFF" stroke="#656D76" stroke-width="1.5" />
    <text class="mono-label" x="0" y="16" font-size="9" fill="#656D76" text-anchor="middle">SURFACE</text>

    <!-- Node 2: Services -->
    <circle cx="140" cy="85" r="4.5" fill="#C86446" />
    <text class="mono-label" x="140" y="108" font-size="9" fill="#C86446" text-anchor="middle">SERVICES</text>

    <!-- Node 3: Data -->
    <circle cx="240" cy="85" r="4" fill="#FFFFFF" stroke="#656D76" stroke-width="1.5" />
    <text class="mono-label" x="240" y="108" font-size="9" fill="#656D76" text-anchor="middle">DATA</text>

    <!-- Node 4: Delivery -->
    <circle cx="470" cy="35" r="4" fill="#FFFFFF" stroke="#656D76" stroke-width="1.5" />
    <text class="mono-label" x="470" y="16" font-size="9" fill="#656D76" text-anchor="middle">DELIVERY</text>
  </g>

  <!-- Bottom System Continuum Bar -->
  <g transform="translate(48, 285)">
    <text class="mono-label" x="0" y="0" font-size="11" fill="#8C959F">
      INTERFACE &nbsp;→&nbsp; SERVICES &nbsp;→&nbsp; DATA PLANE &nbsp;→&nbsp; CLOUD INFRASTRUCTURE
    </text>
  </g>

  <!-- Fifth Mark Signature Accent -->
  <g transform="translate(1088, 274)" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#AFB8C1" />
    <line x1="12" y1="0" x2="12" y2="14" stroke="#AFB8C1" />
    <line x1="24" y1="0" x2="24" y2="14" stroke="#AFB8C1" />
    <line x1="36" y1="0" x2="36" y2="14" stroke="#AFB8C1" />
    <line x1="48" y1="0" x2="48" y2="14" stroke="#C86446" />
  </g>
</svg>
