<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBgL" cx="62%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4F8"/>
    </radialGradient>

    <radialGradient id="circleGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B85C3F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#B85C3F" stop-opacity="0"/>
    </radialGradient>

    <filter id="tgGlowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#B85C3F" flood-opacity="0.2" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .sansL { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .monoL { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes traceL { 0%{stroke-dashoffset:120;opacity:0} 10%{opacity:1} 80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0.5} }
      .traceL { animation: traceL 6s ease-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="12" fill="url(#heroBgL)"/>
  <rect width="1200" height="420" rx="12" fill="none" stroke="#D0D7DE" stroke-width="1.2"/>

  <!-- Top decoration -->
  <g transform="translate(44, 46)">
