name: Refresh Language Footprint

on:
  schedule:
    - cron: "0 2 * * *"   # Daily at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - "tools/gen_domain_spectrum.py"  # Re-run whenever the script changes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No extra pip installs needed — script uses stdlib only
      - name: Generate language footprint SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER:  tushar-gour
        run: python tools/gen_domain_spectrum.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry/domain-spectrum-dark.svg \
                  assets/telemetry/domain-spectrum-light.svg
          if git diff --staged --quiet; then
            echo "Language footprint unchanged — nothing to commit."
          else
            git commit -m "chore(telemetry): refresh language footprint [skip ci]"
            git push
          fi
