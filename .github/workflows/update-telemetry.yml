name: Automated Profile Telemetry Refresh

on:
  schedule:
    # Refresh every two hours; scheduled runs are not guaranteed to start exactly on time
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/update_all_telemetry.py'
      - 'tools/build_all_skills_toolchain.py'
      - 'tools/profile_design.py'
      - 'tools/build_light_hero.py'
      - 'assets/identity/hero-gold.png'
      - '.github/workflows/update-telemetry.yml'

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build light-mode hero if needed
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install Pillow numpy
          python tools/build_light_hero.py
          python tools/build_all_skills_toolchain.py
          python tools/enable_themed_hero.py
          python tools/check_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/identity/hero-gold.png assets/identity/hero-gold-light.png assets/skills/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "Apply generated light-mode hero"
            git push origin main
          fi

      - name: Run Telemetry Ingestion Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python tools/update_all_telemetry.py

      - name: Commit and Push Updated Telemetry SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry/ generated/
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): auto-update live contribution pulse and language footprint [skip ci]"
            git push origin main
          fi
